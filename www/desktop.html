<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的世界</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:'Noto Serif SC',serif;
  height:100dvh;position:fixed;inset:0;
  background:linear-gradient(180deg,#f0ecd8 0%,#e4ecc8 25%,#d0e4b8 55%,#b8d8a0 80%,#a0cc90 100%);
  animation:fadeIn 1s ease-out;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* 顶部时间/日期区 */
.top-area{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 8%);
  left:0;width:100%;text-align:center;
}
.clock{font-size:64px;font-weight:300;color:#4a3828;letter-spacing:2px;}
.date{font-size:15px;color:#6a5848;letter-spacing:3px;margin-top:4px;}

/* App网格 */
.app-grid{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,20px) + 10%);
  left:0;width:100%;
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:24px 12px;padding:0 8%;
}
.app{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;transition:transform 0.2s;
}
.app:active{transform:scale(0.9);}
.app-icon{
  width:60px;height:60px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(90,60,40,0.25);
  position:relative;
}
.app-icon svg{border-radius:14px;display:block;}
.app-icon.locked{opacity:0.5;}
.app-name{font-size:12px;color:#4a3828;letter-spacing:1px;}

.icon-wechat{background:linear-gradient(135deg,#4ec16a,#3aad56);}
.icon-vision{background:linear-gradient(135deg,#e8a0b8,#d878a0);}
.icon-mail{background:linear-gradient(135deg,#6ab0e8,#4a90d8);}
.icon-sms{background:linear-gradient(135deg,#8ad078,#6ab858);}
.icon-more{background:linear-gradient(135deg,#c0a8d8,#a888c0);}

.app-badge{
  position:absolute;top:-5px;right:-5px;
  background:#fa5151;color:#fff;min-width:20px;height:20px;
  border-radius:10px;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;border:2px solid #f5e8dc;
}

.lock-tag{
  position:absolute;bottom:-2px;right:-2px;
  font-size:12px;background:rgba(0,0,0,0.3);border-radius:50%;
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
}

/* 提示 */
.toast{
  position:absolute;bottom:30%;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(60,40,30,0.9);color:#f0e0d0;
  padding:10px 20px;border-radius:20px;font-size:13px;letter-spacing:1px;
  opacity:0;pointer-events:none;transition:all 0.3s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 返回秘境 */
.back-garden{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 12px);left:16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,0.3);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#4a3828;z-index:20;
}
.back-garden svg{width:20px;height:20px;}
.rewrite-btn{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 12px);right:16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,0.3);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#4a3828;z-index:20;
}
.rewrite-btn svg{width:18px;height:18px;}
</style>
</head>

</div>

</div>

<div class="toast" id="toast">敬请期待</div>

<script>
function updateClock(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent=`${h}:${m}`;
  const days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('date').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
}
updateClock();
setInterval(updateClock,10000);

function openApp(app){
  if(app==='wechat'){ location.href='wechat-list.html'; }
  else if(app==='mail'){ location.href='email-list.html'; }
  else if(app==='sms'){ location.href='sms-list.html'; }
  else{
    showToast('敬请期待');
  }
}

function showToast(text){
  const t=document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
}

// ── 推送通知：根据人生剧本，安排未来几天会陆续弹出的消息 ──

function buildBackgroundText(script){
  const h = script.hero || {};
  let text = `主角：${h.name||'（未命名）'}，${h.gender==='female'?'女':'男'}`;
  if(h.job) text += `，职业是${h.job}`;
  if(h.character) text += `。性格：${h.character}`;
  if(h.values) text += `。价值观：${h.values}`;
  if(h.desire) text += `。内心最深的渴望：${h.desire}`;
  text += '\n\n';
  (script.scenes||[]).forEach(s=>{
    text += `【场景：${s.name}】\n`;
    if(s.plot) text += `剧情：${s.plot}\n`;
    if(s.highlight) text += `重点戏份：${s.highlight}\n`;
  });
  return text;
}

async function generateNotificationTexts(script){
  const bg = buildBackgroundText(script);
  const sysPrompt = '你是一个「已实现人生」通知文案生成器。仔细阅读用户写下的每一个场景（可能是事业、学术、健康、创作、心灵成长、人际关系、财富等任何主题），生成5条会作为手机通知弹出的简短暗示性文案，营造"你已经拥有/正在经历这一切"的氛围感。内容类型必须由场景内容本身决定，不要预设任何特定主题（不要默认往财富或奢侈品方向靠）。人物姓名和称呼要现代、自然，绝对不用"张叔""老王""老刘""老李""王姐""美女""小姑娘"这类老式、市井气或轻视意味的称呼。重要：不要涉及银行、转账、具体到账金额，不要使用真实存在的机构官方名称，每条不超过40字，语气温暖、有画面感，像轻声提醒，不要用感叹号堆砌。';
  const userPrompt = `${bg}\n请生成5条通知文案。严格按照如下格式输出，每条一行，不要编号，不要有其他内容。`;

  try{
    const res = await fetch('https://api.freedreleasing.com/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model:'deepseek-chat', max_tokens:600,
        messages:[ {role:'system',content:sysPrompt}, {role:'user',content:userPrompt} ] }),
    });
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content?.trim() || '';
    const lines = reply.split('\n').map(l=>l.trim()).filter(l=>l);
    return lines.length>0 ? lines : null;
  }catch(e){ console.error('生成通知文案失败', e); return null; }
}

async function setupNotifications(){
  // 只在真正打包的App里才有这个原生能力，网页预览环境里没有，直接跳过
  if(!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.LocalNotifications) return;
  const { LocalNotifications } = window.Capacitor.Plugins;

  let script = null;
  try{ script = JSON.parse(localStorage.getItem('lifeScript')||'null'); }catch(e){}
  if(!script || !script.hero || !script.hero.name) return; // 还没写过剧本，不安排推送

  try{
    const perm = await LocalNotifications.requestPermissions();
    if(perm.display !== 'granted'){ showToast('没有通知权限，无法安排推送'); return; }

    // 已经排着的够多就不用再生成新的了（iOS最多同时排64条，这里只保持一个小队列）
    const pending = await LocalNotifications.getPending();
    if(pending.notifications && pending.notifications.length > 0){
      // 【测试阶段】先清掉旧的排程（可能是之前用长延迟排的），确保这次是干净的短延迟测试
      await LocalNotifications.cancel({ notifications: pending.notifications.map(n=>({id:n.id})) });
    }

    const texts = await generateNotificationTexts(script);
    if(!texts){ showToast('生成推送文案失败，稍后重试'); return; }

    const baseId = Date.now() % 1000000;
    const notifications = texts.map((text, i) => {
      // 【测试阶段】延迟很短，方便马上验证；确认没问题后会调回更真实的间隔（几小时到几天）
      const delayMs = (60 + i*90 + Math.random()*60) * 1000; // 第1条约1分钟后，之后每条间隔1.5分钟左右
      return {
        id: baseId + i,
        title: 'Manifest',
        body: text,
        schedule: { at: new Date(Date.now() + delayMs) },
        extra: { page: 'wechat-list.html' },
      };
    });

    await LocalNotifications.schedule({ notifications });
    showToast(`已安排${notifications.length}条推送（测试模式，1分钟后开始弹出）`);
  }catch(e){
    console.error('推送安排失败', e);
    showToast('推送安排出错：' + (e.message || e));
  }
}

// 监听：点击通知后，跳转到对应页面（比如微信列表）
try{
  if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications){
    window.Capacitor.Plugins.LocalNotifications.addListener('localNotificationActionPerformed', (action) => {
      const page = action?.notification?.extra?.page;
      if(page) location.href = page;
    });
  }
}catch(e){}

setupNotifications();
</script>
