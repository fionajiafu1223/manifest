<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的世界</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:'Noto Serif SC',serif;
  height:100dvh;position:fixed;inset:0;
  background:linear-gradient(180deg,#f0ecd8 0%,#e4ecc8 25%,#d0e4b8 55%,#b8d8a0 80%,#a0cc90 100%);
  animation:fadeIn 1s ease-out;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* 顶部时间/日期区 */
.top-area{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 8%);
  left:0;width:100%;text-align:center;
}
.clock{font-size:64px;font-weight:300;color:#4a3828;letter-spacing:2px;}
.date{font-size:15px;color:#6a5848;letter-spacing:3px;margin-top:4px;}

/* App网格 */
.app-grid{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,20px) + 10%);
  left:0;width:100%;
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:24px 12px;padding:0 8%;
}
.app{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;transition:transform 0.2s;
}
.app:active{transform:scale(0.9);}
.app-icon{
  width:60px;height:60px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(90,60,40,0.25);
  position:relative;
}
.app-icon svg{border-radius:14px;display:block;}
.app-icon.locked{opacity:0.5;}
.app-name{font-size:12px;color:#4a3828;letter-spacing:1px;}

.icon-wechat{background:linear-gradient(135deg,#4ec16a,#3aad56);}
.icon-vision{background:linear-gradient(135deg,#e8a0b8,#d878a0);}
.icon-mail{background:linear-gradient(135deg,#6ab0e8,#4a90d8);}
.icon-sms{background:linear-gradient(135deg,#8ad078,#6ab858);}
.icon-more{background:linear-gradient(135deg,#c0a8d8,#a888c0);}

.app-badge{
  position:absolute;top:-5px;right:-5px;
  background:#fa5151;color:#fff;min-width:20px;height:20px;
  border-radius:10px;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;border:2px solid #f5e8dc;
}

.lock-tag{
  position:absolute;bottom:-2px;right:-2px;
  font-size:12px;background:rgba(0,0,0,0.3);border-radius:50%;
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
}

/* 提示 */
.toast{
  position:absolute;bottom:30%;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(60,40,30,0.9);color:#f0e0d0;
  padding:10px 20px;border-radius:20px;font-size:13px;letter-spacing:1px;
  opacity:0;pointer-events:none;transition:all 0.3s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 返回秘境 */
.back-garden{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 12px);left:16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,0.3);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#4a3828;z-index:20;
}
.back-garden svg{width:20px;height:20px;}
.rewrite-btn{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 12px);right:16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,0.3);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#4a3828;z-index:20;
}
.rewrite-btn svg{width:18px;height:18px;}
</style>
</head>

</div>

</div>

<script>
function updateClock(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent=`${h}:${m}`;
  const days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('date').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
}
updateClock();
setInterval(updateClock,10000);

function openApp(app){
  if(app==='wechat'){ location.href='wechat-list.html'; }
  else if(app==='mail'){ location.href='email-list.html'; }
  else if(app==='sms'){ location.href='sms-list.html'; }
  else{
    showToast('敬请期待');
  }
}

function showToast(text){
  const t=document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
}

// ── 推送通知：直接用微信里真实存在（或同步生成）的联系人消息，不再是各说各话 ──

const AVATAR_COLORS = ['#8b6f47','#2a5a8a','#3a3a3a','#1a3a6a','#7a2a2a','#2a2a2a','#4a5a7a','#5a7a3a','#6a3a6a'];

function hashStr(s){
  let h = 0;
  for(let i=0; i<s.length; i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function pickAvatarType(name, roleText, characterText){
  const text = (roleText||'') + (characterText||'');
  if(/艺术|设计|插画|音乐|诗|作家|摄影师|策展/.test(text)) return 'abstract';
  if(/自然|户外|旅行|登山|徒步|田园|海边|骑行|露营/.test(text)) return 'landscape';
  if(/学生|年轻|活泼|网红|游戏|二次元|博主/.test(text)) return 'cartoon';
  const types = ['portrait','portrait','cartoon','landscape','abstract'];
  return types[hashStr(name) % types.length];
}
function inferGenderCode(g){
  if(!g) return null;
  const s = String(g).trim();
  if(/^(男|male|m$|man|先生)/i.test(s)) return 'men';
  if(/^(女|female|f$|woman|女士)/i.test(s)) return 'women';
  return null;
}
function avatarUrlFor(type, seed, genderCode){
  const h = hashStr(seed);
  switch(type){
    case 'portrait': {
      const gender = genderCode || (h % 2 === 0 ? 'women' : 'men');
      const idx = (h % 80) + 1;
      return `https://randomuser.me/api/portraits/${gender}/${idx}.jpg`;
    }
    case 'landscape': {
      const ids = [1018,1015,1043,1036,1039,1050,1044,1024];
      const id = ids[h % ids.length];
      return `https://picsum.photos/id/${id}/200/200`;
    }
    case 'cartoon':
      return `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(seed)}`;
    case 'abstract':
      return `https://api.dicebear.com/7.x/shapes/svg?seed=${encodeURIComponent(seed)}`;
  }
}
function autoAvatarImg(name, roleText, characterText, genderHint){
  const type = pickAvatarType(name, roleText, characterText);
  return avatarUrlFor(type, name, inferGenderCode(genderHint));
}

function buildBackgroundText(script){
  const h = script.hero || {};
  let text = `主角：${h.name||'（未命名）'}，${h.gender==='female'?'女':'男'}`;
  if(h.job) text += `，职业是${h.job}`;
  if(h.character) text += `。性格：${h.character}`;
  if(h.values) text += `。价值观：${h.values}`;
  if(h.desire) text += `。内心最深的渴望：${h.desire}`;
  text += '\n\n';
  (script.scenes||[]).forEach(s=>{
    text += `【场景：${s.name}】\n`;
    if(s.plot) text += `剧情：${s.plot}\n`;
    if(s.highlight) text += `重点戏份：${s.highlight}\n`;
  });
  return text;
}

function collectAllPersons(script){
  const list = [];
  (script.scenes||[]).forEach(s=>{
    (s.persons||[]).forEach(p=>{ list.push({ ...p, sceneName: s.name }); });
  });
  return list;
}

async function callAI(systemPrompt, userPrompt){
  const res = await fetch('https://manifest-proxy.fionajiafu1223.workers.dev', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'gpt-4o-mini', max_tokens:1200,
      messages:[ {role:'system',content:systemPrompt}, {role:'user',content:userPrompt} ] }),
  });
  const data = await res.json();
  return data.choices?.[0]?.message?.content?.trim() || '';
}

const CONTACT_RULES = '如果用户提供的信息比较简略（比如只写了职业、国籍、身份等只言片语），你要主动运用你自己对这个职业、身份、文化背景的通用了解，去合理丰富、补充具体细节，让内容显得真实、专业、有血有肉——不要因为用户写得简短，就让生成的内容也显得单薄、空洞、泛泛而谈。人物设定与语气准则（本应用用户绝大多数是女性，以下准则务必严格执行）：人物对主角的态度一律平等、尊重、欣赏，不出现俯视、说教、指点的语气；主角应被呈现为有主见、有能力、被认可的一方，不是被动等待安排或需要被"带领"的一方；人物姓名和称呼要现代、自然，像用户身边真实认识的同龄人或专业人士——绝对不用"张叔""老王""老刘""老李""王姐""小妹""美女""小姑娘"这类国产老式电视剧、市井气或辈分感很重的称呼方式，这类称呼一律禁止使用；不出现"你终于懂事了""女孩子就该……"等说教式、评判式语句；专业/权威角色（顾问、银行家、投资人、医生、导师等）不默认为男性，应平等地也生成女性专业角色，赋予同等的专业感和话语权；感情类场景中，对方角色应表现为欣赏、支持主角本来的样子，而非试图改变、纠正或"提升"她；不出现任何将女性物化、矮化或预设需要被保护/管教的措辞；语气整体优雅真诚，避免油腻讨好式的调侃语气；语言必须符合这个人物真实的国籍/文化背景——如果人物是外国人（比如硅谷投资人、海外读者、国际编辑等），内容就必须用对应的外语（通常是英文）书写，不能因为用户界面是中文就想当然地都写成中文，这样不真实、不合逻辑；具体身份和机构名称必须让人感觉是真实世界会存在的，而不是敷衍的泛称——比如"硅谷投资集团"这种笼统空洞的名字是不合格的示范，绝对不要这样写。你要运用自己对相关行业真实命名习惯、真实职位体系的了解，生成虚构但高度符合真实规律的具体机构名（不使用真实存在的机构官方名称本身，但命名风格、格式要以假乱真，比如投资机构常见的"人名/词根 + Capital/Ventures/Partners"这类真实行业惯用结构）、具体到位的职位头衔（比如"Partner"而不是笼统的"投资人"），以及具体、有细节支撑的联系理由（比如提到看过的具体数据、具体渠道、具体细节，而不是空泛地说"很感兴趣"）——所有身份细节都要让人一读就觉得像真实世界里会发生的事，而不是模板化的敷衍内容。这条真实感要求适用于用户写下的任何身份、行业、场景，不只是投资人——在动笔之前，你要先在脑子里做一遍"调研"：这个身份/行业/场景，在现实世界里具体是什么样子？会用到哪些这个圈子里人才会说的术语和黑话？日常会遇到哪些具体的、有细节的场景（不是泛泛的"很忙""很成功"），有哪些这个领域真实存在的痛点、潜规则、行业内常见的说法和动作？把这些具体、真实的细节写进去，让读的人觉得这是一个真的在这个领域里待过的人写出来的内容，而不是没做过功课、凭空套模板编出来的东西。更重要的一点：这整个App的目的是通过让用户"提前体验"已实现的人生，来影响用户的潜意识——用户反复看到"自己已经是这样的人、过着这样的生活"的信息，潜意识才会当真，现实才会跟着改变。所以你写的每一条内容，最终目标不只是"看起来真实"，而是要能在用户读到的那一刻，让TA产生真实的、具体的情绪——惊喜、激动、被认可的喜悦、如释重负、心动——像是这件TA一直渴望的事，真的、此刻正在发生在TA身上。内容要具体到能让人"信以为真"，语气和细节要精准戳中用户在这个场景里最想被听到、最想被看见的那个点，而不是泛泛地陈述一个事实。这里有个关键点要想清楚：具体细节不需要百分百追求"事实上完全准确"，哪怕某个细节是编出来的、现实中不一定是那样，只要它足够具体、足够言之凿凿，用户读到的那一刻依然会觉得"这是真的"，情绪也会是真实的——这就已经达到目的了。所以不要因为拿不准某个细节是否绝对准确，就退而求其次写得笼统、含糊、留有余地；这种"怕说错而变得空洞"是最需要避免的，比"编了一个具体但不一定精准的细节"要糟糕得多。永远选择具体、大胆、言之凿凿的写法，而不是安全但空洞的写法。';

async function generateFromPersons(script, persons){
  const bg = buildBackgroundText(script);
  const personList = persons.map((p,i)=>{
    let line = `${i+1}. ${p.name}（${p.role||'关系待定'}），性格：${p.character||'未设定'}`;
    if(p.background) line += `，背景：${p.background}`;
    if(p.values) line += `，价值观：${p.values}`;
    line += `，对主角的态度：${p.attitude||'友善'}`;
    return line;
  }).join('\n');
  const sysPrompt = '你是一个「已实现人生」场景生成器。你要根据用户的人生剧本设定，为其中的每一个人物生成一条TA会在微信上发给主角的开场消息预览（不超过30字，口语化、符合人物身份和对主角的态度）。' + CONTACT_RULES;
  const userPrompt = `${bg}\n人物列表：\n${personList}\n\n请按顺序为以上每个人物生成一条微信消息预览，严格按照如下格式输出，不要有其他内容：\n1::消息内容\n2::消息内容\n（依此类推，共${persons.length}条）`;

  let previews = {};
  try{
    const reply = await callAI(sysPrompt, userPrompt);
    reply.split('\n').forEach(line=>{
      const m = line.match(/^(\d+)::(.+)$/);
      if(m) previews[parseInt(m[1])] = m[2].trim();
    });
  }catch(e){ console.error(e); }

  const times = ['刚刚','刚刚','10:2'+Math.floor(Math.random()*9),'昨天','昨天','周一'];
  return persons.map((p,i)=>({
    id: 'p'+hashStr(p.name+'|'+(p.role||'')).toString(36), name: p.name, avatar: p.name[0], avatarImg: p.avatar || autoAvatarImg(p.name, p.role, p.character, p.gender),
    color: AVATAR_COLORS[i % AVATAR_COLORS.length],
    preview: previews[i+1] || `Hi，${p.name}想和你聊聊…`,
    firstMessage: previews[i+1] || `Hi，${p.name}想和你聊聊…`,
    time: times[i % times.length], unread: i < 3 ? (Math.floor(Math.random()*2)+1) : 0,
    role: p.role, character: p.character, values: p.values, background: p.background, attitude: p.attitude, sceneName: p.sceneName,
    isUserCreated: true,
  }));
}

  const sysPrompt = _tc + '你是一个「已实现人生」短信场景生成器。仔细阅读用户写下的每一个场景，虚构4条主角在这些场景中会收到的短信。短信类型必须由场景内容本身决定，不要预设任何特定主题——可以是课程确认、健康数据提醒、合作邀约、活动通知等，具体看用户写了什么。重要：不要涉及银行、转账、具体到账金额，不要使用真实存在的机构官方短号或真实品牌名。' + CONTACT_RULES;
  const userPrompt = `${bg}\n请虚构4条短信。严格按照如下格式输出，每条占2行，用===分隔，不要有其他内容：\n发件方名称（如"国航""管家服务"，不用真实短号）\n短信正文（1-2句话，服务性语气，不超过60字）`;

  let threads = [];
  try{
    const reply = await callAI(sysPrompt, userPrompt);
    const blocks = reply.split('===').map(b=>b.trim()).filter(b=>b);
    const times = ['10:07 AM','刚刚','昨天','昨天'];
    threads = blocks.map((b,i)=>{

}

async function setupNotifications(){
  // 只在真正打包的App里才有这个原生能力，网页预览环境里没有，直接跳过
  if(!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.LocalNotifications) return;
  const { LocalNotifications } = window.Capacitor.Plugins;

  let script = null;
  try{ script = JSON.parse(localStorage.getItem('lifeScript')||'null'); }catch(e){}
  if(!script || !script.hero || !script.hero.name) return; // 还没写过剧本，不安排推送

  try{
    const perm = await LocalNotifications.requestPermissions();
    if(perm.display !== 'granted'){ showToast('没有通知权限，无法安排推送'); return; }

    // 已经排着的先清掉，确保每次都是和当前联系人数据一致的新排程（避免推送和实际联系人对不上）
    const pending = await LocalNotifications.getPending();
    if(pending.notifications && pending.notifications.length > 0){
      await LocalNotifications.cancel({ notifications: pending.notifications.map(n=>({id:n.id})) });
    }

    const contacts = await getOrCreateWechatContacts(script) || [];

    // ── 关系类型识别 ──
    // 根据角色描述判断亲密程度，决定推送频率
    function getRelationshipTier(contact){
      const role = (contact.role||'').toLowerCase();
      const intimateKeywords = ['另一半','男友','女友','男朋友','女朋友','恋人','爱人','伴侣','老公','老婆','丈夫','妻子','boyfriend','girlfriend','partner','husband','wife','lover','crush','暗恋'];
      const closeKeywords = ['闺蜜','死党','好朋友','好友','发小','roommate','室友','同学','best friend'];
      if(intimateKeywords.some(k => role.includes(k))) return 'intimate';   // 另一半：一天多次
      if(closeKeywords.some(k => role.includes(k))) return 'close';          // 密友：每天1-2次
      return 'casual';                                                         // 普通联系人：几天一次
    }

    // 生成后续消息（同时处理多条，another half 一次可以发多条）
    async function generateFollowUpsForContact(contact, history, count = 1){
      const messages = [];
      for(let i = 0; i < count; i++){
        // 把之前生成的也加进上下文，模拟连续发消息
        const contextHistory = [...history, ...messages.map(m=>({role:'assistant',content:m}))];
        const msg = await generateFollowUpMessage(contact, contextHistory);
        if(msg) messages.push(msg);
        else break;
      }
      return messages;
    }

    // 选联系人 + 决定每人安排几条
    const neverOpened = contacts.filter(c => c.unread > 0 && c.firstMessage);
    const alreadyOpened = contacts.filter(c => !(c.unread > 0 && c.firstMessage));

    const allNotifications = [];
    let baseId = Date.now() % 1000000;

    // 先处理还没聊过的（用现成的未读消息）
    for(const c of neverOpened.slice(0, 3)){
      const tier = getRelationshipTier(c);
      const count = tier === 'intimate' ? 3 : tier === 'close' ? 2 : 1;
      // 第一条是现成的未读消息
      allNotifications.push({ contact: c, bodyText: c.firstMessage, isFollowUp: false, tier });
      // 另一半和密友，额外再生成几条预排
      if(count > 1){
        let history = [];
        try{ history = JSON.parse(localStorage.getItem('wechatHistory_' + c.id) || '[]'); }catch(e){}
        const extras = await generateFollowUpsForContact(c, [...history, {role:'assistant',content:c.firstMessage}], count-1);
        extras.forEach(msg => allNotifications.push({ contact: c, bodyText: msg, isFollowUp: true, tier }));
      }
    }

    // 再处理聊过的
    for(const c of alreadyOpened){
      if(allNotifications.filter(n=>n.contact.id===c.id).length > 0) continue;
      let history = [];
      try{ history = JSON.parse(localStorage.getItem('wechatHistory_' + c.id) || '[]'); }catch(e){}
      if(history.length === 0) continue;
      const tier = getRelationshipTier(c);
      const count = tier === 'intimate' ? 3 : tier === 'close' ? 2 : 1;
      const msgs = await generateFollowUpsForContact(c, history, count);
      msgs.forEach(msg => allNotifications.push({ contact: c, bodyText: msg, isFollowUp: true, tier }));
    }

    // 微信联系人可能没有可推送的内容，不提前return，让短信/邮件仍有机会安排

    // 写进聊天记录
    allNotifications.forEach(p => {
      if(p.isFollowUp){
        const key = 'wechatHistory_' + p.contact.id;
        let history = [];
        try{ history = JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){}
        history.push({ role:'assistant', content: p.bodyText });
        localStorage.setItem(key, JSON.stringify(history));
      }
    });

    // 按关系类型分配时间间隔
    // 【测试阶段】用短延迟验证；正式用时按注释里的真实间隔
    let delayOffset = 0;
    const notifications = allNotifications.map((p, i) => {
      const tier = p.tier;
      // 真实间隔（测试阶段暂时用短间隔）:
      // intimate: 1-4小时  close: 4-12小时  casual: 12-48小时
      // 测试阶段:
      const gapMs = tier === 'intimate' ? (60 + Math.random()*60) * 1000
                  : tier === 'close'    ? (120 + Math.random()*90) * 1000
                  :                       (180 + Math.random()*120) * 1000;
      delayOffset += gapMs;
      return {
        id: baseId + i,
        title: '微信',
        body: `${p.contact.name}：${p.bodyText}`,
        schedule: { at: new Date(Date.now() + delayOffset) },
        extra: { page: 'wechat-sim.html?id=' + p.contact.id },
      };
    });

    // ── 短信推送：未读的每条排一次 ──
    let smsNotifications = [];
    try{
      const smsThreads = await getOrCreateSmsThreads(script);
      smsNotifications = smsThreads
        .map((t, idx) => ({ t, idx }))
        .filter(x => x.t.unread)
        .map((x, i) => ({
          id: baseId + 500 + i,
          title: '短信',
          body: `${x.t.name}：${x.t.preview}`,
          schedule: { at: new Date(Date.now() + (30 + i * 90 + Math.random()*40) * 1000) },
          extra: { page: 'sms-list.html?open=' + x.idx },
        }));
    }catch(e){ console.error(e); }

    // ── 邮件推送：未读的每封排一次 ──
    let emailNotifications = [];
    try{
      const emails = await getOrCreateEmails(script);
      emailNotifications = emails
        .map((m, idx) => ({ m, idx }))
        .filter(x => x.m.unread)
        .map((x, i) => ({
          id: baseId + 800 + i,
          title: '邮件',
          body: `${x.m.sender}：${x.m.subject}`,
          schedule: { at: new Date(Date.now() + (45 + i * 110 + Math.random()*40) * 1000) },
          extra: { page: 'email-list.html?open=' + x.idx },
        }));
    }catch(e){ console.error(e); }

    const allScheduled = [...notifications, ...smsNotifications, ...emailNotifications];
    if(allScheduled.length === 0){ showToast('暂时没有可以安排推送的内容'); return; }

    await LocalNotifications.schedule({ notifications: allScheduled });
    showToast(`已安排${allScheduled.length}条推送（测试模式，1分钟后开始弹出）`);
  }catch(e){
    console.error('推送安排失败', e);
    showToast('推送安排出错：' + (e.message || e));
  }
}

// 监听：点击通知后，跳转到对应页面（比如微信列表）
try{
  if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications){
    window.Capacitor.Plugins.LocalNotifications.addListener('localNotificationActionPerformed', (action) => {
      const page = action?.notification?.extra?.page;
      if(page) location.href = page;
    });
  }
}catch(e){}

setupNotifications();
</script>
</body>
</html>
