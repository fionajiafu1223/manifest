<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的世界</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:'Noto Serif SC',serif;
  height:100dvh;position:fixed;inset:0;
  background:linear-gradient(180deg,#f0ecd8 0%,#e4ecc8 25%,#d0e4b8 55%,#b8d8a0 80%,#a0cc90 100%);
  animation:fadeIn 1s ease-out;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* 顶部时间/日期区 */
.top-area{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 8%);
  left:0;width:100%;text-align:center;
}
.clock{font-size:64px;font-weight:300;color:#4a3828;letter-spacing:2px;}
.date{font-size:15px;color:#6a5848;letter-spacing:3px;margin-top:4px;}

/* App网格 */
.app-grid{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,20px) + 10%);
  left:0;width:100%;
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:24px 12px;padding:0 8%;
}
.app{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;transition:transform 0.2s;
}
.app:active{transform:scale(0.9);}
.app-icon{
  width:60px;height:60px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(90,60,40,0.25);
  position:relative;
}
.app-icon svg{border-radius:14px;display:block;}
.app-icon.locked{opacity:0.5;}
.app-name{font-size:12px;color:#4a3828;letter-spacing:1px;}

.icon-wechat{background:linear-gradient(135deg,#4ec16a,#3aad56);}
.icon-vision{background:linear-gradient(135deg,#e8a0b8,#d878a0);}
.icon-mail{background:linear-gradient(135deg,#6ab0e8,#4a90d8);}
.icon-sms{background:linear-gradient(135deg,#8ad078,#6ab858);}
.icon-more{background:linear-gradient(135deg,#c0a8d8,#a888c0);}

.app-badge{
  position:absolute;top:-5px;right:-5px;
  background:#fa5151;color:#fff;min-width:20px;height:20px;
  border-radius:10px;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;border:2px solid #f5e8dc;
}

.lock-tag{
  position:absolute;bottom:-2px;right:-2px;
  font-size:12px;background:rgba(0,0,0,0.3);border-radius:50%;
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
}

/* 提示 */
.toast{
  position:absolute;bottom:30%;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(60,40,30,0.9);color:#f0e0d0;
  padding:10px 20px;border-radius:20px;font-size:13px;letter-spacing:1px;
  opacity:0;pointer-events:none;transition:all 0.3s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 返回秘境 */
.back-garden{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 12px);left:16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,0.3);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#4a3828;z-index:20;
}
.back-garden svg{width:20px;height:20px;}
.rewrite-btn{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 12px);right:16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,0.3);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#4a3828;z-index:20;
}
.rewrite-btn svg{width:18px;height:18px;}
</style>
</head>

</div>

</div>

function showToast(text){

  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
}

// ── 推送通知：直接用微信里真实存在（或同步生成）的联系人消息，不再是各说各话 ──

const AVATAR_COLORS = ['#8b6f47','#2a5a8a','#3a3a3a','#1a3a6a','#7a2a2a','#2a2a2a','#4a5a7a','#5a7a3a','#6a3a6a'];

function buildBackgroundText(script){
  const h = script.hero || {};
  let text = `主角：${h.name||'（未命名）'}，${h.gender==='female'?'女':'男'}`;
  if(h.job) text += `，职业是${h.job}`;
  if(h.character) text += `。性格：${h.character}`;
  if(h.values) text += `。价值观：${h.values}`;
  if(h.desire) text += `。内心最深的渴望：${h.desire}`;
  text += '\n\n';
  (script.scenes||[]).forEach(s=>{
    text += `【场景：${s.name}】\n`;
    if(s.plot) text += `剧情：${s.plot}\n`;
    if(s.highlight) text += `重点戏份：${s.highlight}\n`;
  });
  return text;
}

function collectAllPersons(script){
  const list = [];
  (script.scenes||[]).forEach(s=>{
    (s.persons||[]).forEach(p=>{ list.push({ ...p, sceneName: s.name }); });
  });
  return list;
}

async function callAI(systemPrompt, userPrompt){
  const res = await fetch('https://api.freedreleasing.com/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model:'deepseek-chat', max_tokens:1200,
      messages:[ {role:'system',content:systemPrompt}, {role:'user',content:userPrompt} ] }),
  });
  const data = await res.json();
  return data.choices?.[0]?.message?.content?.trim() || '';
}

const CONTACT_RULES = '如果用户提供的信息比较简略（比如只写了职业、国籍、身份等只言片语），你要主动运用你自己对这个职业、身份、文化背景的通用了解，去合理丰富、补充具体细节，让内容显得真实、专业、有血有肉——不要因为用户写得简短，就让生成的内容也显得单薄、空洞、泛泛而谈。人物设定与语气准则（本应用用户绝大多数是女性，以下准则务必严格执行）：人物对主角的态度一律平等、尊重、欣赏，不出现俯视、说教、指点的语气；主角应被呈现为有主见、有能力、被认可的一方，不是被动等待安排或需要被"带领"的一方；人物姓名和称呼要现代、自然，像用户身边真实认识的同龄人或专业人士——绝对不用"张叔""老王""老刘""老李""王姐""小妹""美女""小姑娘"这类国产老式电视剧、市井气或辈分感很重的称呼方式，这类称呼一律禁止使用；不出现"你终于懂事了""女孩子就该……"等说教式、评判式语句；专业/权威角色（顾问、银行家、投资人、医生、导师等）不默认为男性，应平等地也生成女性专业角色，赋予同等的专业感和话语权；感情类场景中，对方角色应表现为欣赏、支持主角本来的样子，而非试图改变、纠正或"提升"她；不出现任何将女性物化、矮化或预设需要被保护/管教的措辞；语气整体优雅真诚，避免油腻讨好式的调侃语气。';

async function generateFromPersons(script, persons){
  const bg = buildBackgroundText(script);
  const personList = persons.map((p,i)=>{
    let line = `${i+1}. ${p.name}（${p.role||'关系待定'}），性格：${p.character||'未设定'}`;
    if(p.background) line += `，背景：${p.background}`;
    if(p.values) line += `，价值观：${p.values}`;
    line += `，对主角的态度：${p.attitude||'友善'}`;
    return line;
  }).join('\n');
  const sysPrompt = '你是一个「已实现人生」场景生成器。你要根据用户的人生剧本设定，为其中的每一个人物生成一条TA会在微信上发给主角的开场消息预览（不超过30字，口语化、符合人物身份和对主角的态度）。' + CONTACT_RULES;
  const userPrompt = `${bg}\n人物列表：\n${personList}\n\n请按顺序为以上每个人物生成一条微信消息预览，严格按照如下格式输出，不要有其他内容：\n1::消息内容\n2::消息内容\n（依此类推，共${persons.length}条）`;

  let previews = {};
  try{
    const reply = await callAI(sysPrompt, userPrompt);
    reply.split('\n').forEach(line=>{
      const m = line.match(/^(\d+)::(.+)$/);
      if(m) previews[parseInt(m[1])] = m[2].trim();
    });
  }catch(e){ console.error(e); }

  const times = ['刚刚','刚刚','10:2'+Math.floor(Math.random()*9),'昨天','昨天','周一'];
  return persons.map((p,i)=>({
    id: 'p'+i, name: p.name, avatar: p.name[0], avatarImg: p.avatar || null,
    color: AVATAR_COLORS[i % AVATAR_COLORS.length],
    preview: previews[i+1] || `Hi，${p.name}想和你聊聊…`,
    firstMessage: previews[i+1] || `Hi，${p.name}想和你聊聊…`,
    time: times[i % times.length], unread: i < 3 ? (Math.floor(Math.random()*2)+1) : 0,
    role: p.role, character: p.character, values: p.values, background: p.background, attitude: p.attitude, sceneName: p.sceneName,
  }));
}

async function generateInventedContacts(script){
  const bg = buildBackgroundText(script);
  const sysPrompt = '你是一个「已实现人生」场景生成器。仔细阅读用户写下的每一个场景（可能是事业、学术、健康、创作、心灵成长、人际关系、财富等任何主题），虚构4-6个会在微信上联系主角的人物。人物类型必须由场景内容本身决定，不要预设任何特定主题（不要默认往财富或奢侈品方向靠）——可以是导师、合作者、学生、病人、粉丝、朋友等任何符合场景的角色。' + CONTACT_RULES;
  const userPrompt = `${bg}\n请虚构4-6个联系人，每人一条微信消息预览（不超过30字）。严格按照如下格式输出，不要有其他内容：\n姓名::身份角色::消息预览`;

  let list = [];
  try{
    const reply = await callAI(sysPrompt, userPrompt);
    reply.split('\n').forEach(line=>{
      const parts = line.split('::');
      if(parts.length>=3) list.push({ name:parts[0].trim(), role:parts[1].trim(), preview:parts[2].trim() });
    });
  }catch(e){ console.error(e); }
  if(list.length===0) return [];

  const times = ['刚刚','刚刚','10:2'+Math.floor(Math.random()*9),'昨天','昨天','周一'];
  return list.map((p,i)=>({
    id:'inv'+i, name:p.name, avatar:p.name[0], avatarImg:null, color:AVATAR_COLORS[i%AVATAR_COLORS.length],
    preview:p.preview, firstMessage:p.preview, time:times[i%times.length], unread: i<3 ? (Math.floor(Math.random()*2)+1) : 0,
    role:p.role, character:'', values:'', background:p.role, attitude:'友善、主动联系用户',
  }));
}

// 拿到「和微信列表页完全一致」的联系人数据：有缓存就用缓存，没有就生成并写入同一个缓存
async function getOrCreateWechatContacts(script){
  const cacheKey = 'wechatContactsCache';
  const scriptRaw = localStorage.getItem('lifeScript') || '';
  try{
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if(cached && cached.scriptRaw === scriptRaw && cached.contacts && cached.contacts.length > 0){
      return cached.contacts;
    }
  }catch(e){}

  const persons = collectAllPersons(script);
  const contacts = persons.length > 0
    ? await generateFromPersons(script, persons)
    : await generateInventedContacts(script);

  if(contacts.length > 0){
    localStorage.setItem(cacheKey, JSON.stringify({ scriptRaw, contacts }));
  }
  return contacts;
}

// 给"已经聊过"的联系人，生成一条真正承接上文的新消息（不是翻来覆去用同一条旧的）

  const persona = `${_ntc}你正在扮演「${contact.name}」，Ta是主角微信上的联系人。
你的身份/关系：${contact.role||'朋友'}
你的性格：${contact.character||'友善自然'}
背景：${contact.background||''}
价值观：${contact.values||''}
你对待用户的态度：${contact.attitude||'友善、主动'}
如果背景信息比较简略，你要主动运用自己对这个职业/身份/文化的通用了解去合理补充细节，不要显得单薄空洞。`;
  const recentContext = priorHistory.slice(-6).map(m => (m.role==='user'?'对方：':'你：') + m.content).join('\n');
  const userPrompt = `以下是你和对方最近的聊天记录：\n${recentContext}\n\n（一段时间过去了，请你像真实生活里会做的那样，主动再发一条微信消息给对方——可以是分享一件新发生的小事、一句问候、延续上次话题的后续，符合你的身份和处境。只需要这一条消息本身，不超过40字，不要有旁白或说明。）`;
  try{
    const reply = await callAI(persona, userPrompt);
    return reply.split('\n')[0].trim() || null;
  }catch(e){ console.error(e); return null; }
}

async function setupNotifications(){
  // 只在真正打包的App里才有这个原生能力，网页预览环境里没有，直接跳过
  if(!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.LocalNotifications) return;
  const { LocalNotifications } = window.Capacitor.Plugins;

  let script = null;
  try{ script = JSON.parse(localStorage.getItem('lifeScript')||'null'); }catch(e){}
  if(!script || !script.hero || !script.hero.name) return; // 还没写过剧本，不安排推送

  try{
    const perm = await LocalNotifications.requestPermissions();
    if(perm.display !== 'granted'){ showToast('没有通知权限，无法安排推送'); return; }

    // 已经排着的先清掉，确保每次都是和当前联系人数据一致的新排程（避免推送和实际联系人对不上）
    const pending = await LocalNotifications.getPending();
    if(pending.notifications && pending.notifications.length > 0){
      await LocalNotifications.cancel({ notifications: pending.notifications.map(n=>({id:n.id})) });
    }

    const contacts = await getOrCreateWechatContacts(script);
    if(!contacts || contacts.length === 0){ showToast('生成联系人失败，推送安排取消'); return; }

    // 选几个联系人来安排推送：优先选还没聊过的（用现成的未读消息），凑不够数再从聊过的里面挑，生成真正的新消息
    const neverOpened = contacts.filter(c => c.unread > 0 && c.firstMessage);
    const alreadyOpened = contacts.filter(c => !(c.unread > 0 && c.firstMessage));

    const picked = []; // { contact, bodyText, isFollowUp }
    neverOpened.slice(0, 4).forEach(c => picked.push({ contact: c, bodyText: c.firstMessage, isFollowUp: false }));

    if(picked.length < 4){
      for(const c of alreadyOpened){
        if(picked.length >= 4) break;
        let history = [];
        try{ history = JSON.parse(localStorage.getItem('wechatHistory_' + c.id) || '[]'); }catch(e){}
        if(history.length === 0) continue; // 没聊过也没有未读消息的，跳过（生成不出有意义的后续）
        const followUp = await generateFollowUpMessage(c, history);
        if(followUp) picked.push({ contact: c, bodyText: followUp, isFollowUp: true });
      }
    }

    if(picked.length === 0){ showToast('暂时没有可以安排推送的联系人'); return; }

    // 后续消息要真正写进这个联系人的聊天记录里，不然点进去还是看不到
    picked.forEach(p => {
      if(p.isFollowUp){
        const key = 'wechatHistory_' + p.contact.id;
        let history = [];
        try{ history = JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){}
        history.push({ role:'assistant', content: p.bodyText });
        localStorage.setItem(key, JSON.stringify(history));
      }
    });

    const baseId = Date.now() % 1000000;
    const notifications = picked.map((p, i) => {
      // 【测试阶段】延迟很短，方便马上验证；确认没问题后会调回更真实的间隔（几小时到几天）
      const delayMs = (60 + i*90 + Math.random()*60) * 1000;
      return {
        id: baseId + i,
        title: '微信',
        body: `${p.contact.name}：${p.bodyText}`,
        schedule: { at: new Date(Date.now() + delayMs) },
        extra: { page: 'wechat-sim.html?id=' + p.contact.id }, // 直接跳到这个具体联系人的聊天，不是泛泛的列表页
      };
    });

    await LocalNotifications.schedule({ notifications });
    showToast(`已安排${notifications.length}条推送（测试模式，1分钟后开始弹出）`);
  }catch(e){
    console.error('推送安排失败', e);
    showToast('推送安排出错：' + (e.message || e));
  }
}

// 监听：点击通知后，跳转到对应页面（比如微信列表）
try{
  if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications){
    window.Capacitor.Plugins.LocalNotifications.addListener('localNotificationActionPerformed', (action) => {
      const page = action?.notification?.extra?.page;
      if(page) location.href = page;
    });
  }
}catch(e){}

setupNotifications();
</script>
