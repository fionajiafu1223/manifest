<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gmail</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{font-family:'Roboto','Google Sans',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;height:100dvh;position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;}

.status-bar{height:env(safe-area-inset-top,44px);background:#fff;flex-shrink:0;}

/* 搜索栏 */
.gm-header{padding:8px 12px 6px;flex-shrink:0;background:#fff;}
.gm-searchbar{background:#e9eef6;border-radius:28px;height:52px;display:flex;align-items:center;padding:0 10px 0 18px;gap:16px;}
.gm-menu svg{width:22px;height:22px;fill:#444746;display:block;}
.gm-searchtext{flex:1;color:#444746;font-size:17px;}
.gm-avatar{width:36px;height:36px;border-radius:50%;background:#673ab7;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:500;flex-shrink:0;}

/* 主体滚动区 */
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px;}

.primary-label{font-size:13px;color:#444746;letter-spacing:0.8px;padding:14px 20px 6px;}

/* 分类行 */
.cat-row{display:flex;align-items:center;padding:12px 20px;gap:20px;cursor:pointer;}
.cat-row:active{background:#f5f5f5;}
.cat-icon{width:24px;height:24px;flex-shrink:0;}
.cat-body{flex:1;min-width:0;}
.cat-name{font-size:16.5px;font-weight:700;color:#1f1f1f;margin-bottom:2px;}
.cat-preview{font-size:15px;font-weight:600;color:#1f1f1f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-pill{font-size:13px;color:#fff;padding:4px 10px;border-radius:14px;flex-shrink:0;font-weight:500;}
.pill-green{background:#1e6e42;}
.pill-orange{background:#b06000;}

/* 邮件列表 */
.mail-item{display:flex;padding:11px 12px 11px 16px;gap:16px;cursor:pointer;align-items:flex-start;background:#fff;}
.mail-item:active{background:#f5f5f5;}
.mail-avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:#dadce0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.mail-avatar svg{width:28px;height:28px;fill:#fff;}
.mail-avatar.blue{background:#8ab4f8;}
.mail-avatar.blue svg{fill:#1a73e8;}
.mail-body{flex:1;min-width:0;}
.mail-top{display:flex;justify-content:space-between;align-items:baseline;}
.mail-sender{font-size:16px;color:#1f1f1f;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68%;}
.mail-time{font-size:13px;color:#1f1f1f;flex-shrink:0;font-weight:600;}
.mail-subject{font-size:15px;color:#1f1f1f;font-weight:700;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mail-bottom{display:flex;align-items:center;gap:8px;}
.mail-snippet{flex:1;font-size:14.5px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mail-star{width:22px;height:22px;flex-shrink:0;}
.mail-star svg{width:22px;height:22px;fill:none;stroke:#5f6368;stroke-width:1.6;}
.mail-star.starred svg{fill:#f4b400;stroke:#f4b400;}
.mail-item.read .mail-sender,.mail-item.read .mail-subject,.mail-item.read .mail-time{font-weight:400;color:#5f6368;}

/* Compose按钮 */
.compose-fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,20px) + 72px);background:#c2e7ff;border-radius:18px;padding:16px 22px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.15);cursor:pointer;z-index:50;}
.compose-fab svg{width:22px;height:22px;fill:#001d35;}
.compose-fab span{font-size:16px;color:#001d35;font-weight:500;}

/* 底部导航 */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#f3f6fc;display:flex;padding:10px 0 calc(10px + env(safe-area-inset-bottom,20px));z-index:40;}
.nav-item{flex:1;display:flex;justify-content:center;}
.nav-icon-wrap{position:relative;padding:5px 22px;border-radius:18px;}
.nav-icon-wrap.active{background:#c2e7ff;}
.nav-icon-wrap svg{width:24px;height:24px;fill:#444746;display:block;}
.nav-badge{position:absolute;top:-3px;right:12px;background:#b3261e;color:#fff;font-size:11px;padding:1px 6px;border-radius:10px;font-weight:500;}


/* 邮件详情 */
.mail-detail{position:fixed;inset:0;z-index:200;background:#fff;transform:translateX(100%);transition:transform 0.35s;display:flex;flex-direction:column;}
.mail-detail.open{transform:translateX(0);}
.detail-head{display:flex;align-items:center;padding:calc(env(safe-area-inset-top,44px) + 8px) 12px 8px;gap:8px;flex-shrink:0;}
.detail-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#444746;cursor:pointer;}
.detail-back svg{width:22px;height:22px;}
.detail-icons{margin-left:auto;display:flex;gap:22px;color:#444746;align-items:center;}
.detail-icons svg{width:22px;height:22px;fill:#444746;}
.detail-body{flex:1;overflow-y:auto;padding:8px 20px 30px;}
.detail-subject{font-size:21px;color:#1f1f1f;font-weight:400;line-height:1.35;margin-bottom:14px;}
.detail-sender-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.detail-sender-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;flex-shrink:0;background:#dadce0;}
.detail-sender-avatar svg{width:26px;height:26px;fill:#fff;}
.detail-sender-info{flex:1;min-width:0;}
.detail-sender-name{font-size:15px;color:#1f1f1f;font-weight:500;}
.detail-sender-email{font-size:13px;color:#5f6368;}
.detail-content{font-size:15.5px;color:#1f1f1f;line-height:1.75;white-space:pre-wrap;}
</style>
</head>
<body>

<div class="status-bar"></div>

<div class="gm-header">
  <div class="gm-searchbar">
    <div class="gm-menu" onclick="location.href='desktop.html'" style="cursor:pointer;"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></div>
    <div class="gm-searchtext" id="gmTitleLongPress" style="-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;">Search in mail</div>
    <div class="gm-avatar" id="userAvatar">F</div>
  </div>
</div>

<div class="scroll-area">
  <div class="primary-label">Primary</div>

  <!-- Promotions -->
  <div class="cat-row">
    <div class="cat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#1e6e42" stroke-width="1.8"><path d="M21.4 11.6l-9-9C12 2.2 11.5 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .5.2 1 .6 1.4l9 9c.8.8 2 .8 2.8 0l7-7c.8-.8.8-2 0-2.8z"/><circle cx="6.5" cy="6.5" r="1.5" fill="#1e6e42" stroke="none"/></svg></div>
    <div class="cat-body">
      <div class="cat-name">Promotions</div>
      <div class="cat-preview">Net-A-Porter - 您的私人造型师已上线…</div>
    </div>
    <div class="cat-pill pill-green">99+ new</div>
  </div>

  <!-- Updates -->
  <div class="cat-row">
    <div class="cat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#b06000" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="8.01" stroke-width="2.4" stroke-linecap="round"/><line x1="12" y1="11" x2="12" y2="16" stroke-linecap="round"/></svg></div>
    <div class="cat-body">
      <div class="cat-name">Updates</div>
      <div class="cat-preview">Amex Centurion - 您的黑卡年度礼遇已更新…</div>
    </div>
    <div class="cat-pill pill-orange">99+ new</div>
  </div>

  <div id="mailList"></div>
</div>

<!-- Compose -->
<div class="compose-fab">
  <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
  <span>Compose</span>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <div class="nav-item">
    <div class="nav-icon-wrap active">
      <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      <div class="nav-badge">99+</div>
    </div>
  </div>
  <div class="nav-item">
    <div class="nav-icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    </div>
  </div>
</div>

<!-- 邮件详情 -->
<div class="mail-detail" id="mailDetail">
  <div class="detail-head">
    <div class="detail-back" onclick="closeMail()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="detail-icons">
      <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
    </div>
  </div>
  <div class="detail-body">
    <div class="detail-subject" id="detailSubject"></div>
    <div class="detail-sender-row">
      <div class="detail-sender-avatar"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
      <div class="detail-sender-info">
        <div class="detail-sender-name" id="detailSender"></div>
        <div class="detail-sender-email" id="detailEmail"></div>
      </div>
    </div>
    <div class="detail-content" id="detailContent"></div>
  </div>
</div>

<script>
let emails = [];

// ---- 相对时间显示（邮件用英文风格） ----
function formatMailTime(iso){
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if(sameDay){
    let h = d.getHours(); const m = String(d.getMinutes()).padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h===0) h = 12;
    return `${h}:${m} ${ampm}`;
  }
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if(d.toDateString() === yest.toDateString()) return 'Yesterday';
  const diffDay = Math.floor((now - d) / 86400000);
  if(diffDay < 7) return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  return (d.getMonth()+1)+'/'+d.getDate();
}

async function initEmails(){
  listEl.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#9aa;font-size:14px;">正在加载邮件…</div>';

  const { requireUser } = await import('./js/services/authService.js');
  const { supabase } = await import('./js/supabaseClient.js');

  const user = await requireUser();
  if(!user) return;

  const { data: msgs, error } = await supabase
    .from('messages')
    .select('id, character_id, subject, sender_address, content, sent_at, direction')
    .eq('user_id', user.id)
    .eq('channel', 'email')
    .lte('sent_at', new Date().toISOString())
    .order('sent_at', { ascending: false });

  if(error){
    console.error(error);
    emails = [];
    render();
    return;
  }

  if(!msgs || msgs.length === 0){
    emails = [];
    render();
    return;
  }

  const characterIds = [...new Set(msgs.map(m => m.character_id).filter(Boolean))];
  let charMap = {};
  if(characterIds.length > 0){
    const { data: characters } = await supabase
      .from('characters')
      .select('id, name, display_name, organization_name')
      .eq('user_id', user.id)
      .eq('is_active', true)
      .in('id', characterIds);
    (characters||[]).forEach(c => charMap[c.id] = c);
  }

  emails = msgs.map((m, i) => {
    const character = charMap[m.character_id];
    const senderName = character
      ? (character.display_name || character.name) + (character.organization_name ? ' · ' + character.organization_name : '')
      : (m.sender_address || '未知发件人');
    return {
      id: m.id,
      sender: senderName,
      email: m.sender_address || '',
      subject: m.subject || '(无主题)',
      snippet: (m.content||'').replace(/\n/g,' ').slice(0, 60),
      content: m.content || '',
      time: formatMailTime(m.sent_at),
      unread: i < 3, // 数据库暂无已读字段，先按最近3封默认未读展示
      starred: false,
    };
  });

  render();
}

const personSvg='<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
const starSvg='<svg viewBox="0 0 24 24"><path d="M12 17.27l4.15 2.51c.76.46 1.69-.22 1.49-1.08l-1.1-4.72 3.67-3.18c.67-.58.31-1.68-.57-1.75l-4.83-.41-1.89-4.46c-.34-.81-1.5-.81-1.84 0L9.19 8.63l-4.83.41c-.88.07-1.24 1.17-.57 1.75l3.67 3.18-1.1 4.72c-.2.86.73 1.54 1.49 1.08L12 17.27z"/></svg>';

const listEl=document.getElementById('mailList');
let allEmailItems = [];

function render(){
  listEl.innerHTML='';
  allEmailItems = [...emails];

  if(allEmailItems.length === 0){
    listEl.innerHTML = `<div style="text-align:center;padding:80px 30px;color:#999;">
      <div style="font-size:15px;margin-bottom:8px;">收件箱是空的</div>
      <div style="font-size:13px;color:#bbb;line-height:1.7;">写下你的人生剧本，专属邮件才会出现</div>
    </div>`;
    return;
  }

  allEmailItems.forEach((m,i)=>{
    const item=document.createElement('div');
    item.className='mail-item'+(m.unread?'':' read');

    const avatarContent = personSvg;

    item.innerHTML=`
      <div class="mail-avatar${i===4?' blue':''}">${avatarContent}</div>
      <div class="mail-body">
        <div class="mail-top"><span class="mail-sender">${m.sender}</span><span class="mail-time">${m.time}</span></div>
        <div class="mail-subject">${m.subject}</div>
        <div class="mail-bottom">
          <span class="mail-snippet">${m.snippet}</span>
          <span class="mail-star ${m.starred?'starred':''}">${starSvg}</span>
        </div>
      </div>
    `;
    item.onclick=()=>openMailByIndex(i);
    listEl.appendChild(item);
  });
}

function openMailByIndex(i){
  const m = allEmailItems[i];
  document.getElementById('detailSubject').textContent=m.subject;
  document.getElementById('detailSender').textContent=m.sender;
  document.getElementById('detailEmail').textContent=m.email;

  document.getElementById('detailContent').textContent = m.content;

  document.getElementById('mailDetail').classList.add('open');
  allEmailItems[i].unread=false;
  render();
}

function openMail(i){ openMailByIndex(i); }
function closeMail(){ document.getElementById('mailDetail').classList.remove('open'); }

// 头像首字母：用主角姓名（从main_characters读取，不再依赖localStorage剧本）
(async function setUserAvatar(){
  try{
    const { supabase } = await import('./js/supabaseClient.js');
    const { data: { user } } = await supabase.auth.getUser();
    if(!user) return;
    const { data: mc } = await supabase.from('main_characters').select('name').eq('user_id', user.id).maybeSingle();
    if(mc && mc.name) document.getElementById('userAvatar').textContent = mc.name[0].toUpperCase();
  }catch(e){}
})();

// 长按搜索栏文字：手动刷新（内容现在由后端统一生成，客户端只负责读取展示）
(function(){
  const el = document.getElementById('gmTitleLongPress');
  let timer = null;
  const start = () => { timer = setTimeout(() => { initEmails(); }, 650); };
  const cancel = () => { if(timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
})();

initEmails().then(()=>{
  try{
    const openIdx = new URLSearchParams(window.location.search).get('open');
    if(openIdx !== null && allEmailItems[+openIdx]) openMailByIndex(+openIdx);
  }catch(e){}
});
</script>
</body>
</html>
