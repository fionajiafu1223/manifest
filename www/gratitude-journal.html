<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>感恩日记</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Ma+Shan+Zheng&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* 书本/日历/日记页统一宽度：同时被屏幕宽度和高度约束（88vh按3:4比例换算成等效宽度），
     取较小值，保证在各种手机屏幕比例下都能尽量撑满又不会超出屏幕、不变形 */
  --book-w: min(94vw, calc(88vh * 0.75));
}
body{font-family:'Noto Serif SC',serif;background:linear-gradient(180deg,#f3f6e2 0%,#e7eeca 25%,#d2deb2 55%,#a1ba76 80%,#688a41 100%);width:100vw;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;}

.bubbles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;transition:opacity 1s;}
.bubbles.dimmed{opacity:0.25;}
/* 金色光尘：替代之前从Freed搬过来的彩色气泡，改用和书本封面同色系的暖金光点，像烛光/萤火虫缓缓向上飘散淡出 */
.bubble{position:absolute;border-radius:50%;animation:floatDust var(--dur) var(--delay) infinite ease-in-out;}
@keyframes floatDust{
  0%{transform:translateY(0) translateX(0);opacity:0;}
  12%{opacity:var(--maxOp);}
  55%{transform:translateY(var(--fy)) translateX(var(--fx));opacity:var(--maxOp);}
  100%{transform:translateY(calc(var(--fy)*1.6)) translateX(calc(var(--fx)*1.3));opacity:0;}
}

.screen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:1;transition:opacity 0.5s;}
.screen.hidden{opacity:0;pointer-events:none;visibility:hidden;}

/* 书本SVG：宽度用统一变量，aspect-ratio精确匹配viewBox的360:480(3:4)比例，不再有留白 */
/* 书本封面：两张图（手机尺寸/iPad尺寸），按屏幕宽度切换，容器保持3:4比例不变形 */
.book-cover-wrap{
  width:var(--book-w);
  aspect-ratio:3/4;
  display:block;
  position:relative;
  filter:drop-shadow(0 10px 40px rgba(0,0,0,0.45));
  cursor:pointer;
  border-radius:10px;
  overflow:hidden;
}
.book-cover-img{width:100%;height:100%;object-fit:cover;display:block;}
.cover-phone{display:block;}
.cover-tablet{display:none;}
@media (min-width:768px){
  .cover-phone{display:none;}
  .cover-tablet{display:block;}
}
.book-cover-wrap.opening{animation:claspFlip 0.8s forwards;}
@keyframes claspFlip{0%{opacity:1;}100%{opacity:0;transform:scale(1.05);}}

.open-hint{
  position:absolute;bottom:calc(50% - (var(--book-w) * 1.3333 / 2) - 28px);
  left:50%;transform:translateX(-50%);
  font-size:12px;color:#688a41;letter-spacing:3px;white-space:nowrap;
  animation:pulse 2s infinite;font-family:'Noto Serif SC',serif;
}
@keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

/* 日历和日记：和书本用同一个尺寸变量+同一个比例，翻开后页面大小、位置和封面完全一致，像真的书一样 */
.cal-container,.journal-container{
  width:var(--book-w);
  aspect-ratio:3/4;
  background:rgba(245,238,220,0.97);
  border:1.5px solid rgba(104,138,65,0.5);
  border-radius:10px;
  box-shadow:0 0 40px rgba(120,80,20,0.25);
  display:flex;flex-direction:column;
  overflow:hidden;padding:1.2rem;
}

.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.8rem;flex-shrink:0;}
.cal-title{font-family:'Ma Shan Zheng',serif;font-size:18px;color:#22460f;letter-spacing:2px;}
.cal-nav-btn{background:none;border:1px solid rgba(104,138,65,0.5);border-radius:50%;width:28px;height:28px;color:#22460f;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.cal-nav-btn:hover{background:rgba(104,138,65,0.1);}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:0.3rem;flex-shrink:0;}
.weekdays span{text-align:center;font-size:11px;color:#688a41;padding:3px 0;}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;position:relative;flex:1;}
.day-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;font-size:11px;color:#22460f;transition:background 0.2s;aspect-ratio:1;align-self:center;}
.day-cell.has-entry{background:none !important;border-radius:0;}
.day-cell:hover:not(.empty){background:rgba(104,138,65,0.15);}
.day-cell.today{background:rgba(104,138,65,0.25);color:#22460f;font-weight:600;}
.day-cell.empty{cursor:default;}
.heart-badge{font-size:18px;line-height:1;}
.day-num-small{font-size:9px;color:#688a41;}
.day-cell.has-entry .day-num-small{display:none;}
.connector-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,6,24,0.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.modal-overlay.active{opacity:1;pointer-events:all;}
.modal-card{background:linear-gradient(180deg,#f3f6e2,#e7eeca);border:1px solid rgba(104,138,65,0.5);border-radius:24px;padding:1.5rem;width:min(280px,80vw);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.25);transform:scale(0.9);transition:transform 0.3s;}
.modal-overlay.active .modal-card{transform:scale(1);}
.modal-date{font-size:12px;color:#688a41;letter-spacing:2px;margin-bottom:0.8rem;}
.modal-label{font-size:13px;color:#22460f;margin-bottom:1rem;letter-spacing:1px;}
.mood-grid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:1.2rem;}
.mood-btn{font-size:26px;cursor:pointer;padding:4px;border:none;background:none;transition:transform 0.2s;}
.mood-btn:hover{transform:scale(1.2);}
.mood-btn.selected{transform:scale(1.3);}
.modal-confirm{width:100%;padding:10px;background:linear-gradient(135deg,#688a41,#436b29);border:none;border-radius:12px;color:#fbfbf6;font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:2px;cursor:pointer;}
.modal-confirm:hover{opacity:0.85;}

.journal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.8rem;flex-shrink:0;}
.back-btn{background:none;border:1px solid rgba(104,138,65,0.5);border-radius:10px;padding:4px 10px;color:#436b29;font-size:11px;cursor:pointer;letter-spacing:1px;}
.back-btn:hover{background:rgba(104,138,65,0.1);}
.journal-date-title{font-family:'Ma Shan Zheng',serif;font-size:14px;color:#22460f;letter-spacing:2px;}
.selected-mood-display{font-size:20px;}
.guide{font-size:12px;color:#688a41;font-style:italic;letter-spacing:1px;margin-bottom:0.6rem;flex-shrink:0;}
textarea{width:100%;flex:1;background:rgba(255,255,255,0.75);border:1px solid rgba(104,138,65,0.4);border-radius:12px;padding:0.8rem;color:#22460f;font-family:'Noto Serif SC',serif;font-size:13px;line-height:1.8;resize:none;outline:none;transition:border-color 0.2s;}
textarea:focus{border-color:rgba(104,138,65,0.6);}
textarea::placeholder{color:#688a41;}
.save-btn{margin-top:0.6rem;width:100%;padding:10px;flex-shrink:0;background:linear-gradient(135deg,#688a41,#436b29);border:none;border-radius:12px;color:#fbfbf6;font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:2px;cursor:pointer;}
.save-btn:hover{opacity:0.9;}
</style>
</head>
<body>
<div id="back-to-garden" style="position:fixed;top:calc(env(safe-area-inset-top,44px) + 12px);left:16px;z-index:9999;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.6);backdrop-filter:blur(8px);border:1px solid rgba(104,138,65,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#22460f;" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<div class="bubbles" id="bubbles"></div>

<!-- COVER -->
<div class="screen" id="coverScreen">
  <div style="position:relative;">
    <div class="book-cover-wrap" id="bookCoverWrap" onclick="openBook()">
      <img class="book-cover-img cover-phone" src="assets/backgrounds/gratitude-cover-phone.png" alt="感恩日记">
      <img class="book-cover-img cover-tablet" src="assets/backgrounds/gratitude-cover-tablet.png" alt="感恩日记">
    </div>
    <div class="open-hint">按下搭扣，开启书卷</div>
  </div>
</div>

<!-- CALENDAR -->
<div class="screen hidden" id="calScreen">
  <div class="cal-container">
    <div class="cal-header">
      <button class="cal-nav-btn" id="prevMonth">&#8249;</button>
      <span class="cal-title" id="monthTitle"></span>
      <button class="cal-nav-btn" id="nextMonth">&#8250;</button>
    </div>
    <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div class="days-grid" id="daysGrid">
      <svg class="connector-svg" id="connectorSvg"></svg>
    </div>
  </div>
</div>

<!-- MOOD MODAL -->
<div class="modal-overlay" id="moodModal">
  <div class="modal-card">
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-label">选择今天的心情</div>
    <div class="mood-grid" id="moodGrid"></div>
    <button class="modal-confirm" id="moodConfirm">进入今日页面</button>
  </div>
</div>

<!-- JOURNAL -->
<div class="screen hidden" id="journalScreen">
  <div class="journal-container">
    <div class="journal-top">
      <button class="back-btn" id="backBtn">← 日历</button>
      <span class="journal-date-title" id="journalDateTitle"></span>
      <span class="selected-mood-display" id="moodDisplay"></span>
    </div>
    <div class="guide">今天我感恩……</div>
    <textarea id="journalText" placeholder="写下让你心存感激的事情…"></textarea>
    <button class="save-btn" id="saveBtn">保存今日感恩</button>
  </div>
</div>

<script>
const MOODS=[{e:'🩷'},{e:'💜'},{e:'💙'},{e:'🩵'},{e:'💚'},{e:'🧡'},{e:'🤍'}];
let curY,curM,selDay=null,selMood=0;
const today=new Date();

// 背景不放任何飘浮粒子元素，#bubbles容器保留空壳，只是为了不破坏下面dimmed显隐逻辑的调用

function key(y,m,d){return`gj_${y}_${m}_${d}`;}
function getEntry(y,m,d){try{return JSON.parse(localStorage.getItem(key(y,m,d))||'null');}catch{return null;}}
function saveEntry(y,m,d,mood,text){localStorage.setItem(key(y,m,d),JSON.stringify({mood,text}));}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function openBook(){
  document.getElementById('bookCoverWrap').classList.add('opening');
  setTimeout(()=>{showScreen('calScreen');renderCalendar();},800);
}

const months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const mLabels=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function renderCalendar(){
  const grid=document.getElementById('daysGrid');
  document.getElementById('monthTitle').textContent=`${curY} · ${months[curM]}`;
  const firstDay=new Date(curY,curM,1).getDay();
  const daysInMonth=new Date(curY,curM+1,0).getDate();
  grid.querySelectorAll('.day-cell').forEach(e=>e.remove());
  const cells=[];
  for(let i=0;i<firstDay;i++){const e=document.createElement('div');e.className='day-cell empty';grid.appendChild(e);cells.push(null);}
  for(let d=1;d<=daysInMonth;d++){
    const entry=getEntry(curY,curM,d);
    const cell=document.createElement('div');
    const isToday=d===today.getDate()&&curM===today.getMonth()&&curY===today.getFullYear();
    cell.className='day-cell'+(entry?' has-entry':'')+(isToday?' today':'');
    if(entry){const h=document.createElement('span');h.className='heart-badge';h.textContent=MOODS[entry.mood]?.e||'💜';cell.appendChild(h);}
    else{const n=document.createElement('span');n.className='day-num-small';n.textContent=d;cell.appendChild(n);}
    cell.onclick=()=>openMoodModal(d);
    grid.appendChild(cell);cells.push({d,el:cell,hasEntry:!!entry});
  }
  requestAnimationFrame(()=>drawConnectors(cells));
}

function drawConnectors(cells){
  const svg=document.getElementById('connectorSvg');svg.innerHTML='';
  const gridRect=document.getElementById('daysGrid').getBoundingClientRect();
  const pts=[];
  cells.forEach(c=>{if(c&&c.hasEntry){const r=c.el.getBoundingClientRect();pts.push({x:r.left-gridRect.left+r.width/2,y:r.top-gridRect.top+r.height/2});}});
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i];
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);
    line.setAttribute('stroke','rgba(104,138,65,0.3)');line.setAttribute('stroke-width','1.5');line.setAttribute('stroke-dasharray','3 4');
    svg.appendChild(line);
  }
}

function openMoodModal(d){
  selDay=d;const entry=getEntry(curY,curM,d);selMood=entry?entry.mood:0;
  document.getElementById('modalDate').textContent=`${curY}年 ${mLabels[curM]} ${d}日`;
  renderMoodGrid(selMood);document.getElementById('moodModal').classList.add('active');
}

function renderMoodGrid(idx){
  const grid=document.getElementById('moodGrid');grid.innerHTML='';
  MOODS.forEach((m,i)=>{const btn=document.createElement('span');btn.className='mood-btn'+(i===idx?' selected':'');btn.textContent=m.e;btn.onclick=()=>{selMood=i;renderMoodGrid(i);};grid.appendChild(btn);});
}

document.getElementById('moodConfirm').onclick=()=>{
  document.getElementById('moodModal').classList.remove('active');
  document.getElementById('bubbles').classList.add('dimmed');
  const entry=getEntry(curY,curM,selDay);
  document.getElementById('journalDateTitle').textContent=`${curY}年${mLabels[curM]}${selDay}日`;
  document.getElementById('moodDisplay').textContent=MOODS[selMood].e;
  document.getElementById('journalText').value=entry?entry.text:'';
  showScreen('journalScreen');
};

document.getElementById('saveBtn').onclick=()=>{
  const text=document.getElementById('journalText').value.trim();
  if(!text)return;
  saveEntry(curY,curM,selDay,selMood,text);
  document.getElementById('bubbles').classList.remove('dimmed');
  showScreen('calScreen');renderCalendar();
};

document.getElementById('backBtn').onclick=()=>{
  document.getElementById('bubbles').classList.remove('dimmed');
  showScreen('calScreen');renderCalendar();
};

document.getElementById('prevMonth').onclick=()=>{curM--;if(curM<0){curM=11;curY--;}renderCalendar();};
document.getElementById('nextMonth').onclick=()=>{curM++;if(curM>11){curM=0;curY++;}renderCalendar();};

curY=today.getFullYear();curM=today.getMonth();
</script>
</body>
</html>
