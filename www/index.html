<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>秘境</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  height:100dvh;position:fixed;inset:0;
  background:#ffffff;
  font-family:'Ma Shan Zheng',serif;
  display:flex;flex-direction:column;
}

.title{
  padding-top:calc(env(safe-area-inset-top,44px) + 18px);
  padding-bottom:10px;
  text-align:center;flex-shrink:0;
}
.title .t1{font-size:28px;color:#4a6a48;letter-spacing:8px;}

.dock{
  flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:14px;padding:14px 14px calc(env(safe-area-inset-bottom,16px) + 14px);
}
.dock-item{
  cursor:pointer;border-radius:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:transform 0.15s;
  box-shadow:0 4px 18px rgba(0,0,0,0.08);
}
.dock-item:active{transform:scale(0.96);}
.dock-item svg{width:36%;height:auto;max-width:110px;}
.dock-label{font-size:22px;letter-spacing:4px;opacity:0.9;}

.dock-item.c1{background:#fbeef0;}
.dock-item.c1 .dock-label{color:#a04858;}
.dock-item.c2{background:#f3ecf7;}
.dock-item.c2 .dock-label{color:#6a4a78;}
.dock-item.c3{background:#fbf1e2;}
.dock-item.c3 .dock-label{color:#8a6a30;}
.dock-item.c4{background:#eaf3ea;}
.dock-item.c4 .dock-label{color:#4a7a4e;}

.dock.leaving{opacity:0;transition:opacity 0.4s;}
</style>
</head>
<body>
<div onclick="window.location.href='debug-test.html'" style="position:absolute;top:calc(env(safe-area-inset-top,44px) + 6px);right:16px;z-index:50;font-size:12px;color:rgba(90,90,90,0.4);padding:6px 10px;">诊断</div>

<div class="title"><span class="t1">秘 境</span></div>

<div class="dock" id="dock">
  <!-- 感恩日记本 -->
  <div class="dock-item c1" onclick="walkTo('gratitude')">
    <svg viewBox="0 0 58 58">
      <rect x="14" y="16" width="30" height="34" rx="3" fill="#c86a7a"/>
      <rect x="14" y="16" width="30" height="34" rx="3" fill="none" stroke="#e8b04a" stroke-width="1.5"/>
      <rect x="17" y="19" width="24" height="28" rx="2" fill="none" stroke="#e8b04a" stroke-width="0.8" opacity="0.6"/>
      <line x1="29" y1="16" x2="29" y2="50" stroke="#a04858" stroke-width="1"/>
      <circle cx="29" cy="33" r="4" fill="#e8b04a"/>
      <path d="M27 33 L28.5 35 L31 31" stroke="#fff" stroke-width="1" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="dock-label">日记</div>
  </div>

  <!-- 剧院 -->
  <div class="dock-item c2" onclick="walkTo('life-script')">
    <svg viewBox="0 0 64 64">
      <path d="M12 24 L32 12 L52 24 Z" fill="#d4a84a"/>
      <rect x="16" y="24" width="32" height="28" fill="#8a5088"/>
      <rect x="16" y="24" width="32" height="28" fill="none" stroke="#d4a84a" stroke-width="1.5"/>
      <path d="M20 24 Q32 20 44 24 L44 30 Q32 26 20 30 Z" fill="#c04858"/>
      <path d="M20 30 Q26 34 26 44 L20 44 Z" fill="#a03848" opacity="0.7"/>
      <path d="M44 30 Q38 34 38 44 L44 44 Z" fill="#a03848" opacity="0.7"/>
      <rect x="28" y="38" width="8" height="14" fill="#5a2858"/>
      <circle cx="32" cy="18" r="2.5" fill="#f0d060"/>
    </svg>
    <div class="dock-label">剧场</div>
  </div>

  <!-- 留声机 -->
  <div class="dock-item c3" onclick="walkTo('audio')">
    <svg viewBox="0 0 58 58">
      <rect x="20" y="38" width="18" height="12" rx="2" fill="#8a5838"/>
      <rect x="20" y="38" width="18" height="12" rx="2" fill="none" stroke="#d4a84a" stroke-width="1"/>
      <circle cx="29" cy="44" r="1.5" fill="#d4a84a"/>
      <line x1="29" y1="38" x2="29" y2="20" stroke="#b08040" stroke-width="1.5"/>
      <path d="M29 20 Q20 14 14 20 Q12 26 22 28 Q30 26 29 20 Z" fill="#e8b04a"/>
      <path d="M29 20 Q20 15 15 20 Q14 24 22 26 Q28 24 29 20 Z" fill="#f0c860"/>
      <circle cx="29" cy="20" r="2" fill="#b08040"/>
    </svg>
    <div class="dock-label">留声</div>
  </div>

  <!-- 愿景之画 -->
  <div class="dock-item c4" onclick="walkTo('vision')">
    <svg viewBox="0 0 58 58">
      <rect x="14" y="16" width="30" height="34" rx="2" fill="#c8a04a"/>
      <rect x="17" y="19" width="24" height="28" rx="1" fill="#eae0d0"/>
      <rect x="17" y="19" width="24" height="28" rx="1" fill="#bcdcec"/>
      <path d="M17 38 Q23 30 29 34 Q35 38 41 32 L41 47 L17 47 Z" fill="#8ac088"/>
      <circle cx="34" cy="27" r="4" fill="#f5c86a"/>
      <path d="M17 44 Q29 40 41 44 L41 47 L17 47 Z" fill="#6aa868"/>
      <rect x="14" y="16" width="30" height="34" rx="2" fill="none" stroke="#e8c86a" stroke-width="1"/>
    </svg>
    <div class="dock-label">愿景</div>
  </div>
</div>

<script>
(async function checkLogin(){
  try{
    const { getCurrentUser } = await import('./js/services/authService.js');
    const user = await getCurrentUser();
    if(!user){ window.location.replace('login.html'); return; }
  }catch(e){
    window.location.replace('login.html');
  }
})();

function walkTo(feature){
  const dock = document.getElementById('dock');
  dock.classList.add('leaving');

  if(feature==='life-script'){
    // 已经写过剧本 -> 直接进桌面；没写过 -> 进入剧本创作流程
    (async () => {
      let hasScript = false;
      try{
        const { loadScript } = await import('./js/services/scriptService.js');
        const s = await loadScript();
        hasScript = !!(s && s.hero && s.hero.name);
      }catch(e){ console.error(e); }
      const dest = hasScript ? 'desktop.html' : 'life-script.html';
      setTimeout(()=>{ window.location.href=dest; }, 350);
    })();
  } else {
    const map={ 'gratitude':'gratitude-journal.html','audio':'subliminal-studio.html','vision':'vision-board.html' };
    const dest = map[feature];
    setTimeout(()=>{ window.location.href=dest; }, 350);
  }
}
</script>
</body>
</html>
