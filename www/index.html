<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Live In The End</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{position:fixed;inset:0;width:100%;height:100dvh;background:#f3f6e2;font-family:sans-serif;}
.world{position:absolute;inset:0;overflow:hidden;}

/* =========================================================
   花园背景：直接用整张已确认的完整原图，用object-fit:cover铺满，
   不再拆分图层，避免多图层高度计算出错的问题。
   ========================================================= */
.garden{
  position:absolute;inset:0;overflow:hidden;
  transform-origin:center 75%;
  transition:transform 1.4s cubic-bezier(0.4,0,0.2,1),opacity 1.2s;
}
.garden-scene{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center center;
  display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;
}
.scene-portrait{display:block;}
.scene-landscape{display:none;}
@media (orientation:landscape){
  .scene-portrait{display:none;}
  .scene-landscape{display:block;}
}

.garden.walk-1{transform:scale(2.6) translate(28%,-8%);opacity:0;}
.garden.walk-2{transform:scale(2.6) translate(10%,-8%);opacity:0;}
.garden.walk-3{transform:scale(2.6) translate(-10%,-8%);opacity:0;}
.garden.walk-4{transform:scale(2.6) translate(-28%,-8%);opacity:0;}

/* =========================================================
   四宫格功能区：用min(vw,px)限制最大宽度，
   小屏按比例缩放、大屏（iPad横屏）不会被拉得过宽过散。
   ========================================================= */
.dock{
  position:absolute;top:13%;left:50%;transform:translateX(-50%);
  width:min(78vw,440px);height:29%;
  display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);
  gap:28px;z-index:10;
}
@media (orientation:landscape){
  .dock{width:min(38vw,440px);top:11%;height:30%;}
}
.dock-item{
  cursor:pointer;transition:transform 0.2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.dock-item:active{transform:scale(0.94);}
/* 图标尺寸：手机竖屏用原始大小，iPad横屏用放大后的大小 */
.icon-gratitude{width:44%;max-width:96px;}
.icon-theatre{width:56%;max-width:128px;}
.icon-conch{width:52%;max-width:120px;}
.icon-vision{width:48%;max-width:110px;}
@media (orientation:landscape){
  .icon-gratitude{width:63%;max-width:138px;}
  .icon-theatre{width:80%;max-width:183px;}
  .icon-conch{width:75%;max-width:172px;}
  .icon-vision{width:68%;max-width:157px;}
}
@keyframes bob{0%{transform:translateY(0);}100%{transform:translateY(-6px);}}
.dock-label{font-size:17px;color:#436b29;letter-spacing:1px;text-shadow:0 1px 4px rgba(255,255,255,0.7);opacity:0.9;text-align:center;}

.world.entering .garden{animation:wakeUp 2.4s ease-out;}
@keyframes wakeUp{0%{opacity:0;filter:blur(24px) brightness(1.4);}100%{opacity:1;filter:blur(0) brightness(1);}}

/* 登录/账号弹窗 */
.acct-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(40,50,30,0.45);
  display:none;align-items:center;justify-content:center;
  padding:0 1.6rem;
}
.acct-overlay.open{display:flex;}
.acct-card{
  width:100%;max-width:340px;
  background:linear-gradient(180deg,#f3f6e2,#e7eeca);
  border-radius:18px;padding:1.8rem 1.6rem 1.6rem;
  font-family:'Noto Serif SC',serif;color:#22460f;
  box-shadow:0 12px 40px rgba(0,0,0,0.25);
  position:relative;
}
.acct-close{
  position:absolute;top:12px;right:14px;
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#688a41;font-size:18px;cursor:pointer;
}
.acct-title{font-size:18px;font-weight:600;margin-bottom:1.2rem;text-align:center;color:#436b29;}
.acct-field{margin-bottom:0.8rem;}
.acct-field label{display:block;font-size:12px;color:#688a41;letter-spacing:1px;margin-bottom:0.35rem;}
.acct-field input{
  width:100%;padding:0.75rem 0.9rem;border-radius:10px;border:1.5px solid rgba(104,138,65,0.35);
  background:rgba(255,255,255,0.75);font-family:'Noto Serif SC',serif;font-size:14px;color:#22460f;outline:none;
}
.acct-field input:focus{border-color:#688a41;}
.acct-btn{width:100%;padding:0.8rem;border-radius:12px;border:none;cursor:pointer;
  font-family:'Noto Serif SC',serif;font-size:14px;letter-spacing:1.5px;transition:transform 0.1s;margin-top:0.35rem;}
.acct-btn:active{transform:scale(0.98);}
.acct-btn:disabled{opacity:0.5;pointer-events:none;}
.acct-btn-primary{background:linear-gradient(135deg,#688a41,#436b29);color:#fbfbf6;font-weight:600;}
.acct-btn-secondary{background:rgba(255,255,255,0.6);color:#22460f;border:1.5px solid rgba(104,138,65,0.35);}
.acct-msg{margin-top:0.9rem;font-size:12.5px;text-align:center;line-height:1.6;min-height:18px;color:#688a41;}
.acct-msg.error{color:#b05050;}
.acct-msg.ok{color:#436b29;}
.acct-current-email{font-size:14px;color:#436b29;text-align:center;margin-bottom:1.2rem;word-break:break-all;}
</style>
</head>
<body>
<div onclick="window.location.href='debug-test.html'" style="position:absolute;top:calc(env(safe-area-inset-top,44px) + 6px);right:16px;z-index:50;font-size:12px;color:rgba(90,120,90,0.55);padding:6px 10px;">诊断</div>
<div onclick="openAccountModal()" style="position:absolute;top:calc(env(safe-area-inset-top,44px) + 6px);left:16px;z-index:50;font-size:12px;color:rgba(90,120,90,0.55);padding:6px 10px;">登录/切换账号</div>
<div class="world entering" id="world">
  <div class="garden" id="garden">
    <img class="garden-scene scene-portrait" src="assets/backgrounds/garden-home-portrait.jpg" alt="">
    <img class="garden-scene scene-landscape" src="assets/backgrounds/garden-home-landscape.jpg" alt="">
  </div>

  <!-- 底部四宫格功能图标 -->
  <div class="dock" id="dock">
    <div class="dock-item" onclick="walkTo('gratitude',1)">
      <img class="icon-gratitude" src="assets/icons/gratitude-journal.png" alt="感恩日记" style="filter:drop-shadow(0 6px 10px rgba(60,90,50,0.35));animation:bob 3.5s ease-in-out infinite alternate;">
      <div class="dock-label">感恩日记</div>
    </div>
    <div class="dock-item" onclick="walkTo('life-script',2)">
      <img class="icon-theatre" src="assets/icons/theatre.png" alt="终点剧院" style="filter:drop-shadow(0 6px 10px rgba(60,90,50,0.35));animation:bob 4s ease-in-out infinite alternate;">
      <div class="dock-label">终点剧院</div>
    </div>
    <div class="dock-item" onclick="walkTo('audio',3)">
      <img class="icon-conch" src="assets/icons/conch-shell.png" alt="潜意识沟通室" style="filter:drop-shadow(0 6px 10px rgba(60,90,50,0.35));animation:bob 3.8s ease-in-out infinite alternate;">
      <div class="dock-label">潜意识沟通室</div>
    </div>
    <div class="dock-item" onclick="walkTo('vision',4)">
      <img class="icon-vision" src="assets/icons/vision-board.png" alt="愿景版" style="filter:drop-shadow(0 6px 10px rgba(60,90,50,0.35));animation:bob 3.6s ease-in-out infinite alternate;">
      <div class="dock-label">愿景版</div>
    </div>
  </div>
</div>

<!-- 登录/账号弹窗：不跳转页面，直接在首页上弹出 -->
<div class="acct-overlay" id="acctOverlay" onclick="if(event.target===this) closeAccountModal();">
  <div class="acct-card">
    <div class="acct-close" onclick="closeAccountModal()">✕</div>
    <div id="acctBody"></div>
  </div>
</div>

<script>
setTimeout(()=>{ document.getElementById('world').classList.remove('entering'); }, 2400);

// ============================================================
// 登录/账号弹窗：直接在首页弹出，不再跳转到login.html
// ============================================================
const acctOverlay = document.getElementById('acctOverlay');
const acctBody = document.getElementById('acctBody');

function renderLoginForm(){
  acctBody.innerHTML = `
    <div class="acct-title">登录</div>
    <div class="acct-field">
      <label>邮箱</label>
      <input type="email" id="acctEmail" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="acct-field">
      <label>密码</label>
      <input type="password" id="acctPassword" placeholder="至少6位" autocomplete="current-password">
    </div>
    <button class="acct-btn acct-btn-primary" id="acctLoginBtn">登录</button>
    <button class="acct-btn acct-btn-secondary" id="acctSignupBtn">还没有账号？注册</button>
    <div class="acct-msg" id="acctMsg"></div>
  `;

  const emailEl = document.getElementById('acctEmail');
  const passwordEl = document.getElementById('acctPassword');
  const msgEl = document.getElementById('acctMsg');
  const loginBtn = document.getElementById('acctLoginBtn');
  const signupBtn = document.getElementById('acctSignupBtn');

  function showMsg(text, type){
    msgEl.textContent = text;
    msgEl.className = 'acct-msg' + (type ? ' ' + type : '');
  }
  function setBusy(busy){
    loginBtn.disabled = busy;
    signupBtn.disabled = busy;
  }

  loginBtn.addEventListener('click', async () => {
    const email = emailEl.value.trim();
    const password = passwordEl.value;
    if(!email || !password){ showMsg('请填写邮箱和密码', 'error'); return; }
    setBusy(true);
    showMsg('登录中...');
    try{
      const { signIn } = await import('./js/services/authService.js');
      await signIn(email, password);
      showMsg('登录成功', 'ok');
      setTimeout(()=>{ closeAccountModal(); }, 500);
    }catch(err){
      showMsg('登录失败：' + (err.message || '未知错误'), 'error');
      setBusy(false);
    }
  });

  signupBtn.addEventListener('click', async () => {
    const email = emailEl.value.trim();
    const password = passwordEl.value;
    if(!email || !password){ showMsg('请填写邮箱和密码', 'error'); return; }
    if(password.length < 6){ showMsg('密码至少需要6位', 'error'); return; }
    setBusy(true);
    showMsg('注册中...');
    try{
      const { signUp } = await import('./js/services/authService.js');
      const data = await signUp(email, password);
      if(data.session){
        showMsg('注册成功', 'ok');
        setTimeout(()=>{ closeAccountModal(); }, 500);
      } else {
        showMsg('注册成功，请检查邮箱完成验证后再登录', 'ok');
        setBusy(false);
      }
    }catch(err){
      showMsg('注册失败：' + (err.message || '未知错误'), 'error');
      setBusy(false);
    }
  });
}

function renderLoggedInState(email){
  acctBody.innerHTML = `
    <div class="acct-title">账号</div>
    <div class="acct-current-email">当前登录：${email}</div>
    <button class="acct-btn acct-btn-secondary" id="acctLogoutBtn">退出登录</button>
    <div class="acct-msg" id="acctMsg"></div>
  `;
  document.getElementById('acctLogoutBtn').addEventListener('click', async () => {
    try{
      const { signOut } = await import('./js/services/authService.js');
      await signOut();
      renderLoginForm();
    }catch(err){
      document.getElementById('acctMsg').textContent = '退出失败：' + (err.message || '未知错误');
      document.getElementById('acctMsg').className = 'acct-msg error';
    }
  });
}

async function openAccountModal(){
  acctOverlay.classList.add('open');
  acctBody.innerHTML = '<div class="acct-title">加载中…</div>';
  try{
    const { getCurrentUser } = await import('./js/services/authService.js');
    const user = await getCurrentUser();
    if(user){
      renderLoggedInState(user.email || '');
    } else {
      renderLoginForm();
    }
  }catch(e){
    renderLoginForm();
  }
}

function closeAccountModal(){
  acctOverlay.classList.remove('open');
}

// 点击任意功能图标才检查登录状态；首页本身谁都能看
async function walkTo(feature, pos){
  let user = null;
  try{
    const { getCurrentUser } = await import('./js/services/authService.js');
    user = await getCurrentUser();
  }catch(e){}
  if(!user){
    openAccountModal();
    return;
  }

  const garden = document.getElementById('garden');
  const dock = document.getElementById('dock');
  dock.style.transition='opacity 0.5s';
  dock.style.opacity='0';
  garden.classList.add('walk-'+pos);

  if(feature==='life-script'){
    let hasScript = false;
    try{
      const { loadScript } = await import('./js/services/scriptService.js');
      const s = await loadScript();
      hasScript = !!(s && s.hero && s.hero.name);
    }catch(e){ console.error(e); }
    const dest = hasScript ? 'desktop.html' : 'life-script.html';
    setTimeout(()=>{ window.location.href=dest; }, 1300);
  } else {
    const map={ 'gratitude':'gratitude-journal.html','audio':'subliminal-studio.html','vision':'vision-board.html' };
    const dest = map[feature];
    setTimeout(()=>{ window.location.href=dest; }, 1300);
  }
}
</script>
</body>
</html>
