<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>秘境</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{position:fixed;inset:0;width:100%;height:100dvh;background:#f4f8f0;font-family:sans-serif;}
.world{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;}
.garden{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;transform-origin:center 75%;transition:transform 1.4s cubic-bezier(0.4,0,0.2,1),opacity 1.2s;}
.garden.walk-1{transform:scale(2.6) translate(28%,-8%);opacity:0;}
.garden.walk-2{transform:scale(2.6) translate(10%,-8%);opacity:0;}
.garden.walk-3{transform:scale(2.6) translate(-10%,-8%);opacity:0;}
.garden.walk-4{transform:scale(2.6) translate(-28%,-8%);opacity:0;}
.layer-sky{position:absolute;inset:0;z-index:0;background-image:url('assets/backgrounds/layers/1-sky-gradient.webp');background-size:cover;background-position:center top;background-repeat:no-repeat;}
.layer-hills-back{position:absolute;left:50%;bottom:21%;width:112%;height:auto;transform:translateX(-50%);overflow:visible;z-index:1;pointer-events:none;}
.layer-hills-back img{display:block;width:100%;height:auto;max-width:none;}
.layer-hills-front{position:absolute;left:50%;bottom:9%;width:116%;height:auto;transform:translateX(-50%);overflow:visible;z-index:2;pointer-events:none;}
.layer-hills-front img{display:block;width:100%;height:auto;max-width:none;}
.layer-tree-left,.layer-tree-right{position:absolute;bottom:0;width:auto;height:auto;max-width:none;max-height:none;display:block;z-index:3;pointer-events:none;object-fit:contain;}
.layer-tree-left{left:-3%;height:46%;transform-origin:left bottom;}
.layer-tree-right{right:-3%;height:43%;transform-origin:right bottom;}
.layer-plants{position:absolute;left:50%;bottom:-1%;width:114%;height:auto;transform:translateX(-50%);overflow:visible;z-index:4;pointer-events:none;}
.layer-plants img{display:block;width:100%;height:auto;max-width:none;}
.bfly{position:absolute;height:auto;z-index:5;pointer-events:none;animation:flyPath var(--bd) ease-in-out infinite;}
.bfly img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 8px rgba(60,90,50,0.25));animation:flap 2.6s ease-in-out infinite;}
@keyframes flap{0%,100%{transform:scaleX(1) rotate(0deg);}50%{transform:scaleX(0.85) rotate(3deg);}}
@keyframes flyPath{0%{transform:translate(0,0) rotate(-4deg);}25%{transform:translate(30px,-24px) rotate(4deg);}50%{transform:translate(60px,-6px) rotate(-3deg);}75%{transform:translate(30px,-30px) rotate(3deg);}100%{transform:translate(0,0) rotate(-4deg);}}
#bfly1{top:52%;left:33%;width:9vw;max-width:42px;}
#bfly2{top:67%;left:74%;width:10vw;max-width:46px;}
@media (orientation:landscape){
  .layer-hills-back{width:108%;bottom:20%;}
  .layer-hills-front{width:111%;bottom:8%;}
  .layer-tree-left{left:-2%;height:59%;}
  .layer-tree-right{right:-2%;height:56%;}
  .layer-plants{width:109%;bottom:-2%;}
  #bfly1{top:47%;left:30%;width:5vw;max-width:58px;}
  #bfly2{top:64%;left:78%;width:5vw;max-width:58px;}
}
.dock{position:absolute;top:calc(env(safe-area-inset-top,20px) + 2%);left:50%;transform:translateX(-50%);width:100%;max-width:640px;height:38%;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:14px;padding:0 5%;z-index:10;}
@media (orientation:landscape){.dock{height:32%;max-width:560px;}}
.dock-item{cursor:pointer;transition:transform 0.2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.dock-item:active{transform:scale(0.94);}
@keyframes bob{0%{transform:translateY(0);}100%{transform:translateY(-6px);}}
.dock-label{font-size:17px;color:#4a6a48;letter-spacing:1px;text-shadow:0 1px 4px rgba(255,255,255,0.7);opacity:0.9;text-align:center;}
.world.entering .garden{animation:wakeUp 2.4s ease-out;}
@keyframes wakeUp{0%{opacity:0;filter:blur(24px) brightness(1.4);}100%{opacity:1;filter:blur(0) brightness(1);}}
</style>
</head>
<body>
<div onclick="window.location.href='debug-test.html'" style="position:absolute;top:calc(env(safe-area-inset-top,44px) + 6px);right:16px;z-index:50;font-size:12px;color:rgba(90,120,90,0.55);padding:6px 10px;">诊断</div>
<div class="world entering" id="world">
  <div class="garden" id="garden">
    <div class="layer-sky"></div>
    <div class="layer-hills-back"><img src="assets/backgrounds/layers/2-hills-back.webp" alt=""></div>
    <div class="layer-hills-front"><img src="assets/backgrounds/layers/3-hills-front.webp" alt=""></div>
    <img class="layer-tree-left" src="assets/backgrounds/layers/4-tree-left.webp" alt="">
    <img class="layer-tree-right" src="assets/backgrounds/layers/5-tree-right.webp" alt="">
    <div class="layer-plants"><img src="assets/backgrounds/layers/6-foreground-plants.webp" alt=""></div>
    <div class="bfly" id="bfly1" style="--bd:9s;"><img src="assets/backgrounds/layers/7-butterfly-1.webp" alt=""></div>
    <div class="bfly" id="bfly2" style="--bd:11s;animation-direction:reverse;"><img src="assets/backgrounds/layers/8-butterfly-2.webp" alt=""></div>
  </div>
  <div class="dock" id="dock">
    <div class="dock-item" onclick="walkTo('gratitude',1)">
      <img src="assets/icons/gratitude-journal.png" alt="感恩日记" style="width:44%;max-width:96px;filter:drop-shadow(0 6px 10px rgba(60,90,50,0.35));animation:bob 3.5s ease-in-out infinite alternate;">
      <div class="dock-label">感恩日记</div>
    </div>
    <div class="dock-item" onclick="walkTo('life-script',2)">
      <img src="assets/icons/theatre.png" alt="终点剧院" style="width:56%;max-width:128px;filter:drop-shadow(0 6px 10px rgba(60,90,50,0.35));animation:bob 4s ease-in-out infinite alternate;">
      <div class="dock-label">终点剧院</div>
    </div>
    <div class="dock-item" onclick="walkTo('audio',3)">
      <img src="assets/icons/conch-shell.png" alt="潜意识沟通室" style="width:52%;max-width:120px;filter:drop-shadow(0 6px 10px rgba(60,90,50,0.35));animation:bob 3.8s ease-in-out infinite alternate;">
      <div class="dock-label">潜意识沟通室</div>
    </div>
    <div class="dock-item" onclick="walkTo('vision',4)">
      <img src="assets/icons/vision-board.png" alt="愿景版" style="width:48%;max-width:110px;filter:drop-shadow(0 6px 10px rgba(60,90,50,0.35));animation:bob 3.6s ease-in-out infinite alternate;">
      <div class="dock-label">愿景版</div>
    </div>
  </div>
</div>
<script>
(async function checkLogin(){
  try{
    const { getCurrentUser } = await import('./js/services/authService.js');
    const user = await getCurrentUser();
    if(!user){window.location.replace('login.html');return;}
  }catch(e){window.location.replace('login.html');}
})();
setTimeout(()=>{document.getElementById('world').classList.remove('entering');},2400);
function walkTo(feature,pos){
  const garden=document.getElementById('garden');
  const dock=document.getElementById('dock');
  dock.style.transition='opacity 0.5s';
  dock.style.opacity='0';
  garden.classList.add('walk-'+pos);
  if(feature==='life-script'){
    (async()=>{
      let hasScript=false;
      try{
        const { loadScript } = await import('./js/services/scriptService.js');
        const s=await loadScript();
        hasScript=!!(s && s.hero && s.hero.name);
      }catch(e){console.error(e);}
      const dest=hasScript ? 'desktop.html' : 'life-script.html';
      setTimeout(()=>{window.location.href=dest;},1300);
    })();
  }else{
    const map={gratitude:'gratitude-journal.html',audio:'subliminal-studio.html',vision:'vision-board.html'};
    const dest=map[feature];
    setTimeout(()=>{window.location.href=dest;},1300);
  }
}
</script>
</body>
</html>
