<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>登录</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:'Noto Serif SC',serif;
  height:100dvh;position:fixed;inset:0;
  background:linear-gradient(180deg,#f0ecd8 0%,#e4ecc8 25%,#d0e4b8 55%,#b8d8a0 80%,#a0cc90 100%);
  color:#3a4a2a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 1.6rem;
}

.title{font-family:'Ma Shan Zheng',serif;font-size:32px;color:#c89030;letter-spacing:6px;margin-bottom:2.2rem;text-align:center;}

.card{width:100%;max-width:360px;}

.field{margin-bottom:0.9rem;}
.field label{display:block;font-size:12px;color:#6a7858;letter-spacing:1px;margin-bottom:0.4rem;}
.field input{
  width:100%;padding:0.85rem 1rem;border-radius:12px;border:1.5px solid rgba(120,160,90,0.35);
  background:rgba(255,255,255,0.7);font-family:'Noto Serif SC',serif;font-size:15px;color:#3a4a2a;outline:none;
}
.field input:focus{border-color:#c8a04a;}

.btn{width:100%;padding:0.9rem;border-radius:14px;border:none;cursor:pointer;
  font-family:'Noto Serif SC',serif;font-size:15px;letter-spacing:2px;transition:transform 0.1s;margin-top:0.4rem;}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.5;pointer-events:none;}
.btn-primary{background:linear-gradient(135deg,#c8a04a,#e8c860);color:#4a3810;font-weight:600;}
.btn-secondary{background:rgba(255,255,255,0.55);color:#3a4a2a;border:1.5px solid rgba(120,160,90,0.35);margin-top:0.7rem;}

.msg{margin-top:1rem;font-size:13px;text-align:center;line-height:1.6;min-height:20px;color:#6a7858;}
.msg.error{color:#b05050;}
.msg.ok{color:#4a7a3a;}
</style>
</head>
<body>

<div class="title">欢迎回来</div>

<div class="card">
  <div class="field">
    <label>邮箱</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="field">
    <label>密码</label>
    <input type="password" id="password" placeholder="至少6位" autocomplete="current-password">
  </div>

  <button class="btn btn-primary" id="loginBtn">登录</button>
  <button class="btn btn-secondary" id="signupBtn">还没有账号？注册</button>

  <div class="msg" id="msg"></div>
</div>

<script type="module">
import { signIn, signUp, getCurrentUser } from "./js/services/authService.js";

const emailEl = document.getElementById('email');
const passwordEl = document.getElementById('password');
const msgEl = document.getElementById('msg');
const loginBtn = document.getElementById('loginBtn');
const signupBtn = document.getElementById('signupBtn');

function showMsg(text, type){
  msgEl.textContent = text;
  msgEl.className = 'msg' + (type ? ' ' + type : '');
}

function setBusy(busy){
  loginBtn.disabled = busy;
  signupBtn.disabled = busy;
}

// 如果已经登录，直接跳过登录页
(async () => {
  try {
    const user = await getCurrentUser();
    if (user) {
      window.location.href = 'debug-test.html';
    }
  } catch (e) {
    // 静默失败即可，留在登录页
  }
})();

loginBtn.addEventListener('click', async () => {
  const email = emailEl.value.trim();
  const password = passwordEl.value;
  if (!email || !password) {
    showMsg('请填写邮箱和密码', 'error');
    return;
  }
  setBusy(true);
  showMsg('登录中...');
  try {
    await signIn(email, password);
    showMsg('登录成功', 'ok');
    window.location.href = 'debug-test.html';
  } catch (err) {
    showMsg('登录失败：' + (err.message || '未知错误'), 'error');
    setBusy(false);
  }
});

signupBtn.addEventListener('click', async () => {
  const email = emailEl.value.trim();
  const password = passwordEl.value;
  if (!email || !password) {
    showMsg('请填写邮箱和密码', 'error');
    return;
  }
  if (password.length < 6) {
    showMsg('密码至少需要6位', 'error');
    return;
  }
  setBusy(true);
  showMsg('注册中...');
  try {
    const data = await signUp(email, password);
    if (data.session) {
      showMsg('注册成功', 'ok');
      window.location.href = 'debug-test.html';
    } else {
      showMsg('注册成功，请检查邮箱完成验证后再登录', 'ok');
      setBusy(false);
    }
  } catch (err) {
    showMsg('注册失败：' + (err.message || '未知错误'), 'error');
    setBusy(false);
  }
});
</script>
</body>
</html>
