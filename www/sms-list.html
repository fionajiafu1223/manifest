<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Messages</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;height:100dvh;position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;}

.status-bar{height:env(safe-area-inset-top,44px);background:#fff;flex-shrink:0;}

/* 顶栏 */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 4px;flex-shrink:0;}
.edit-btn{background:#f2f2f7;border-radius:20px;padding:8px 18px;font-size:16px;color:#000;cursor:pointer;}
.top-title{font-size:17px;font-weight:600;color:#000;position:absolute;left:50%;transform:translateX(-50%);}
.filter-btn{background:#f2f2f7;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.filter-btn svg{width:18px;height:18px;stroke:#000;}

/* 个人头像区 */
.profile-area{display:flex;flex-direction:column;align-items:center;padding:14px 0 20px;flex-shrink:0;}
.profile-photo{width:96px;height:96px;border-radius:50%;background:linear-gradient(160deg,#b8c4e0,#8a9cc8);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,0.04);}
.profile-photo svg{width:56px;height:56px;fill:#fff;}
.profile-name{font-size:15px;color:#8e8e93;margin-top:8px;}

/* 会话列表 */
.thread-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px;}
.thread{display:flex;padding:10px 12px 10px 8px;gap:10px;cursor:pointer;align-items:flex-start;position:relative;}
.thread:active{background:#f0f0f0;}
.thread-line{position:absolute;left:74px;right:0;bottom:0;height:0.5px;background:#e5e5e5;}
.thread-dot{width:14px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:center;padding-top:22px;}
.thread-dot span{width:9px;height:9px;border-radius:50%;background:#007aff;display:block;}
.thread-avatar{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:linear-gradient(180deg,#a8b8dc,#8898c4);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.thread-avatar svg{width:32px;height:32px;fill:#fff;}
.thread-body{flex:1;min-width:0;padding-top:2px;}
.thread-top{display:flex;justify-content:space-between;align-items:baseline;}
.thread-name{font-size:17px;color:#000;font-weight:700;letter-spacing:-0.2px;}
.thread-right{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.thread-time{font-size:15px;color:#8e8e93;}
.thread-chevron{color:#c7c7cc;font-size:15px;}
.thread-preview{font-size:15px;color:#8e8e93;line-height:1.35;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* 底部悬浮搜索栏 */
.bottom-float{position:fixed;bottom:0;left:0;width:100%;padding:10px 14px calc(14px + env(safe-area-inset-bottom,20px));display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,0.92) 30%);z-index:40;}
.search-pill{flex:1;background:rgba(118,118,128,0.12);backdrop-filter:blur(20px);border-radius:22px;height:44px;display:flex;align-items:center;padding:0 14px;gap:7px;}
.search-pill svg.mag{width:17px;height:17px;stroke:#8e8e93;flex-shrink:0;}
.search-pill span{flex:1;color:#8e8e93;font-size:17px;}
.search-pill svg.mic{width:17px;height:17px;stroke:#8e8e93;flex-shrink:0;}
.compose-circle{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.compose-circle svg{width:20px;height:20px;stroke:#000;}


/* 对话详情 */
.chat-detail{position:fixed;inset:0;z-index:200;background:#fff;transform:translateX(100%);transition:transform 0.35s;display:flex;flex-direction:column;}
.chat-detail.open{transform:translateX(0);}
.chat-head{display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,44px) + 2px) 12px 6px;flex-shrink:0;border-bottom:0.5px solid #e8e8e8;position:relative;background:rgba(249,249,249,0.94);backdrop-filter:blur(20px);}
.chat-back{position:absolute;left:6px;top:calc(env(safe-area-inset-top,44px) + 14px);color:#007aff;cursor:pointer;display:flex;align-items:center;}
.chat-back svg{width:24px;height:24px;}
.chat-head-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(180deg,#a8b8dc,#8898c4);display:flex;align-items:center;justify-content:center;margin-bottom:2px;overflow:hidden;}
.chat-head-avatar svg{width:30px;height:30px;fill:#fff;}
.chat-head-name{font-size:12px;color:#000;display:flex;align-items:center;gap:2px;}
.chat-head-name svg{width:10px;height:10px;fill:#c7c7cc;}

.chat-body{flex:1;overflow-y:auto;padding:14px 14px;-webkit-overflow-scrolling:touch;background:#fff;}
.msg-time-label{text-align:center;font-size:12px;color:#8e8e93;margin:10px 0 14px;}
.msg-time-label b{font-weight:600;}
.bubble-row{display:flex;margin-bottom:3px;}
.bubble-row.them{justify-content:flex-start;}
.bubble-row.me{justify-content:flex-end;}
.bubble{max-width:74%;padding:8px 13px;border-radius:20px;font-size:17px;line-height:1.3;word-break:break-word;}
.bubble-row.them .bubble{background:#e9e9eb;color:#000;}
.bubble-row.me .bubble{background:#007aff;color:#fff;}

.chat-inputbar{flex-shrink:0;padding:6px 12px calc(8px + env(safe-area-inset-bottom,20px));display:flex;align-items:center;gap:10px;}
.chat-plus{width:34px;height:34px;border-radius:50%;background:#f2f2f7;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-plus svg{width:16px;height:16px;stroke:#3c3c43;}
.chat-input-wrap{flex:1;border:1px solid #d1d1d6;border-radius:18px;height:36px;display:flex;align-items:center;padding:0 6px 0 14px;}
.chat-input{flex:1;border:none;font-size:17px;outline:none;font-family:inherit;background:none;}
.chat-input::placeholder{color:#c7c7cc;}
.chat-mic{width:22px;height:22px;flex-shrink:0;}
.chat-mic svg{width:22px;height:22px;stroke:#c7c7cc;}
</style>
</head>
<body>

<div class="status-bar"></div>

<div class="top-bar">
  <div class="edit-btn" onclick="location.href='desktop.html'">Edit</div>
  <div class="top-title" id="smsTitleLongPress" style="-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;">Messages</div>
  <div class="filter-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="17" x2="14" y2="17"/></svg></div>
</div>

<div class="profile-area">
  <div class="profile-photo"><svg viewBox="0 0 24 24"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2.5c-3.34 0-10 1.67-10 5V22h20v-2.5c0-3.33-6.66-5-10-5z"/></svg></div>
  <div class="profile-name" id="profileName">我</div>
</div>

<div class="thread-list" id="threadList"></div>

<!-- 底部悬浮搜索 -->
<div class="bottom-float">
  <div class="search-pill">
    <svg class="mag" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    <span>Search</span>
    <svg class="mic" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11c0 3.87 3.13 7 7 7s7-3.13 7-7M12 18v3" stroke-linecap="round"/></svg>
  </div>
  <div class="compose-circle">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="5" width="14" height="14" rx="3"/><path d="M15 3l6 6M21 3l-6 6" transform="translate(-1.5,1.5) rotate(-45 18 6)" stroke-linecap="round"/><path d="M12.5 3.5L20 11" opacity="0"/><path d="M20.7 3.3a1 1 0 0 0-1.4 0L13 9.6V12h2.4l6.3-6.3a1 1 0 0 0 0-1.4l-1-1z" fill="#000" stroke="none"/></svg>
  </div>
</div>

<!-- 对话 -->
<div class="chat-detail" id="chatDetail">
  <div class="chat-head">
    <div class="chat-back" onclick="closeChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="chat-head-avatar"><svg viewBox="0 0 24 24"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2.5c-3.34 0-10 1.67-10 5V22h20v-2.5c0-3.33-6.66-5-10-5z"/></svg></div>
    <div class="chat-head-name" id="chatName"></div>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-inputbar">
    <div class="chat-plus"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg></div>
    <div class="chat-input-wrap">
      <input type="text" class="chat-input" placeholder="Text Message · SMS">
      <div class="chat-mic"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11c0 3.87 3.13 7 7 7s7-3.13 7-7M12 18v3" stroke-linecap="round"/></svg></div>
    </div>
  </div>
</div>

<script>
const FALLBACK_THREADS=[];

let threads = [];

// ---- 相对时间显示（短信用英文风格，与邮件一致） ----
function formatSmsTime(iso){
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if(sameDay){
    let h = d.getHours(); const m = String(d.getMinutes()).padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h===0) h = 12;
    return `${h}:${m} ${ampm}`;
  }
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if(d.toDateString() === yest.toDateString()) return 'Yesterday';
  const diffDay = Math.floor((now - d) / 86400000);
  if(diffDay < 7) return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function initThreads(){
  listEl.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#9aa;font-size:14px;">正在加载信息…</div>';

  const { requireUser } = await import('./js/services/authService.js');
  const { supabase } = await import('./js/supabaseClient.js');

  const user = await requireUser();
  if(!user) return;

  const { data: msgs, error } = await supabase
    .from('messages')
    .select('id, character_id, content, sent_at, direction')
    .eq('user_id', user.id)
    .eq('channel', 'sms')
    .order('sent_at', { ascending: true }); // 按角色分组后需要正序还原对话

  if(error){
    console.error(error);
    threads = [];
    render();
    return;
  }

  if(!msgs || msgs.length === 0){
    threads = [];
    render();
    return;
  }

  const byCharacter = {};
  msgs.forEach(m => {
    if(!m.character_id) return;
    if(!byCharacter[m.character_id]) byCharacter[m.character_id] = [];
    byCharacter[m.character_id].push(m);
  });
  const characterIds = Object.keys(byCharacter);
  if(characterIds.length === 0){
    threads = [];
    render();
    return;
  }

  const { data: characters } = await supabase
    .from('characters')
    .select('id, name, display_name, organization_name')
    .eq('user_id', user.id)
    .in('id', characterIds);
  const charMap = {};
  (characters||[]).forEach(c => charMap[c.id] = c);

  threads = characterIds.map(cid => {
    const character = charMap[cid];
    const list = byCharacter[cid]; // 已按 sent_at 正序
    const latest = list[list.length - 1];
    const displayName = character
      ? (character.organization_name || character.display_name || character.name)
      : '未知号码';
    return {
      name: displayName,
      time: formatSmsTime(latest.sent_at),
      unread: list.some(m => m.direction === 'incoming'), // 数据库暂无已读字段，有对方消息就先标未读
      msgs: list.map(m => ({ t: m.content, them: m.direction === 'incoming' })),
      preview: (latest.content||'').replace(/\n/g,' '),
    };
  });

  // 按最新消息时间倒序排列
  threads = characterIds
    .map(cid => ({ cid, latestTime: byCharacter[cid][byCharacter[cid].length-1].sent_at }))
    .sort((a,b) => b.latestTime.localeCompare(a.latestTime))
    .map(x => threads[characterIds.indexOf(x.cid)]);

  render();
}

const personSvg='<svg viewBox="0 0 24 24"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2.5c-3.34 0-10 1.67-10 5V22h20v-2.5c0-3.33-6.66-5-10-5z"/></svg>';

const listEl=document.getElementById('threadList');
function render(){
  listEl.innerHTML='';
  if(threads.length === 0){
    listEl.innerHTML = `<div style="text-align:center;padding:80px 30px;color:#999;">
      <div style="font-size:15px;margin-bottom:8px;">还没有信息</div>
      <div style="font-size:13px;color:#bbb;line-height:1.7;">写下你的人生剧本，专属短信才会出现</div>
    </div>`;
    return;
  }
  threads.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='thread';
    el.innerHTML=`
      <div class="thread-dot">${t.unread?'<span></span>':''}</div>
      <div class="thread-avatar">${personSvg}</div>
      <div class="thread-body">
        <div class="thread-top">
          <span class="thread-name">${t.name}</span>
          <span class="thread-right"><span class="thread-time">${t.time}</span><span class="thread-chevron">›</span></span>
        </div>
        <div class="thread-preview">${t.preview}</div>
      </div>
      <div class="thread-line"></div>
    `;
    el.onclick=()=>openChat(i);
    listEl.appendChild(el);
  });
}

function openChat(i){
  const t=threads[i];
  document.getElementById('chatName').innerHTML=t.name+' <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  const body=document.getElementById('chatBody');
  body.innerHTML='<div class="msg-time-label"><b>Text Message · SMS</b><br>'+t.time+'</div>';
  t.msgs.forEach(m=>{
    const row=document.createElement('div');
    row.className='bubble-row '+(m.them?'them':'me');
    row.innerHTML=`<div class="bubble">${m.t}</div>`;
    body.appendChild(row);
  });
  threads[i].unread=false;
  document.getElementById('chatDetail').classList.add('open');
  render();
}
function closeChat(){ document.getElementById('chatDetail').classList.remove('open'); }

// 头像/姓名首字母：用主角姓名（从main_characters读取）
(async function setProfileName(){
  try{
    const { supabase } = await import('./js/supabaseClient.js');
    const { data: { user } } = await supabase.auth.getUser();
    if(!user) return;
    const { data: mc } = await supabase.from('main_characters').select('name').eq('user_id', user.id).maybeSingle();
    if(mc && mc.name) document.getElementById('profileName').textContent = mc.name;
  }catch(e){}
})();

// 长按"Messages"标题：手动刷新（内容现在由后端统一生成，客户端只负责读取展示）
(function(){
  const el = document.getElementById('smsTitleLongPress');
  let timer = null;
  const start = () => { timer = setTimeout(() => { initThreads(); }, 650); };
  const cancel = () => { if(timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
})();

initThreads().then(()=>{
  try{
    const openIdx = new URLSearchParams(window.location.search).get('open');
    if(openIdx !== null && threads[+openIdx]) openChat(+openIdx);
  }catch(e){}
});
</script>
</body>
</html>
