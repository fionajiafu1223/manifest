<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>潜意识音频工作室</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Noto Sans SC',sans-serif;
  background:linear-gradient(180deg,#f0ecd8 0%,#e4ecc8 25%,#d0e4b8 55%,#b8d8a0 80%,#a0cc90 100%);
  min-height:100vh;color:#4a3828;
  padding:calc(env(safe-area-inset-top,44px) + 1rem) 1.2rem 4rem;
}
.wrap{max-width:460px;margin:0 auto;}
.header{text-align:center;margin-bottom:1.4rem;}
.header h1{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:400;color:#c89030;letter-spacing:4px;margin-bottom:6px;}
.header p{font-size:12px;color:#8a7868;letter-spacing:2px;}

.card{
  background:rgba(255,255,255,0.85);
  border:1px solid rgba(120,160,90,0.3);
  border-radius:20px;padding:1.4rem;margin-bottom:1.2rem;
  backdrop-filter:blur(10px);
}
.card-title{font-family:'Noto Serif SC',serif;font-size:15px;color:#3a4a2a;letter-spacing:2px;margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
.step-num{background:linear-gradient(135deg,#5a9060,#3a7048);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;}

.lib-btn-row{display:flex;justify-content:center;margin-bottom:1rem;}
.lib-btn{
  background:rgba(255,255,255,0.7);border:1px solid rgba(200,150,70,0.45);
  border-radius:20px;padding:9px 20px;font-size:13px;color:#8a6838;cursor:pointer;
  font-family:'Noto Sans SC',sans-serif;display:flex;align-items:center;gap:6px;
}

.mode-tabs{display:flex;gap:6px;margin-bottom:1.2rem;background:rgba(255,255,255,0.45);border-radius:14px;padding:4px;}
.mode-tab{flex:1;padding:10px 4px;border-radius:10px;border:none;background:transparent;color:#5a6a48;font-size:13px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .2s;}
.mode-tab.selected{background:linear-gradient(135deg,#5a9060,#3a7048);color:#fff;font-weight:600;}

.bg-subtabs{display:flex;gap:8px;margin-bottom:10px;}
.bg-subtab{flex:1;padding:7px 4px;border-radius:8px;border:1px solid rgba(150,175,110,0.35);background:rgba(255,255,255,0.4);color:#8a9878;font-size:11px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;}
.bg-subtab.selected{background:rgba(90,144,96,0.18);border-color:#5a9060;color:#3a7048;font-weight:600;}

.headphone-hint{font-size:11px;color:#c89030;text-align:center;margin-top:8px;background:rgba(232,176,74,0.14);border-radius:8px;padding:7px;display:none;}
.headphone-hint.show{display:block;}

.record-area{display:flex;flex-direction:column;align-items:center;gap:14px;}
.record-btn{
  width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1.9rem;
  background:radial-gradient(circle at 38% 35%,rgba(255,120,120,0.85),rgba(180,30,30,0.75));
  box-shadow:0 4px 18px rgba(180,30,30,0.4);transition:transform 0.18s;
}
.record-btn:hover{transform:scale(1.06);}
.record-btn.recording{background:radial-gradient(circle at 38% 35%,rgba(255,60,60,0.9),rgba(160,10,10,0.85));animation:recPulse 1.4s infinite;}
.record-btn.has-recording{background:radial-gradient(circle at 38% 35%,rgba(80,180,120,0.88),rgba(20,100,60,0.78));}
@keyframes recPulse{0%,100%{box-shadow:0 4px 18px rgba(180,30,30,0.4),0 0 0 0 rgba(220,60,60,0.35);}50%{box-shadow:0 4px 24px rgba(220,30,30,0.6),0 0 0 14px rgba(220,60,60,0);}}
.record-timer{font-family:'Noto Serif SC',serif;font-size:1.4rem;color:#4a3828;letter-spacing:0.1em;}
.record-status{font-size:12px;color:#8a7868;letter-spacing:1px;text-align:center;}

.upload-zone{
  border:1.5px dashed rgba(180,140,90,0.4);border-radius:14px;
  padding:14px;text-align:center;cursor:pointer;transition:all 0.2s;
  margin-top:12px;font-size:12px;color:#8a7868;
}
.upload-zone:hover{border-color:rgba(200,150,70,0.7);background:rgba(255,255,255,0.3);}

.guide-tip{
  background:rgba(232,176,74,0.15);border-radius:10px;padding:10px 12px;
  font-size:11px;color:#8a6838;line-height:1.7;margin-bottom:12px;
}

.slider-row{margin-bottom:1.2rem;}
.slider-label{display:flex;justify-content:space-between;font-size:13px;color:#3a4a2a;margin-bottom:8px;}
.slider-value{color:#c89030;font-family:'Noto Serif SC',serif;}
input[type=range]{
  width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:rgba(120,90,60,0.2);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:linear-gradient(135deg,#e8b04a,#c89030);
  box-shadow:0 2px 8px rgba(180,140,60,0.5);cursor:pointer;
}

.btn-row{display:flex;gap:10px;margin-top:8px;}

.bg-type-row{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
.bg-type-btn{
  flex:1;min-width:70px;padding:9px 4px;border-radius:10px;border:1px solid rgba(150,175,110,0.4);
  background:rgba(255,255,255,0.6);color:#5a6a48;font-size:12px;cursor:pointer;
  font-family:'Noto Sans SC',sans-serif;transition:all 0.2s;
}
.bg-type-btn.selected{background:rgba(232,176,74,0.25);border-color:#e8b04a;color:#4a3810;font-weight:600;}
.btn{
  flex:1;padding:12px;border-radius:12px;border:none;cursor:pointer;
  font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:1px;
  transition:opacity 0.2s,transform 0.1s;
}
.btn:active{transform:scale(0.98);}
.btn-play{background:rgba(232,176,74,0.25);color:#8a6838;border:1px solid rgba(200,150,70,0.4);}
.btn-primary{background:linear-gradient(135deg,#d89838,#c88828);color:#fff;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

.hint{font-size:11px;text-align:center;margin-top:10px;line-height:1.6;color:#9a8878;}

.processing{display:none;text-align:center;padding:1rem;color:#8a6838;font-size:13px;}
.processing.show{display:block;}

.modal-overlay{position:fixed;inset:0;background:rgba(30,40,20,0.45);z-index:10000;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.center{align-items:center;}
.modal-card{background:#f4f0dc;width:100%;max-width:460px;max-height:78vh;border-radius:20px 20px 0 0;padding:1.3rem;overflow-y:auto;}
.modal-card.small{border-radius:16px;max-height:none;margin:0 1.2rem;}
.modal-header{font-family:'Noto Serif SC',serif;font-size:16px;color:#3a4a2a;display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
.modal-close{cursor:pointer;color:#8a7868;font-size:16px;padding:4px 8px;}
.modal-tabs{display:flex;gap:8px;margin-bottom:1rem;}
.modal-tab{flex:1;padding:8px;border-radius:10px;border:1px solid rgba(150,175,110,0.35);background:rgba(255,255,255,0.55);color:#5a6a48;font-size:12px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;}
.modal-tab.selected{background:rgba(90,144,96,0.18);border-color:#5a9060;color:#3a7048;font-weight:600;}

.lib-item{background:rgba(255,255,255,0.65);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.lib-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.lib-item-info{flex:1;min-width:0;}
.lib-item-name{font-size:13px;color:#3a4a2a;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-item-date{font-size:10px;color:#9a8878;margin-top:2px;}
.lib-item-btns{display:flex;gap:6px;flex-shrink:0;}
.lib-icon-btn{width:32px;height:32px;border-radius:50%;border:none;background:rgba(90,144,96,0.15);color:#3a7048;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lib-icon-btn.del{background:rgba(200,60,60,0.12);color:#a03030;}
.lib-item audio{width:100%;margin-top:8px;display:none;}
.lib-item audio.show{display:block;}
.lib-empty{text-align:center;color:#9a8878;font-size:12px;padding:2.4rem 0;}

#nameInput{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(150,175,110,0.4);font-size:14px;margin-bottom:1rem;font-family:'Noto Sans SC',sans-serif;box-sizing:border-box;background:#fff;}
.modal-btn-row{display:flex;gap:10px;}
.modal-btn-row button{flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;}
#nameCancelBtn{background:rgba(0,0,0,0.06);color:#5a6a48;}
</style>
</head>
<body>
<div id="back-to-garden" style="position:fixed;top:calc(env(safe-area-inset-top,44px) + 12px);left:16px;z-index:9999;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.6);border:1px solid rgba(120,160,90,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#3a4a2a;" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<div class="wrap">
  <div class="header">
    <h1>潜意识音频</h1>
    <p>SUBLIMINAL STUDIO</p>
  </div>

  <div class="lib-btn-row">
    <button class="lib-btn" id="openLibraryBtn">🎵 我的音频库</button>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab selected" data-mode="immersive">沉浸模式</button>
    <button class="mode-tab" data-mode="ambient">生活背景音</button>
  </div>

  <div id="immersiveMode">
    <div class="card">
      <div class="card-title"><span class="step-num">1</span>录制你的肯定语</div>
      <div class="guide-tip">💫 用「现在时」和「肯定句」，仿佛已经拥有：<br>"我值得被爱" · "金钱源源不断流向我" · "我是自信而闪耀的"</div>
      <div class="record-area">
        <button class="record-btn" id="recordBtn">🎙️</button>
        <div class="record-timer" id="recordTimer">00:00</div>
        <div class="record-status" id="recordStatus">点击开始录制</div>
      </div>
      <div class="upload-zone" id="uploadZone">
        或点击上传已有音频文件
        <input type="file" id="fileInput" accept="audio/*" style="display:none;">
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="step-num">2</span>调节潜意识参数</div>

      <div class="slider-row">
        <div class="slider-label"><span>语速倍数</span><span class="slider-value" id="speedVal">1.0x</span></div>
        <input type="range" id="speedSlider" min="1" max="10" step="0.5" value="1">
      </div>

      <div class="slider-row">
        <div class="slider-label"><span>人声音量</span><span class="slider-value" id="voiceVal">100%</span></div>
        <input type="range" id="voiceSlider" min="0" max="100" step="5" value="100">
      </div>

      <div class="slider-row">
        <div class="slider-label"><span>背景音量</span><span class="slider-value" id="bgVal">50%</span></div>
        <input type="range" id="bgSlider" min="0" max="100" step="5" value="50">
      </div>

      <div class="slider-row">
        <div class="slider-label"><span>背景音类型</span></div>
        <div class="bg-subtabs">
          <button class="bg-subtab selected" data-subtab="noise">噪音类</button>
          <button class="bg-subtab" data-subtab="beat">节拍类</button>
        </div>
        <div class="bg-type-row" id="noiseTypeRow">
          <button class="bg-type-btn selected" data-type="none">无</button>
          <button class="bg-type-btn" data-type="white">白噪音</button>
          <button class="bg-type-btn" data-type="pink">粉噪音</button>
          <button class="bg-type-btn" data-type="brown">深海低频</button>
        </div>
        <div class="bg-type-row" id="beatTypeRow" style="display:none;">
          <button class="bg-type-btn" data-type="delta">Delta 深度睡眠</button>
          <button class="bg-type-btn" data-type="theta">Theta 冥想接入</button>
          <button class="bg-type-btn" data-type="alpha">Alpha 放松专注</button>
          <button class="bg-type-btn" data-type="beta">Beta 清醒行动力</button>
        </div>
        <div class="headphone-hint" id="headphoneHint">🎧 需佩戴耳机才有效果</div>
      </div>

      <div class="btn-row">
        <button class="btn btn-play" id="previewBtn" disabled>▶ 试听效果</button>
      </div>
      <div class="hint">变速不变调 · 人声可调至极低融入背景，潜意识仍能接收</div>
    </div>

    <div class="card">
      <div class="card-title"><span class="step-num">3</span>合成并保存</div>
      <div class="btn-row">
        <button class="btn btn-primary" id="exportBtn" disabled>✦ 合成潜意识音频</button>
      </div>
      <div class="processing" id="processing">正在合成中…</div>
      <div class="hint" id="exportHint" style="display:none;">合成完成！可以直接在下方播放，长按可循环播放一整晚</div>
      <audio id="exportPlayer" controls loop style="display:none;width:100%;margin-top:12px;"></audio>
    </div>
  </div>

  <div id="ambientMode" style="display:none;">
    <div class="card">
      <div class="card-title">生活背景音</div>
      <div class="hint" style="margin-top:0;margin-bottom:12px;">适合家务、运动等外放场景，无需耳机，无需人声</div>
      <div class="bg-type-row" id="ambientTypeRow">
        <button class="bg-type-btn selected" data-type="white">白噪音</button>
        <button class="bg-type-btn" data-type="pink">粉噪音</button>
        <button class="bg-type-btn" data-type="brown">深海低频</button>
      </div>
      <div class="slider-row" style="margin-top:1.2rem;">
        <div class="slider-label"><span>音量</span><span class="slider-value" id="ambientVolVal">60%</span></div>
        <input type="range" id="ambientVolSlider" min="0" max="100" step="5" value="60">
      </div>
      <div class="btn-row">
        <button class="btn btn-play" id="ambientPlayBtn">▶ 播放</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="ambientSaveBtn">✦ 保存到音频库</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="libraryModal" style="display:none;">
  <div class="modal-card">
    <div class="modal-header">我的音频库 <span class="modal-close" id="closeLibraryBtn">✕</span></div>
    <div class="modal-tabs">
      <button class="modal-tab selected" data-libcat="immersive">沉浸音频</button>
      <button class="modal-tab" data-libcat="ambient">生活背景音</button>
    </div>
    <div id="libraryList"></div>
  </div>
</div>

<div class="modal-overlay center" id="nameModal" style="display:none;">
  <div class="modal-card small">
    <div class="modal-header">保存音频</div>
    <input type="text" id="nameInput" placeholder="给这段音频起个名字" maxlength="30">
    <div class="modal-btn-row">
      <button id="nameCancelBtn">取消</button>
      <button id="nameConfirmBtn" class="btn-primary">保存</button>
    </div>
  </div>
</div>

<script>
let audioCtx = null;
let recordedBuffer = null;
let mediaRecorder = null;
let recordChunks = [];
let recordTimerSec = 0;
let recordInterval = null;
let previewSource = null;
let previewBgSource = null;
let previewGain = null;
let previewBgGain = null;
let isPreviewPlaying = false;
let pendingSaveBlob = null;
let pendingSaveCategory = null;

function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }

/* ══════════════════ IndexedDB 音频库 ══════════════════ */
const DB_NAME = 'subliminalStudioDB';
const STORE_NAME = 'audioLibrary';
let dbPromise = null;
function openLibraryDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        store.createIndex('category', 'category', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function saveToLibrary(name, category, blob){
  const db = await openLibraryDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).add({ name, category, blob, createdAt: Date.now() });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function listLibrary(category){
  const db = await openLibraryDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const idx = tx.objectStore(STORE_NAME).index('category');
    const req = idx.getAll(category);
    req.onsuccess = () => resolve(req.result.sort((a,b)=>b.createdAt-a.createdAt));
    req.onerror = () => reject(req.error);
  });
}
async function deleteFromLibrary(id){
  const db = await openLibraryDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ══════════════════ 命名弹层 ══════════════════ */
function openNameModal(blob, category){
  pendingSaveBlob = blob;
  pendingSaveCategory = category;
  document.getElementById('nameInput').value = '';
  document.getElementById('nameModal').style.display = 'flex';
}
document.getElementById('nameCancelBtn').onclick = () => {
  document.getElementById('nameModal').style.display = 'none';
  pendingSaveBlob = null;
};
document.getElementById('nameConfirmBtn').onclick = async () => {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { alert('请输入名字'); return; }
  if (!pendingSaveBlob) return;
  try {
    await saveToLibrary(name, pendingSaveCategory, pendingSaveBlob);
    document.getElementById('nameModal').style.display = 'none';
    pendingSaveBlob = null;
    alert('已保存到音频库！');
  } catch(err) {
    alert('保存失败：' + err.message);
  }
};

/* ══════════════════ 音频库弹层 ══════════════════ */
let currentLibCat = 'immersive';
document.getElementById('openLibraryBtn').onclick = () => {
  document.getElementById('libraryModal').style.display = 'flex';
  renderLibrary();
};
document.getElementById('closeLibraryBtn').onclick = () => {
  document.getElementById('libraryModal').style.display = 'none';
};
document.querySelectorAll('.modal-tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.modal-tab').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    currentLibCat = btn.dataset.libcat;
    renderLibrary();
  };
});
async function renderLibrary(){
  const listEl = document.getElementById('libraryList');
  listEl.innerHTML = '<div class="lib-empty">加载中…</div>';
  let items;
  try { items = await listLibrary(currentLibCat); } catch(err) { items = []; }
  if (!items.length) {
    listEl.innerHTML = '<div class="lib-empty">还没有保存的音频</div>';
    return;
  }
  listEl.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'lib-item';
    const dateStr = new Date(item.createdAt).toLocaleDateString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
    div.innerHTML =
      '<div class="lib-item-top">' +
        '<div class="lib-item-info">' +
          '<div class="lib-item-name"></div>' +
          '<div class="lib-item-date"></div>' +
        '</div>' +
        '<div class="lib-item-btns">' +
          '<button class="lib-icon-btn play-btn">▶</button>' +
          '<button class="lib-icon-btn del del-btn">✕</button>' +
        '</div>' +
      '</div>' +
      '<audio controls loop></audio>';
    div.querySelector('.lib-item-name').textContent = item.name;
    div.querySelector('.lib-item-date').textContent = dateStr;
    const audioEl = div.querySelector('audio');
    const playBtn = div.querySelector('.play-btn');
    playBtn.onclick = () => {
      if (!audioEl.src) audioEl.src = URL.createObjectURL(item.blob);
      audioEl.classList.add('show');
      audioEl.play();
    };
    div.querySelector('.del-btn').onclick = async () => {
      if (!confirm('确定删除「' + item.name + '」吗？')) return;
      await deleteFromLibrary(item.id);
      renderLibrary();
    };
    listEl.appendChild(div);
  });
}

/* ══════════════════ 模式切换 ══════════════════ */
document.querySelectorAll('.mode-tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-tab').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    const mode = btn.dataset.mode;

const recordBtn = document.getElementById('recordBtn');
const recordTimer = document.getElementById('recordTimer');
const recordStatus = document.getElementById('recordStatus');

recordBtn.onclick = async () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  if (recordedBuffer && !confirm('重新录制会覆盖之前的录音，确定吗？')) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    recordChunks = [];
    mediaRecorder.ondataavailable = e => recordChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordInterval);
      const blob = new Blob(recordChunks, { type: mediaRecorder.mimeType });
      const arrayBuf = await blob.arrayBuffer();
      const decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
      recordedBuffer = await decodeCtx.decodeAudioData(arrayBuf);
      decodeCtx.close();
      recordBtn.classList.remove('recording');
      recordBtn.classList.add('has-recording');
      recordBtn.textContent = '✓';
      recordStatus.textContent = '录制完成！调节下方参数试听';
      enableControls();
    };
    mediaRecorder.start();
    recordBtn.classList.add('recording');
    recordBtn.textContent = '⏹';
    recordStatus.textContent = '正在录制…再次点击停止';
    recordTimerSec = 0;
    recordTimer.textContent = '00:00';
    recordInterval = setInterval(() => {
      recordTimerSec++;
      const m = String(Math.floor(recordTimerSec/60)).padStart(2,'0');
      const s = String(recordTimerSec%60).padStart(2,'0');
      recordTimer.textContent = m + ':' + s;
    }, 1000);
  } catch(err) {
    recordStatus.textContent = '无法访问麦克风：' + err.message;
  }
};

const BINAURAL_PRESETS = {
  delta: { diff: 2,  carrier: 200 },
  theta: { diff: 6,  carrier: 250 },
  alpha: { diff: 10, carrier: 235 },
  beta:  { diff: 20, carrier: 200 },
};

function generateNoiseBuffer(type, lengthInSamples, sampleRate){
  const ctx = getCtx();
  const buffer = ctx.createBuffer(2, lengthInSamples, sampleRate);
  for(let ch=0; ch<2; ch++){
    const data = buffer.getChannelData(ch);
    if(type === 'white'){
      for(let i=0;i<lengthInSamples;i++) data[i] = (Math.random()*2-1) * 0.35;
    } else if(type === 'pink'){
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<lengthInSamples;i++){
        const white = Math.random()*2-1;
        b0 = 0.99886*b0 + white*0.0555179;
        b1 = 0.99332*b1 + white*0.0750759;
        b2 = 0.96900*b2 + white*0.1538520;
        b3 = 0.86650*b3 + white*0.3104856;
        b4 = 0.55000*b4 + white*0.5329522;
        b5 = -0.7616*b5 - white*0.0168980;
        const pink = b0+b1+b2+b3+b4+b5+b6+white*0.5362;
        b6 = white*0.115926;
        data[i] = pink * 0.08;
      }
    } else if(type === 'brown'){
      let last = 0;
      for(let i=0;i<lengthInSamples;i++){
        const white = Math.random()*2-1;
        last = (last + 0.02*white) / 1.02;
        data[i] = last * 3.5;
      }
    }
  }
  return buffer;
}

function generateBinauralBuffer(presetKey, lengthInSamples, sampleRate){
  const ctx = getCtx();
  const preset = BINAURAL_PRESETS[presetKey];
  const buffer = ctx.createBuffer(2, lengthInSamples, sampleRate);
  const left = buffer.getChannelData(0);
  const right = buffer.getChannelData(1);
  const leftFreq = preset.carrier;
  const rightFreq = preset.carrier + preset.diff;
  for(let i=0;i<lengthInSamples;i++){
    const t = i / sampleRate;
    left[i]  = Math.sin(2*Math.PI*leftFreq*t)  * 0.25;
    right[i] = Math.sin(2*Math.PI*rightFreq*t) * 0.25;
  }
  return buffer;
}

function generateBgBuffer(type, lengthInSamples, sampleRate){
  if (BEAT_TYPES.has(type)) return generateBinauralBuffer(type, lengthInSamples, sampleRate);
  return generateNoiseBuffer(type, lengthInSamples, sampleRate);
}

function enableControls(){
  document.getElementById('previewBtn').disabled = false;
  document.getElementById('exportBtn').disabled = false;

function hannWindow(N){
  const w = new Float32Array(N);
  for(let i=0;i<N;i++) w[i] = 0.5 - 0.5*Math.cos(2*Math.PI*i/(N-1));
  return w;
}
function timeStretchChannel(input, speed, N, window_){
  const Hs = Math.floor(N/4);
  const Ha = Math.max(1, Math.round(Hs*speed));
  const inLen = input.length;
  const outLen = Math.ceil(inLen/Ha)*Hs + N;
  const output = new Float32Array(outLen);
  const winSum = new Float32Array(outLen);
  let inPos = 0, outPos = 0;
  while(inPos + N <= inLen){
    for(let i=0;i<N;i++){
      const w = window_[i];
      output[outPos+i] += input[inPos+i]*w;
      winSum[outPos+i] += w*w;
    }
    inPos += Ha;
    outPos += Hs;
  }
  const finalLen = Math.max(outPos, 1);
  for(let i=0;i<finalLen;i++){
    if (winSum[i] > 1e-4) output[i] /= Math.max(winSum[i], 0.35);
  }
  return output.subarray(0, finalLen);
}
function processAudio(buffer, speed){
  if (speed === 1) return buffer;
  const numCh = buffer.numberOfChannels;
  const N = 2048;
  const window_ = hannWindow(N);
  const outChannels = [];
  let minLen = Infinity;
  for(let ch=0; ch<numCh; ch++){
    const stretched = timeStretchChannel(buffer.getChannelData(ch), speed, N, window_);
    outChannels.push(stretched);
    minLen = Math.min(minLen, stretched.length);
  }
  const outBuffer = getCtx().createBuffer(numCh, minLen, buffer.sampleRate);
  for(let ch=0; ch<numCh; ch++) outBuffer.copyToChannel(outChannels[ch].subarray(0, minLen), ch);
  return outBuffer;
}

async function startPreview(){
  const btn = document.getElementById('previewBtn');
  try { if (previewSource) previewSource.stop(); } catch(e){}
  try { if (previewBgSource) previewBgSource.stop(); } catch(e){}

  try {
    if(audioCtx && audioCtx.state !== 'closed') { audioCtx.close(); }
  } catch(e){}
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = audioCtx;
  await ctx.resume();

  const speed = parseFloat(speedSlider.value);
  const voiceVol = parseInt(voiceSlider.value) / 100;
  const bgVol = parseInt(bgSlider.value) / 100;

  btn.textContent = '处理中…';

  try {
    const processed = processAudio(recordedBuffer, speed);

    previewSource = ctx.createBufferSource();
    previewSource.buffer = processed;
    const gain = ctx.createGain();
    gain.gain.value = voiceVol;
    previewGain = gain;
    previewSource.connect(gain).connect(ctx.destination);
    previewSource.loop = true;
    previewSource.start();

    let bgSource = null;
    if(bgType !== 'none' && bgVol > 0){
      const bgBuffer = generateBgBuffer(bgType, processed.length, processed.sampleRate);
      bgSource = ctx.createBufferSource();
      bgSource.buffer = bgBuffer;
      const bgGain = ctx.createGain();
      bgGain.gain.value = bgVol;
      previewBgGain = bgGain;
      bgSource.connect(bgGain).connect(ctx.destination);
      bgSource.loop = true;
      bgSource.start();
    } else {
      previewBgGain = null;
    }
    previewBgSource = bgSource;

    isPreviewPlaying = true;
    btn.textContent = '⏹ 停止';

    previewSource.onended = () => {
      isPreviewPlaying = false;
      btn.textContent = '▶ 试听效果';
    };
  } catch(err) {
    console.error(err);
    alert('处理出错：' + err.message);
    btn.textContent = '▶ 试听效果';
    isPreviewPlaying = false;
  }
}

document.getElementById('previewBtn').onclick = async () => {
  const btn = document.getElementById('previewBtn');

    isPreviewPlaying = false;

document.getElementById('exportBtn').onclick = async () => {
  if (!recordedBuffer) return;
  const proc = document.getElementById('processing');
  proc.classList.add('show');

  const speed = parseFloat(speedSlider.value);
  const voiceVol = parseInt(voiceSlider.value) / 100;
  const bgVol = parseInt(bgSlider.value) / 100;

    try {
      const processed = processAudio(recordedBuffer, speed);

      const offline = new OfflineAudioContext(2, processed.length, processed.sampleRate);
      const src = offline.createBufferSource();
      src.buffer = processed;
      const gain = offline.createGain();
      gain.gain.value = voiceVol;
      src.connect(gain).connect(offline.destination);
      src.start();

      if(bgType !== 'none' && bgVol > 0){
        const bgBuffer = generateBgBuffer(bgType, processed.length, processed.sampleRate);
        const bgSrc = offline.createBufferSource();
        bgSrc.buffer = bgBuffer;
        const bgGain = offline.createGain();
        bgGain.gain.value = bgVol;
        bgSrc.connect(bgGain).connect(offline.destination);
        bgSrc.start();
      }

      const rendered = await offline.startRendering();

      const wav = bufferToWav(rendered);
      const blob = new Blob([wav], { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);

      const player = document.getElementById('exportPlayer');
      player.src = url;
      player.style.display = 'block';
      player.loop = true;

      proc.classList.remove('show');
      document.getElementById('exportHint').style.display = 'block';

      openNameModal(blob, 'immersive');
    } catch(err) {
      console.error(err);
      proc.classList.remove('show');
      alert('合成出错：' + err.message);
    }
};

function bufferToWav(buffer) {
  const numCh = buffer.numberOfChannels;
  const len = buffer.length * numCh * 2 + 44;
  const arrBuf = new ArrayBuffer(len);
  const view = new DataView(arrBuf);
  const channels = [];
  let offset = 0, pos = 0;
  function setUint16(d){ view.setUint16(pos, d, true); pos += 2; }
  function setUint32(d){ view.setUint32(pos, d, true); pos += 4; }
  setUint32(0x46464952); setUint32(len - 8); setUint32(0x45564157);
  setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numCh);
  setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numCh);
  setUint16(numCh * 2); setUint16(16);
  setUint32(0x61746164); setUint32(len - pos - 4);
  for (let i = 0; i < numCh; i++) channels.push(buffer.getChannelData(i));
  while (pos < len) {
    for (let i = 0; i < numCh; i++) {
      let sample = Math.max(-1, Math.min(1, channels[i][offset]));
      sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
      view.setInt16(pos, sample, true); pos += 2;
    }
    offset++;
  }
  return arrBuf;
}
