<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>愿景板</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:'Noto Serif SC',serif;
  height:100dvh;position:fixed;inset:0;
  background:linear-gradient(180deg,#f0ecd8 0%,#e4ecc8 25%,#d0e4b8 55%,#b8d8a0 80%,#a0cc90 100%);
  color:#4a3828;
}

/* 顶栏 */
.topbar{
  position:absolute;top:0;left:0;width:100%;z-index:20;
  padding-top:env(safe-area-inset-top,44px);
  display:flex;align-items:center;justify-content:space-between;
  padding-left:12px;padding-right:12px;
  height:calc(env(safe-area-inset-top,44px) + 52px);
}
.back-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#4a3828;}
.back-btn svg{width:20px;height:20px;}
.topbar-title{font-size:17px;letter-spacing:3px;color:#4a3828;}
.mode-toggle{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#4a3828;}
.mode-toggle svg{width:20px;height:20px;}

/* 拼贴模式 */
.collage{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 52px);
  left:0;width:100%;bottom:0;
  overflow-y:auto;padding:12px;
  columns:2;column-gap:10px;
}
.collage-item{
  break-inside:avoid;margin-bottom:10px;border-radius:14px;overflow:hidden;
  position:relative;box-shadow:0 4px 16px rgba(0,0,0,0.3);
  animation:popIn 0.4s ease-out;
}
@keyframes popIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
.collage-item img{width:100%;display:block;}
.collage-item .del{
  position:absolute;top:6px;right:6px;
  width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,0.5);color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;
  opacity:0;transition:opacity 0.2s;
}
.collage-item:hover .del{opacity:1;}

/* 空状态 */
.empty{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;color:#9a8878;width:80%;
}
.empty-icon{font-size:52px;margin-bottom:16px;opacity:0.6;}
.empty-text{font-size:14px;line-height:2;letter-spacing:1px;}

/* 添加按钮 */
.fab{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,20px) + 20px);
  right:20px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#e8b04a,#d89838);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(200,150,60,0.5);cursor:pointer;z-index:20;
  color:#fff;font-size:28px;
}

/* 幻灯片模式 */
.slideshow{
  position:absolute;inset:0;background:#000;z-index:30;
  display:none;overflow:hidden;
}
.slideshow.active{display:block;}
.slide-track{
  position:absolute;inset:0;
  transition:transform 0.35s cubic-bezier(0.2,0.8,0.2,1);
  will-change:transform;
}
.slide-track.dragging{transition:none;}
.slide-frame{
  position:absolute;left:0;width:100%;
  display:flex;align-items:center;justify-content:center;
}
.slide-frame img{max-width:100%;max-height:100%;object-fit:contain;}
.slide-close{position:absolute;top:calc(env(safe-area-inset-top,44px) + 12px);right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;cursor:pointer;z-index:32;}
.slide-hint{position:absolute;top:calc(env(safe-area-inset-top,44px) + 22px);left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:11px;letter-spacing:2px;z-index:32;pointer-events:none;transition:opacity 0.4s;}
.slide-dots{position:absolute;bottom:calc(env(safe-area-inset-bottom,20px) + 20px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:32;max-height:120px;overflow:hidden;}
.slide-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.3);flex-shrink:0;transition:all 0.3s;}
.slide-dot.active{background:#fff;height:16px;border-radius:3px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="back-btn" onclick="location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="topbar-title">愿 景 板</div>
  <div class="mode-toggle" onclick="startSlideshow()" id="slideBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>
  </div>
</div>

<div class="collage" id="collage"></div>

<div class="empty" id="empty">
  <div class="empty-icon">✨</div>
  <div class="empty-text">把你向往的生活收藏进来<br>那些图片，是你正在成为的模样</div>
</div>

<div class="fab" onclick="document.getElementById('fileInput').click()">＋</div>
<input type="file" id="fileInput" accept="image/*" multiple style="display:none;">

<!-- 幻灯片：上下滑动浏览 -->
<div class="slideshow" id="slideshow">
  <div class="slide-close" onclick="closeSlideshow()">✕</div>
  <div class="slide-hint" id="slideHint">向上滑动 · 查看下一张</div>
  <div class="slide-track" id="slideTrack"></div>
  <div class="slide-dots" id="slideDots"></div>
</div>

<script>
let images=[];
try{ images=JSON.parse(localStorage.getItem('visionBoard')||'[]'); }catch(e){ images=[]; }

function save(){
  try{
    localStorage.setItem('visionBoard',JSON.stringify(images));
    return true;
  }catch(e){
    // 存储空间已满：撤销刚加的这一张，避免数据丢失或崩溃
    return false;
  }
}

function render(){
  const collage=document.getElementById('collage');
  const empty=document.getElementById('empty');
  collage.innerHTML='';
  if(images.length===0){ empty.style.display='block'; return; }
  empty.style.display='none';
  images.forEach((src,i)=>{
    const item=document.createElement('div');
    item.className='collage-item';
    item.innerHTML=`<img src="${src}" onclick="openSlideshow(${i})"><button class="del" onclick="event.stopPropagation();delImage(${i})">✕</button>`;
    collage.appendChild(item);
  });
}

// 把单个文件处理成压缩后的图片，失败会reject但不会卡住其他文件
function processFile(file){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')){
      reject('不是图片格式'); return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject('读取文件失败');
    reader.onload = (ev) => {
      const img = new Image();
      img.onerror = () => reject('图片解码失败（可能是不支持的格式）');
      img.onload = () => {
        try{
          const canvas = document.createElement('canvas');
          const maxW = 800;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        }catch(e){ reject('图片压缩失败'); }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function showToast(text){
  let t = document.getElementById('uploadToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'uploadToast';
    t.style.cssText = 'position:fixed;bottom:calc(env(safe-area-inset-bottom,20px) + 90px);left:50%;transform:translateX(-50%);background:rgba(40,30,20,0.88);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.25);';
    document.body.appendChild(t);
  }
  t.textContent = text;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity='0'; }, 2600);
}

document.getElementById('fileInput').onchange = async (e) => {
  const files = [...e.target.files];
  e.target.value = ''; // 允许重复选择同一张图
  if(files.length === 0) return;

  let successCount = 0;
  let failCount = 0;
  let quotaFull = false;

  for(const file of files){
    try{
      const dataUrl = await processFile(file);
      images.push(dataUrl);
      const ok = save();
      if(ok){
        successCount++;
      } else {
        images.pop(); // 撤销这一张，存储空间不够了
        quotaFull = true;
        failCount++;
        break; // 空间已满，后面的也不用再试了
      }
    }catch(err){
      failCount++;
    }
  }

  render();

  if(quotaFull){
    showToast(`存储空间已满，成功添加${successCount}张。请删除一些图片后再试`);
  } else if(failCount > 0 && successCount > 0){
    showToast(`成功添加${successCount}张，${failCount}张上传失败`);
  } else if(failCount > 0 && successCount === 0){
    showToast(`上传失败，请检查图片格式`);
  } else if(successCount > 0){
    showToast(`已添加${successCount}张`);
  }
};

function delImage(i){ images.splice(i,1); save(); render(); }

/* ── 幻灯片：上下滑动浏览（类似Stories/Reels）── */
let slideIdx = 0;
let dragStartY = 0;
let dragDeltaY = 0;
let isDragging = false;
const FRAME_H = () => window.innerHeight;

function buildSlides(){
  const track = document.getElementById('slideTrack');
  track.innerHTML = '';
  images.forEach((src, i) => {
    const frame = document.createElement('div');
    frame.className = 'slide-frame';
    frame.style.top = (i * 100 / images.length) + '%';
    frame.style.height = (100 / images.length) + '%';
    frame.innerHTML = `<img src="${src}">`;
    track.appendChild(frame);
  });
  track.style.height = (images.length * 100) + '%';
}

function startSlideshow(){ if(images.length===0)return; openSlideshow(0); }

function openSlideshow(i){
  slideIdx = i;
  buildSlides();
  positionTrack(false);
  updateDots();
  document.getElementById('slideshow').classList.add('active');
  const hint = document.getElementById('slideHint');
  hint.style.opacity = '1';
  setTimeout(()=>{ hint.style.opacity='0'; }, 2200);
}

function positionTrack(animate){
  const track = document.getElementById('slideTrack');
  track.classList.toggle('dragging', !animate);
  const offsetPercent = -(slideIdx * 100) / images.length;
  const dragPercent = animate ? 0 : (dragDeltaY / FRAME_H()) * (100 / images.length);
  track.style.transform = `translateY(${offsetPercent + dragPercent}%)`;
}

function updateDots(){
  const dots = document.getElementById('slideDots');
  dots.innerHTML = '';
  const maxDots = 8;
  const total = images.length;
  images.forEach((_, i) => {
    if(total > maxDots && Math.abs(i - slideIdx) > 3) return; // 太多图时只显示附近的点
    const d = document.createElement('div');
    d.className = 'slide-dot' + (i === slideIdx ? ' active' : '');
    dots.appendChild(d);
  });
}

function goToSlide(i){
  if(i < 0 || i >= images.length) return;
  slideIdx = i;
  positionTrack(true);
  updateDots();
}
function nextSlide(){ goToSlide(slideIdx + 1); }
function prevSlide(){ goToSlide(slideIdx - 1); }
function closeSlideshow(){ document.getElementById('slideshow').classList.remove('active'); }

const slideshowEl = document.getElementById('slideshow');
slideshowEl.addEventListener('touchstart', (e) => {
  if(e.target.closest('.slide-close')) return;
  dragStartY = e.touches[0].clientY;
  dragDeltaY = 0;
  isDragging = true;
}, {passive:true});

slideshowEl.addEventListener('touchmove', (e) => {
  if(!isDragging) return;
  dragDeltaY = e.touches[0].clientY - dragStartY;
  // 在首末张时，往外拖拽增加阻尼感
  if((slideIdx===0 && dragDeltaY>0) || (slideIdx===images.length-1 && dragDeltaY<0)){
    dragDeltaY *= 0.35;
  }
  positionTrack(false);
}, {passive:true});

slideshowEl.addEventListener('touchend', () => {
  if(!isDragging) return;
  isDragging = false;
  const threshold = FRAME_H() * 0.15;
  if(dragDeltaY < -threshold){ nextSlide(); }
  else if(dragDeltaY > threshold){ prevSlide(); }
  else { positionTrack(true); }
  dragDeltaY = 0;
});

render();
</script>
</body>
</html>
