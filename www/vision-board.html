<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>愿景板</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:'Noto Serif SC',serif;
  height:100dvh;position:fixed;inset:0;
  background:linear-gradient(180deg,#f3f6e2 0%,#e7eeca 25%,#d2deb2 55%,#a1ba76 80%,#688a41 100%);
  color:#22460f;
}

/* 顶栏 */
.topbar{
  position:absolute;top:0;left:0;width:100%;z-index:20;
  padding-top:env(safe-area-inset-top,44px);
  display:flex;align-items:center;justify-content:space-between;
  padding-left:12px;padding-right:12px;
  height:calc(env(safe-area-inset-top,44px) + 52px);
}
.back-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#22460f;}
.back-btn svg{width:20px;height:20px;}
.topbar-title{font-size:17px;letter-spacing:3px;color:#22460f;}

/* 拼贴模式 */
.collage{
  position:absolute;top:calc(env(safe-area-inset-top,44px) + 52px);
  left:0;width:100%;bottom:0;
  overflow-y:auto;padding:12px;
  columns:2;column-gap:10px;
}
.collage-item{
  break-inside:avoid;margin-bottom:10px;border-radius:14px;overflow:hidden;
  position:relative;box-shadow:0 4px 16px rgba(0,0,0,0.3);
  animation:popIn 0.4s ease-out;cursor:pointer;
}
@keyframes popIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
.collage-item img{width:100%;display:block;}
.collage-item .cap{
  padding:8px 10px 10px;font-size:12px;line-height:1.5;color:#22460f;
  background:rgba(255,255,255,0.55);
}

/* 空状态 / 加载 / 出错 */
.empty,.loading,.errbox{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;color:#688a41;width:80%;
}
.empty-icon{font-size:52px;margin-bottom:16px;opacity:0.6;}
.empty-text,.loading-text,.errbox-text{font-size:14px;line-height:2;letter-spacing:1px;}
.errbox button{
  margin-top:14px;padding:8px 20px;border-radius:20px;border:none;
  background:linear-gradient(135deg,#688a41,#436b29);color:#fbfbf6;font-size:13px;letter-spacing:2px;
}

/* 添加按钮 */
.fab{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,20px) + 20px);
  right:20px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#688a41,#436b29);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(104,138,65,0.5);cursor:pointer;z-index:20;
  color:#fff;font-size:28px;
}
.fab.disabled{opacity:0.5;pointer-events:none;}

/* 底部弹层（新增详情 / 编辑详情共用） */
.sheet-mask{
  position:absolute;inset:0;background:rgba(0,0,0,0.4);z-index:40;
  display:none;
}
.sheet-mask.active{display:block;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;
  background:#f3f6e2;border-radius:20px 20px 0 0;
  padding:18px 18px calc(env(safe-area-inset-bottom,16px) + 18px);
  max-height:80vh;overflow-y:auto;
  transform:translateY(100%);transition:transform 0.3s ease-out;
}
.sheet-mask.active .sheet{transform:translateY(0);}
.sheet-preview{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:14px;display:block;}
.sheet label{display:block;font-size:12px;color:#688a41;letter-spacing:1px;margin-bottom:6px;margin-top:14px;}
.sheet textarea{
  width:100%;border:1px solid rgba(104,138,65,0.4);border-radius:10px;padding:10px;
  font-family:inherit;font-size:14px;color:#22460f;background:#fff;resize:none;min-height:60px;
}
.sheet select{
  width:100%;border:1px solid rgba(104,138,65,0.4);border-radius:10px;padding:10px;
  font-family:inherit;font-size:14px;color:#22460f;background:#fff;
}
.intent-toggle{display:flex;gap:8px;}
.intent-btn{
  flex:1;padding:10px;text-align:center;border-radius:10px;border:1px solid rgba(104,138,65,0.4);
  font-size:13px;color:#688a41;background:#fff;cursor:pointer;
}
.intent-btn.active{background:linear-gradient(135deg,#688a41,#436b29);color:#fbfbf6;border-color:#688a41;}
.sheet-actions{display:flex;gap:10px;margin-top:20px;}
.sheet-actions button{
  flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;letter-spacing:2px;
  font-family:inherit;
}
.btn-cancel{background:#f3f6e2;color:#688a41;}
.btn-save{background:linear-gradient(135deg,#688a41,#436b29);color:#fbfbf6;}
.btn-danger{background:#b05050;color:#fff;}

/* 详情大图区 */
.detail-img{width:100%;max-height:38vh;object-fit:contain;border-radius:12px;margin-bottom:6px;}

/* toast */
#uploadToast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,20px) + 90px);left:50%;transform:translateX(-50%);
  background:rgba(40,30,20,0.88);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:999;
  white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.25);opacity:0;transition:opacity 0.3s;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="back-btn" onclick="location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="topbar-title">愿 景 板</div>
  <div style="width:38px;"></div>
</div>

<div class="collage" id="collage" style="display:none;"></div>
<div class="empty" id="empty" style="display:none;">
  <div class="empty-icon">✨</div>
  <div class="empty-text">把你向往的生活收藏进来<br>那些图片，是你正在成为的模样</div>
</div>
<div class="loading" id="loading">
  <div class="loading-text">加载中…</div>
</div>
<div class="errbox" id="errbox" style="display:none;">
  <div class="errbox-text">加载失败，请重试</div>
  <button onclick="init()">重试</button>
</div>

<div class="fab" id="fab" onclick="document.getElementById('fileInput').click()">＋</div>
<input type="file" id="fileInput" accept="image/*" style="display:none;">

<!-- 新增：填写描述 / 场景 / 意图 -->
<div class="sheet-mask" id="addSheetMask">
  <div class="sheet">
    <img class="sheet-preview" id="addPreview" src="">
    <label>这张图对你来说是什么？</label>
    <textarea id="addDesc" placeholder="例如：这是我想要的车"></textarea>
    <label id="addSceneLabel" style="display:none;">关联到我的生活场景（可选）</label>
    <select id="addScene" style="display:none;"></select>
    <label>这张图，你想……</label>
    <div class="intent-toggle">
      <div class="intent-btn active" id="addIntentFuture" onclick="setAddIntent('future')">放进未来</div>
      <div class="intent-btn" id="addIntentScript" onclick="setAddIntent('script')">写进我的人生</div>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="cancelAdd()">取消</button>
      <button class="btn-save" onclick="confirmAdd()">保存</button>
    </div>
  </div>
</div>

<!-- 详情 / 编辑 -->
<div class="sheet-mask" id="detailSheetMask">
  <div class="sheet">
    <img class="detail-img" id="detailImg" src="">
    <label>这张图对你来说是什么？</label>
    <textarea id="detailDesc" placeholder="例如：这是我想要的车"></textarea>
    <label id="detailSceneLabel" style="display:none;">关联到我的生活场景（可选）</label>
    <select id="detailScene" style="display:none;"></select>
    <label>这张图，你想……</label>
    <div class="intent-toggle">
      <div class="intent-btn" id="detailIntentFuture" onclick="setDetailIntent('future')">放进未来</div>
      <div class="intent-btn" id="detailIntentScript" onclick="setDetailIntent('script')">写进我的人生</div>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeDetail()">关闭</button>
      <button class="btn-save" onclick="saveDetail()">保存修改</button>
    </div>
    <div class="sheet-actions">
      <button class="btn-danger" style="flex:none;width:100%;" onclick="deleteDetail()">删除这张愿景</button>
    </div>
  </div>
</div>

<div id="uploadToast"></div>

<script type="module">
import { requireUser } from "./js/services/authService.js";
import {
  getVisionAssets, createVisionAsset, updateVisionAsset, deleteVisionAsset,
  uploadVisionImage, deleteVisionImageQuiet, getScenesForPicker
} from "./js/services/visionBoardService.js";

let assets = [];
let scenes = [];
let pendingUpload = null; // { url, path }
let addIntent = 'future';
let detailIntent = 'future';
let activeDetailId = null;

function showToast(text){
  const t = document.getElementById('uploadToast');
  t.textContent = text;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity='0'; }, 2600);
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function fillSceneSelect(selectEl, selectedId){
  selectEl.innerHTML = '<option value="">不关联</option>' +
    scenes.map(s => `<option value="${s.id}"${s.id===selectedId?' selected':''}>${esc(s.name)}</option>`).join('');
}

function render(){
  const collage = document.getElementById('collage');
  const empty = document.getElementById('empty');
  if(assets.length === 0){
    collage.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  collage.style.display = 'block';
  collage.innerHTML = assets.map(a => `
    <div class="collage-item" onclick="openDetail('${a.id}')">
      <img src="${esc(a.image_url)}" loading="lazy">
      ${a.description ? `<div class="cap">${esc(a.description)}</div>` : ''}
    </div>
  `).join('');
}

window.init = async function init(){
  document.getElementById('loading').style.display = 'block';
  document.getElementById('errbox').style.display = 'none';
  document.getElementById('collage').style.display = 'none';
  document.getElementById('empty').style.display = 'none';
  try{
    const user = await requireUser();
    if(!user) return;
    const [a, s] = await Promise.all([getVisionAssets(), getScenesForPicker()]);
    assets = a;
    scenes = s;
    document.getElementById('loading').style.display = 'none';
    if(scenes.length > 0){
      document.getElementById('addSceneLabel').style.display = 'block';
      document.getElementById('addScene').style.display = 'block';
      document.getElementById('detailSceneLabel').style.display = 'block';
      document.getElementById('detailScene').style.display = 'block';
    }
    render();
  }catch(e){
    document.getElementById('loading').style.display = 'none';
    document.getElementById('errbox').style.display = 'block';
  }
};

/* ── 新增流程 ── */
document.getElementById('fileInput').onchange = async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  if(!file.type || !file.type.startsWith('image/')){
    showToast('请选择图片文件');
    return;
  }

  const fab = document.getElementById('fab');
  fab.classList.add('disabled');
  showToast('上传中…');
  try{
    const { url, path } = await uploadVisionImage(file);
    pendingUpload = { url, path };
    openAddSheet(url);
  }catch(err){
    showToast('图片上传失败，请重试');
  }finally{
    fab.classList.remove('disabled');
  }
};

function openAddSheet(url){
  document.getElementById('addPreview').src = url;
  document.getElementById('addDesc').value = '';
  fillSceneSelect(document.getElementById('addScene'), '');
  setAddIntent('future');
  document.getElementById('addSheetMask').classList.add('active');
}

window.setAddIntent = function(v){
  addIntent = v;
  document.getElementById('addIntentFuture').classList.toggle('active', v==='future');
  document.getElementById('addIntentScript').classList.toggle('active', v==='script');
};

window.cancelAdd = async function(){
  document.getElementById('addSheetMask').classList.remove('active');
  if(pendingUpload){
    deleteVisionImageQuiet(pendingUpload.path);
    pendingUpload = null;
  }
};

window.confirmAdd = async function(){
  if(!pendingUpload) return;
  const description = document.getElementById('addDesc').value.trim();
  const sceneSel = document.getElementById('addScene');
  const scene_id = sceneSel.style.display !== 'none' ? (sceneSel.value || null) : null;
  try{
    const row = await createVisionAsset({
      image_url: pendingUpload.url,
      description,
      scene_id,
      intent_type: addIntent
    });
    assets.unshift(row);
    render();
    document.getElementById('addSheetMask').classList.remove('active');
    pendingUpload = null;
    showToast('已添加');
  }catch(err){
    showToast('保存失败，请重试');
    if(pendingUpload){
      deleteVisionImageQuiet(pendingUpload.path);
      pendingUpload = null;
    }
  }
};

/* ── 详情 / 编辑 / 删除 ── */
window.openDetail = function(id){
  const a = assets.find(x => x.id === id);
  if(!a) return;
  activeDetailId = id;
  document.getElementById('detailImg').src = a.image_url;
  document.getElementById('detailDesc').value = a.description || '';
  fillSceneSelect(document.getElementById('detailScene'), a.scene_id || '');
  setDetailIntent(a.intent_type === 'script' ? 'script' : 'future');
  document.getElementById('detailSheetMask').classList.add('active');
};

window.setDetailIntent = function(v){
  detailIntent = v;
  document.getElementById('detailIntentFuture').classList.toggle('active', v==='future');
  document.getElementById('detailIntentScript').classList.toggle('active', v==='script');
};

window.closeDetail = function(){
  document.getElementById('detailSheetMask').classList.remove('active');
  activeDetailId = null;
};

window.saveDetail = async function(){
  if(!activeDetailId) return;
  const description = document.getElementById('detailDesc').value.trim();
  const sceneSel = document.getElementById('detailScene');
  const scene_id = sceneSel.style.display !== 'none' ? (sceneSel.value || null) : null;
  try{
    const updated = await updateVisionAsset(activeDetailId, { description, scene_id, intent_type: detailIntent });
    const idx = assets.findIndex(x => x.id === activeDetailId);
    if(idx >= 0) assets[idx] = updated;
    render();
    closeDetail();
    showToast('已保存');
  }catch(err){
    showToast('保存失败，请重试');
  }
};

window.deleteDetail = async function(){
  if(!activeDetailId) return;
  const id = activeDetailId;
  try{
    await deleteVisionAsset(id);
    assets = assets.filter(x => x.id !== id);
    render();
    closeDetail();
    showToast('已删除');
  }catch(err){
    showToast('删除失败，请重试');
  }
};

init();
</script>
</body>
</html>
