<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>微信</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  background:#ededed;
  height:100dvh;
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;right:0;bottom:0;
}

/* 顶部状态栏占位 */
.status-bar{
  height:env(safe-area-inset-top, 44px);
  background:#ededed;flex-shrink:0;
}

/* 微信标题栏 */
.wx-header{
  background:#ededed;
  padding:8px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.wx-title{font-size:17px;font-weight:600;color:#000;}
.wx-header-icons{display:flex;gap:22px;}
.wx-header-icons svg{width:23px;height:23px;stroke:#000;fill:none;stroke-width:2;}

/* 返回（和全App其他页面统一放左上角） */
.back-garden{position:fixed;top:calc(env(safe-area-inset-top,44px) + 12px);left:16px;z-index:9999;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.7);border:1px solid rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#000;}
.back-garden svg{width:19px;height:19px;stroke:#000;fill:none;stroke-width:2;}

/* 搜索框 */
.search-bar{
  padding:0 12px 8px;background:#ededed;flex-shrink:0;
}
.search-box{
  background:#fff;border-radius:6px;height:36px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  color:#9b9b9b;font-size:15px;
}
.search-box svg{width:16px;height:16px;stroke:#9b9b9b;fill:none;stroke-width:2;}

/* 加载中 */
.loading-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:60%;color:#9b9b9b;font-size:14px;gap:14px;
}
.loading-dot{
  width:8px;height:8px;border-radius:50%;background:#07c160;
  animation:loadPulse 1.2s ease-in-out infinite;
}
.loading-dots{display:flex;gap:6px;}
.loading-dots .loading-dot:nth-child(2){animation-delay:0.2s;}
.loading-dots .loading-dot:nth-child(3){animation-delay:0.4s;}
@keyframes loadPulse{0%,100%{opacity:0.3;transform:scale(0.8);}50%{opacity:1;transform:scale(1.1);}}

/* 聊天列表 */
.chat-list{
  flex:1;overflow-y:auto;background:#fff;
  -webkit-overflow-scrolling:touch;
}
.chat-item{
  display:flex;padding:12px 16px 12px 14px;
  align-items:center;gap:12px;
  border-bottom:0.5px solid #ededed;
  cursor:pointer;position:relative;
}
.chat-item:active{background:#e5e5e5;}

.chat-avatar{
  width:48px;height:48px;border-radius:6px;
  flex-shrink:0;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#fff;font-weight:500;
  overflow:hidden;
}
.chat-avatar img{width:100%;height:100%;object-fit:cover;}

/* 未读红点 */
.unread-dot{
  position:absolute;top:-4px;right:-4px;
  background:#fa5151;color:#fff;
  min-width:18px;height:18px;border-radius:9px;
  font-size:12px;display:flex;align-items:center;justify-content:center;
  padding:0 5px;border:2px solid #fff;
}

.chat-content{flex:1;min-width:0;}
.chat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.chat-name{font-size:17px;color:#000;font-weight:400;}
.chat-time{font-size:12px;color:#b2b2b2;flex-shrink:0;margin-left:8px;}
.chat-preview{
  font-size:14px;color:#9b9b9b;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 底部Tab */
.tab-bar{
  display:flex;background:#f7f7f7;
  border-top:0.5px solid #d5d5d5;
  padding-bottom:env(safe-area-inset-bottom, 20px);
  flex-shrink:0;
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:6px 0 4px;gap:2px;cursor:pointer;
}
.tab-item.disabled{opacity:1;}
.tab-icon{width:26px;height:26px;position:relative;}
.tab-icon svg{width:26px;height:26px;}
.tab-label{font-size:10px;color:#7f7f7f;}
.tab-item.active .tab-label{color:#07c160;}
.tab-badge{
  position:absolute;top:-3px;right:-6px;
  background:#fa5151;color:#fff;
  min-width:16px;height:16px;border-radius:8px;
  font-size:11px;display:flex;align-items:center;justify-content:center;
  padding:0 4px;border:1.5px solid #f7f7f7;
}
</style>
</head>
<body>

<div class="status-bar"></div>

<div class="back-garden" onclick="location.href='desktop.html'" style="background:transparent;border:none;box-shadow:none;"></div>

<!-- 微信标题栏 -->
<div class="wx-header">
  <div class="wx-title" id="wxTitleLongPress" style="-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;">微信</div>
  <div class="wx-header-icons">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </div>
</div>

<!-- 搜索 -->
<div class="search-bar">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
    搜索
  </div>
</div>

<!-- 聊天列表 -->
<div class="chat-list" id="chatList"></div>

<!-- 底部Tab -->
<div class="tab-bar">
  <div class="tab-item active">
    <div class="tab-icon">
      <svg viewBox="0 0 26 26" fill="#07c160"><path d="M13 2C6.9 2 2 6.5 2 12c0 3.1 1.6 5.9 4.1 7.7L5 23l3.8-2c1.3.4 2.7.6 4.2.6 6.1 0 11-4.5 11-10S19.1 2 13 2z"/></svg>
      <div class="tab-badge" id="tabBadge">5</div>
    </div>
    <div class="tab-label">微信</div>
  </div>
  <div class="tab-item disabled">
    <div class="tab-icon">
      <svg viewBox="0 0 26 26" fill="#7f7f7f"><circle cx="13" cy="8" r="4"/><path d="M5 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    </div>
    <div class="tab-label">通讯录</div>
  </div>
  <div class="tab-item disabled">
    <div class="tab-icon">
      <svg viewBox="0 0 26 26" fill="none" stroke="#7f7f7f" stroke-width="2"><circle cx="13" cy="13" r="10"/><circle cx="13" cy="13" r="3" fill="#7f7f7f"/></svg>
    </div>
    <div class="tab-label">发现</div>
  </div>
  <div class="tab-item disabled">
    <div class="tab-icon">
      <svg viewBox="0 0 26 26" fill="#7f7f7f"><circle cx="13" cy="8" r="4"/><path d="M5 22c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    </div>
    <div class="tab-label">我</div>
  </div>
</div>

<script>
const AVATAR_COLORS = ['#8b6f47','#2a5a8a','#3a3a3a','#1a3a6a','#7a2a2a','#2a2a2a','#4a5a7a','#5a7a3a','#6a3a6a'];

// 没有剧本数据时的兜底：空数组，不再预设联系人
const FALLBACK_CONTACTS = [];

// ---- 头像生成：根据人物性格/角色关键词，从4种风格里挑一种（不是所有人都用真人照片） ----
function hashStr(s){
  let h = 0;
  for(let i=0; i<s.length; i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function pickAvatarType(name, roleText, characterText){
  const text = (roleText||'') + (characterText||'');
  if(/艺术|设计|插画|音乐|诗|作家|摄影师|策展/.test(text)) return 'abstract';
  if(/自然|户外|旅行|登山|徒步|田园|海边|骑行|露营/.test(text)) return 'landscape';
  if(/学生|年轻|活泼|网红|游戏|二次元|博主/.test(text)) return 'cartoon';
  // 没有明显关键词：按姓名做稳定的伪随机分配，保证同一人物每次刷新头像不变，且整体风格有变化
  const types = ['portrait','portrait','cartoon','landscape','abstract'];
  return types[hashStr(name) % types.length];
}
function inferGenderCode(g){
  if(!g) return null;
  const s = String(g).trim();
  if(/^(男|male|m$|man|先生)/i.test(s)) return 'men';
  if(/^(女|female|f$|woman|女士)/i.test(s)) return 'women';
  return null;
}
function avatarUrlFor(type, seed, genderCode){
  const h = hashStr(seed);
  switch(type){
    case 'portrait': {
      const gender = genderCode || (h % 2 === 0 ? 'women' : 'men');
      const idx = (h % 80) + 1;
      return `https://randomuser.me/api/portraits/${gender}/${idx}.jpg`;
    }
    case 'landscape': {
      const ids = [1018,1015,1043,1036,1039,1050,1044,1024];
      const id = ids[h % ids.length];
      return `https://picsum.photos/id/${id}/200/200`;
    }
    case 'cartoon':
      return `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(seed)}`;
    case 'abstract':
      return `https://api.dicebear.com/7.x/shapes/svg?seed=${encodeURIComponent(seed)}`;
  }
}
function autoAvatarImg(name, roleText, characterText, genderHint){
  const type = pickAvatarType(name, roleText, characterText);
  return avatarUrlFor(type, name, inferGenderCode(genderHint));
}

const chatList = document.getElementById('chatList');
let contacts = [];

function showLoading(text){
  chatList.innerHTML = `<div class="loading-state"><div class="loading-dots"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div><div>${text}</div></div>`;
}

// ---- 相对时间显示：刚刚 / HH:MM / 昨天 / 星期几 / 日期 ----
function formatMsgTime(iso){
  const d = new Date(iso);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = diffMs / 60000;
  if(diffMin < 2) return '刚刚';
  const sameDay = d.toDateString() === now.toDateString();
  if(sameDay) return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if(d.toDateString() === yest.toDateString()) return '昨天';
  const diffDay = Math.floor(diffMs / 86400000);
  if(diffDay < 7) return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return (d.getMonth()+1)+'/'+d.getDate();
}

function renderList() {
  chatList.innerHTML = '';
  if(contacts.length === 0){
    chatList.innerHTML = `<div style="text-align:center;padding:80px 30px;color:#999;">
      <div style="font-size:15px;margin-bottom:8px;">这里还没有人</div>
      <div style="font-size:13px;color:#bbb;line-height:1.7;">写下你的人生剧本，这个世界才会开始有人与你联系</div>
    </div>`;
    document.getElementById('tabBadge').style.display = 'none';
    return;
  }
  contacts.forEach(c => {
    const item = document.createElement('div');
    item.className = 'chat-item';
    const avatarInner = c.avatarImg
      ? `<img src="${c.avatarImg}" style="width:100%;height:100%;object-fit:cover;">`
      : (c.avatar || (c.name ? c.name[0] : '?'));
    item.innerHTML = `
      <div class="chat-avatar" style="background:${c.color};">
        ${avatarInner}
        ${c.unread > 0 ? `<div class="unread-dot">${c.unread}</div>` : ''}
      </div>
      <div class="chat-content">
        <div class="chat-top">
          <span class="chat-name">${c.name}</span>
          <span class="chat-time">${c.time}</span>
        </div>
        <div class="chat-preview">${c.preview}</div>
      </div>
    `;
    item.onclick = () => {
      window.location.href = 'wechat-sim.html?id=' + encodeURIComponent(c.id);
    };
    chatList.appendChild(item);
  });

  const totalUnread = contacts.reduce((sum, c) => sum + (c.unread||0), 0);
  document.getElementById('tabBadge').textContent = totalUnread;
  document.getElementById('tabBadge').style.display = totalUnread > 0 ? 'flex' : 'none';
}

// 已读状态存在本地（数据库messages表目前没有已读字段，读没读是纯UI层面的事）
const READ_STATE_KEY = 'wechatReadState';
function getReadState(){
  try{ return JSON.parse(localStorage.getItem(READ_STATE_KEY)||'{}'); }catch(e){ return {}; }
}

async function init(){
  showLoading('正在连接这个世界…');

  const { requireUser } = await import('./js/services/authService.js');
  const { supabase } = await import('./js/supabaseClient.js');

  const user = await requireUser();
  if(!user) return;

  const { data: msgs, error: msgError } = await supabase
    .from('messages')
    .select('id, character_id, content, sent_at, direction, sender_type')
    .eq('user_id', user.id)
    .eq('channel', 'wechat')
    .lte('sent_at', new Date().toISOString())
    .order('sent_at', { ascending: false });

  if(msgError){
    console.error(msgError);
    contacts = [];
    renderList();
    return;
  }

  if(!msgs || msgs.length === 0){
    contacts = [];
    renderList();
    return;
  }

  // 按角色分组：取每个角色最新一条做预览，AI发来的（incoming）消息才计入未读
  const byCharacter = {};
  msgs.forEach(m => {
    if(!m.character_id) return;
    if(!byCharacter[m.character_id]) byCharacter[m.character_id] = [];
    byCharacter[m.character_id].push(m);
  });
  const characterIds = Object.keys(byCharacter);
  if(characterIds.length === 0){
    contacts = [];
    renderList();
    return;
  }

  const { data: characters, error: charError } = await supabase
    .from('characters')
    .select('id, name, display_name, personality, job_title, organization_name, origin, avatar_url, canon')
    .eq('user_id', user.id)
    .in('id', characterIds);

  if(charError){
    console.error(charError);
    contacts = [];
    renderList();
    return;
  }

  const readState = getReadState();
  const charMap = {};
  (characters||[]).forEach(c => charMap[c.id] = c);

  contacts = characterIds.map((cid, i) => {
    const character = charMap[cid];
    if(!character) return null;
    const list = byCharacter[cid]; // 已按 sent_at desc 排序
    const latest = list[0];
    const displayName = character.display_name || character.name || '未知联系人';
    const lastRead = readState[cid] || null;
    const unread = list.filter(m => m.direction === 'incoming' && (!lastRead || m.sent_at > lastRead)).length;
    return {
      id: cid,
      name: displayName,
      avatar: displayName[0],
      avatarImg: character.avatar_url || autoAvatarImg(displayName, character.job_title||'', character.personality||'', character.canon?.gender||''),
      color: AVATAR_COLORS[i % AVATAR_COLORS.length],
      preview: (latest.content||'').replace(/\n/g,' ').slice(0, 40),
      firstMessage: latest.content,
      time: formatMsgTime(latest.sent_at),
      unread,
      role: character.job_title,
      character: character.personality,
      isUserCreated: character.origin === 'user',
    };
  }).filter(Boolean);

  // 按最新消息时间倒序排列（分组后原有顺序已被打乱）
  contacts.sort((a,b) => (byCharacter[b.id][0].sent_at).localeCompare(byCharacter[a.id][0].sent_at));

  renderList();
}

// 长按标题"微信"两个字：手动刷新（不再是重新生成内容——内容现在由后端统一生成，客户端只负责读取展示）
(function(){
  const el = document.getElementById('wxTitleLongPress');
  let timer = null;
  let startX = 0, startY = 0;
  const MOVE_TOLERANCE = 14; // 允许的手指抖动范围，太严格会导致真实长按因为手指自然的轻微移动被误判取消

  const doRefresh = () => { init(); };
  const start = (x, y) => { startX = x; startY = y; timer = setTimeout(doRefresh, 650); };
  const cancel = () => { if(timer){ clearTimeout(timer); timer=null; } };
  const checkMove = (x, y) => {
    if(timer && (Math.abs(x - startX) > MOVE_TOLERANCE || Math.abs(y - startY) > MOVE_TOLERANCE)) cancel();
  };
  // passive:false + preventDefault，彻底屏蔽iOS原生的长按菜单（复制/分享/存储到照片）
  el.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; start(t.clientX,t.clientY); }, {passive:true});
  el.addEventListener('touchmove', (e)=>{ const t=e.touches[0]; checkMove(t.clientX,t.clientY); }, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('contextmenu', (e)=>e.preventDefault());
  el.addEventListener('mousedown', (e)=>start(e.clientX,e.clientY));
  el.addEventListener('mousemove', (e)=>checkMove(e.clientX,e.clientY));
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
})();

init();
</script>
</body>
</html>
