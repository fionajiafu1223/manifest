<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>微信</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  background:#ededed;
  height:100dvh;
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;right:0;bottom:0;
}

/* 顶部状态栏占位 */
.status-bar{
  height:env(safe-area-inset-top, 44px);
  background:#ededed;flex-shrink:0;
}

/* 微信标题栏 */
.wx-header{
  background:#ededed;
  padding:8px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.wx-title{font-size:17px;font-weight:600;color:#000;}
.wx-header-icons{display:flex;gap:22px;}
.wx-header-icons svg{width:23px;height:23px;stroke:#000;fill:none;stroke-width:2;}

/* 返回（和全App其他页面统一放左上角） */
.back-garden{position:fixed;top:calc(env(safe-area-inset-top,44px) + 12px);left:16px;z-index:9999;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.7);border:1px solid rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#000;}
.back-garden svg{width:19px;height:19px;stroke:#000;fill:none;stroke-width:2;}

/* 搜索框 */
.search-bar{
  padding:0 12px 8px;background:#ededed;flex-shrink:0;
}
.search-box{
  background:#fff;border-radius:6px;height:36px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  color:#9b9b9b;font-size:15px;
}
.search-box svg{width:16px;height:16px;stroke:#9b9b9b;fill:none;stroke-width:2;}

/* 加载中 */
.loading-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:60%;color:#9b9b9b;font-size:14px;gap:14px;
}
.loading-dot{
  width:8px;height:8px;border-radius:50%;background:#07c160;
  animation:loadPulse 1.2s ease-in-out infinite;
}
.loading-dots{display:flex;gap:6px;}
.loading-dots .loading-dot:nth-child(2){animation-delay:0.2s;}
.loading-dots .loading-dot:nth-child(3){animation-delay:0.4s;}
@keyframes loadPulse{0%,100%{opacity:0.3;transform:scale(0.8);}50%{opacity:1;transform:scale(1.1);}}

/* 聊天列表 */
.chat-list{
  flex:1;overflow-y:auto;background:#fff;
  -webkit-overflow-scrolling:touch;
}
.chat-item{
  display:flex;padding:12px 16px 12px 14px;
  align-items:center;gap:12px;
  border-bottom:0.5px solid #ededed;
  cursor:pointer;position:relative;
}
.chat-item:active{background:#e5e5e5;}

.chat-avatar{
  width:48px;height:48px;border-radius:6px;
  flex-shrink:0;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#fff;font-weight:500;
  overflow:hidden;
}
.chat-avatar img{width:100%;height:100%;object-fit:cover;}

/* 未读红点 */
.unread-dot{
  position:absolute;top:-4px;right:-4px;
  background:#fa5151;color:#fff;
  min-width:18px;height:18px;border-radius:9px;
  font-size:12px;display:flex;align-items:center;justify-content:center;
  padding:0 5px;border:2px solid #fff;
}

.chat-content{flex:1;min-width:0;}
.chat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.chat-name{font-size:17px;color:#000;font-weight:400;}
.chat-time{font-size:12px;color:#b2b2b2;flex-shrink:0;margin-left:8px;}
.chat-preview{
  font-size:14px;color:#9b9b9b;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 底部Tab */
.tab-bar{
  display:flex;background:#f7f7f7;
  border-top:0.5px solid #d5d5d5;
  padding-bottom:env(safe-area-inset-bottom, 20px);
  flex-shrink:0;
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:6px 0 4px;gap:2px;cursor:pointer;
}
.tab-item.disabled{opacity:1;}
.tab-icon{width:26px;height:26px;position:relative;}
.tab-icon svg{width:26px;height:26px;}
.tab-label{font-size:10px;color:#7f7f7f;}
.tab-item.active .tab-label{color:#07c160;}
.tab-badge{
  position:absolute;top:-3px;right:-6px;
  background:#fa5151;color:#fff;
  min-width:16px;height:16px;border-radius:8px;
  font-size:11px;display:flex;align-items:center;justify-content:center;
  padding:0 4px;border:1.5px solid #f7f7f7;
}
</style>
</head>
<body>

<div class="status-bar"></div>

<div class="back-garden" onclick="location.href='desktop.html'">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>

<!-- 微信标题栏 -->
<div class="wx-header">
  <div class="wx-title" id="wxTitleLongPress" style="-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;">微信</div>
  <div class="wx-header-icons">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

</div>

<!-- 搜索 -->
<div class="search-bar">

    搜索

<div class="chat-list" id="chatList"></div>

<!-- 底部Tab -->
<div class="tab-bar">
  <div class="tab-item active">
    <div class="tab-icon">
      <svg viewBox="0 0 26 26" fill="#07c160"><path d="M13 2C6.9 2 2 6.5 2 12c0 3.1 1.6 5.9 4.1 7.7L5 23l3.8-2c1.3.4 2.7.6 4.2.6 6.1 0 11-4.5 11-10S19.1 2 13 2z"/></svg>

    </div>
    <div class="tab-label">我</div>

<script>
const AVATAR_COLORS = ['#8b6f47','#2a5a8a','#3a3a3a','#1a3a6a','#7a2a2a','#2a2a2a','#4a5a7a','#5a7a3a','#6a3a6a'];

// 没有剧本数据时的兜底：空数组，不再预设联系人
const FALLBACK_CONTACTS = [];

const chatList = document.getElementById('chatList');
let contacts = [];

function showLoading(text){
  chatList.innerHTML = `<div class="loading-state"><div class="loading-dots"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div><div>${text}</div></div>`;
}

function renderList() {
  chatList.innerHTML = '';
  if(contacts.length === 0){
    chatList.innerHTML = `<div style="text-align:center;padding:80px 30px;color:#999;">
      <div style="font-size:15px;margin-bottom:8px;">这里还没有人</div>
      <div style="font-size:13px;color:#bbb;line-height:1.7;">写下你的人生剧本，这个世界才会开始有人与你联系</div>
    </div>`;
    document.getElementById('tabBadge').style.display = 'none';
    return;
  }
  contacts.forEach(c => {
    const item = document.createElement('div');
    item.className = 'chat-item';
    const avatarInner = c.avatarImg
      ? `<img src="${c.avatarImg}" style="width:100%;height:100%;object-fit:cover;">`
      : (c.avatar || (c.name ? c.name[0] : '?'));
    item.innerHTML = `
      <div class="chat-avatar" style="background:${c.color};">
        ${avatarInner}
        ${c.unread > 0 ? `<div class="unread-dot">${c.unread}</div>` : ''}
      </div>
      <div class="chat-content">
        <div class="chat-top">
          <span class="chat-name">${c.name}</span>
          <span class="chat-time">${c.time}</span>
        </div>
        <div class="chat-preview">${c.preview}</div>
      </div>
    `;
    item.onclick = () => {
      window.location.href = 'wechat-sim.html?id=' + encodeURIComponent(c.id);
    };
    chatList.appendChild(item);
  });

  const totalUnread = contacts.reduce((sum, c) => sum + (c.unread||0), 0);
  document.getElementById('tabBadge').textContent = totalUnread;
  document.getElementById('tabBadge').style.display = totalUnread > 0 ? 'flex' : 'none';
}

// 把主角+场景信息拼成给AI的中文背景描述
function buildBackgroundText(script){
  const h = script.hero || {};
  let text = `主角：${h.name||'（未命名）'}，${h.gender==='female'?'女':'男'}`;
  if(h.job) text += `，职业是${h.job}`;
  if(h.character) text += `。性格：${h.character}`;
  if(h.values) text += `。价值观：${h.values}`;
  if(h.desire) text += `。内心最深的渴望：${h.desire}`;
  text += '\n\n';
  (script.scenes||[]).forEach(s=>{
    text += `【场景：${s.name}】\n`;
    if(s.plot) text += `剧情：${s.plot}\n`;
    if(s.highlight) text += `重点戏份：${s.highlight}\n`;
    text += '\n';
  });
  return text;
}

// 收集所有场景里用户手动创建的人物
function collectAllPersons(script){
  const list = [];
  (script.scenes||[]).forEach(s=>{
    (s.persons||[]).forEach(p=>{
      list.push({ ...p, sceneName: s.name });
    });
  });
  return list;
}

async function callAI(systemPrompt, userPrompt){
  const res = await fetch('https://api.freedreleasing.com/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'deepseek-chat',
      max_tokens: 1200,
      messages: [
        { role:'system', content: systemPrompt },
        { role:'user', content: userPrompt },
      ],
    }),
  });
  const data = await res.json();
  return data.choices?.[0]?.message?.content?.trim() || '';
}

// 情形A：用户已在场景里创建了具体人物 —— 直接用这些人物做联系人，AI只生成开场预览消息
async function generateFromPersons(script, persons){
  showLoading('正在为你连接这个世界的人们…');
  const bg = buildBackgroundText(script);
  const personList = persons.map((p,i)=>{
    let line = `${i+1}. ${p.name}（${p.role||'关系待定'}），性格：${p.character||'未设定'}`;
    if(p.background) line += `，背景：${p.background}`;
    if(p.values) line += `，价值观：${p.values}`;
    line += `，对主角的态度：${p.attitude||'友善'}`;
    return line;
  }).join('\n');

  const now1 = new Date(); const timeCtx1 = `当前时间：${now1.getFullYear()}年${now1.getMonth()+1}月${now1.getDate()}日 ${['周日','周一','周二','周三','周四','周五','周六'][now1.getDay()]} ${String(now1.getHours()).padStart(2,'0')}:${String(now1.getMinutes()).padStart(2,'0')}。`;
  const sysPrompt = '你是一个「已实现人生」场景生成器。'+timeCtx1+'你要根据用户的人生剧本设定，为其中的每一个人物生成一条TA会在微信上发给主角的开场消息预览（不超过30字，口语化、符合人物身份和对主角的态度）。如果用户提供的信息比较简略（比如只写了职业、国籍、身份等只言片语），你要主动运用你自己对这个职业、身份、文化背景的通用了解，去合理丰富、补充具体细节，让内容显得真实、专业、有血有肉——不要因为用户写得简短，就让生成的内容也显得单薄、空洞、泛泛而谈。人物设定与语气准则（本应用用户绝大多数是女性，以下准则务必严格执行）：人物对主角的态度一律平等、尊重、欣赏，不出现俯视、说教、指点的语气；主角应被呈现为有主见、有能力、被认可的一方，不是被动等待安排或需要被"带领"的一方；人物姓名和称呼要现代、自然，像用户身边真实认识的同龄人或专业人士——绝对不用"张叔""老王""老刘""老李""王姐""小妹""美女""小姑娘"这类国产老式电视剧、市井气或辈分感很重的称呼方式，这类称呼一律禁止使用；不出现"你终于懂事了""女孩子就该……"等说教式、评判式语句；专业/权威角色（顾问、银行家、投资人、医生、导师等）不默认为男性，应平等地也生成女性专业角色，赋予同等的专业感和话语权；感情类场景中，对方角色应表现为欣赏、支持主角本来的样子，而非试图改变、纠正或"提升"她；不出现任何将女性物化、矮化或预设需要被保护/管教的措辞；语气整体优雅真诚，避免油腻讨好式的调侃语气。';
  const userPrompt = `${bg}\n人物列表：\n${personList}\n\n请按顺序为以上每个人物生成一条微信消息预览，严格按照如下格式输出，不要有其他内容：\n1::消息内容\n2::消息内容\n（依此类推，共${persons.length}条）`;

  let previews = {};
  try{
    const reply = await callAI(sysPrompt, userPrompt);
    reply.split('\n').forEach(line=>{
      const m = line.match(/^(\d+)::(.+)$/);
      if(m) previews[parseInt(m[1])] = m[2].trim();
    });
  }catch(e){ console.error(e); }

  const times = ['刚刚','刚刚','10:2'+Math.floor(Math.random()*9),'昨天','昨天','周一'];
  contacts = persons.map((p,i)=>({
    id: 'p'+i,
    name: p.name,
    avatar: p.name[0],
    avatarImg: p.avatar || null,
    color: AVATAR_COLORS[i % AVATAR_COLORS.length],
    preview: previews[i+1] || `Hi，${p.name}想和你聊聊…`,
    firstMessage: previews[i+1] || `Hi，${p.name}想和你聊聊…`,
    time: times[i % times.length],
    unread: i < 3 ? (Math.floor(Math.random()*2)+1) : 0,
    role: p.role, character: p.character, values: p.values, background: p.background, attitude: p.attitude, sceneName: p.sceneName,
  }));
}

// 情形B：场景里没有具体人物，只有剧情文字 —— 让AI直接发明一批联系人
async function generateInventedContacts(script){
  showLoading('正在为你编织这个世界…');
  const bg = buildBackgroundText(script);
  const now2 = new Date(); const timeCtx2 = `当前时间：${now2.getFullYear()}年${now2.getMonth()+1}月${now2.getDate()}日 ${['周日','周一','周二','周三','周四','周五','周六'][now2.getDay()]} ${String(now2.getHours()).padStart(2,'0')}:${String(now2.getMinutes()).padStart(2,'0')}。`;
  const sysPrompt = '你是一个「已实现人生」场景生成器。'+timeCtx2+'仔细阅读用户写下的每一个场景（可能是事业、学术、健康、创作、心灵成长、人际关系、财富等任何主题），虚构4-6个会在微信上联系主角的人物。人物类型必须由场景内容本身决定，不要预设任何特定主题（不要默认往财富或奢侈品方向靠）——可以是导师、合作者、学生、病人、粉丝、朋友等任何符合场景的角色。如果用户提供的信息比较简略（比如只写了职业、国籍、身份等只言片语），你要主动运用你自己对这个职业、身份、文化背景的通用了解，去合理丰富、补充具体细节，让内容显得真实、专业、有血有肉——不要因为用户写得简短，就让生成的内容也显得单薄、空洞、泛泛而谈。人物设定与语气准则（本应用用户绝大多数是女性，以下准则务必严格执行）：人物对主角的态度一律平等、尊重、欣赏，不出现俯视、说教、指点的语气；主角应被呈现为有主见、有能力、被认可的一方，不是被动等待安排或需要被"带领"的一方；人物姓名和称呼要现代、自然，像用户身边真实认识的同龄人或专业人士——绝对不用"张叔""老王""老刘""老李""王姐""小妹""美女""小姑娘"这类国产老式电视剧、市井气或辈分感很重的称呼方式，这类称呼一律禁止使用；不出现"你终于懂事了""女孩子就该……"等说教式、评判式语句；专业/权威角色（顾问、银行家、投资人、医生、导师等）不默认为男性，应平等地也生成女性专业角色，赋予同等的专业感和话语权；感情类场景中，对方角色应表现为欣赏、支持主角本来的样子，而非试图改变、纠正或"提升"她；不出现任何将女性物化、矮化或预设需要被保护/管教的措辞；语气整体优雅真诚，避免油腻讨好式的调侃语气。';
  const userPrompt = `${bg}\n请虚构4-6个联系人，每人一条微信消息预览（不超过30字）。严格按照如下格式输出，不要有其他内容：\n姓名::身份角色::消息预览`;

  let list = [];
  try{
    const reply = await callAI(sysPrompt, userPrompt);
    reply.split('\n').forEach(line=>{
      const parts = line.split('::');
      if(parts.length>=3) list.push({ name:parts[0].trim(), role:parts[1].trim(), preview:parts[2].trim() });
    });
  }catch(e){ console.error(e); }

  if(list.length===0){ contacts = FALLBACK_CONTACTS; return; }

  const times = ['刚刚','刚刚','10:2'+Math.floor(Math.random()*9),'昨天','昨天','周一'];
  contacts = list.map((p,i)=>({
    id:'inv'+i, name:p.name, avatar:p.name[0], color:AVATAR_COLORS[i%AVATAR_COLORS.length],
    preview:p.preview, firstMessage:p.preview, time:times[i%times.length], unread: i<3 ? (Math.floor(Math.random()*2)+1) : 0,
    role:p.role, character:'', values:'', background:p.role, attitude:'友善、主动联系用户',
  }));
}

async function init(){
  let script = null;
  try{ script = JSON.parse(localStorage.getItem('lifeScript')||'null'); }catch(e){}

  // 缓存：同一份剧本不用每次都重新调用AI
  const cacheKey = 'wechatContactsCache';
  const cached = localStorage.getItem(cacheKey);
  const scriptRaw = localStorage.getItem('lifeScript') || '';

  if(cached){
    try{
      const c = JSON.parse(cached);
      if(c.scriptRaw === scriptRaw){
        contacts = c.contacts;
        renderList();
        return;
      }
    }catch(e){}
  }

  if(!script || !script.hero || !script.hero.name){
    contacts = FALLBACK_CONTACTS;
    renderList();
    return;
  }

  const persons = collectAllPersons(script);
  if(persons.length > 0){
    await generateFromPersons(script, persons);
  } else {
    await generateInventedContacts(script);
  }

  localStorage.setItem(cacheKey, JSON.stringify({ scriptRaw, contacts }));
  renderList();
}

// 长按标题"微信"两个字，可以强制重新生成联系人（清掉旧缓存，比如之前生成的不满意的称呼）
(function(){
  const el = document.getElementById('wxTitleLongPress');
  let timer = null;
  const start = () => { timer = setTimeout(() => {
    if(confirm('重新生成这个世界里的联系人？\n（之前的聊天记录会被清空，重新根据剧本生成新的联系人）')){
      localStorage.removeItem('wechatContactsCache');
      // 一并清掉每个联系人保存的聊天记录，避免新联系人顶着旧对话
      Object.keys(localStorage).filter(k=>k.startsWith('wechatHistory_')).forEach(k=>localStorage.removeItem(k));
      location.reload();
    }
  }, 650); };
  const cancel = () => { if(timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
})();

init();
</script>
</body>
</html>
