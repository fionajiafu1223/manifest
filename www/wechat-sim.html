<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>微信</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  background:#ededed;
  height:100dvh;
  display:flex;flex-direction:column;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
}

/* 顶部导航栏 */
.nav{
  background:#ededed;
  padding-top:env(safe-area-inset-top, 44px);
  border-bottom:0.5px solid #d5d5d5;
  flex-shrink:0;
}
.nav-inner{
  height:44px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;
}
.nav-back{
  display:flex;align-items:center;
  color:#000;font-size:17px;
  min-width:80px;
}
.nav-back svg{width:12px;height:22px;margin-right:4px;}
.unread-badge{
  background:#d8d8d8;
  color:#333;
  font-size:14px;
  border-radius:12px;
  padding:2px 9px;
  font-weight:400;
}
.nav-title{
  font-size:17px;font-weight:500;color:#000;
  position:absolute;left:50%;transform:translateX(-50%);
}
.nav-more{
  min-width:80px;display:flex;justify-content:flex-end;
  padding-right:8px;
}
.nav-more svg{width:24px;height:24px;}

/* 聊天区域 */
.chat-area{
  flex:1;
  overflow-y:auto;
  padding:10px 12px;
  -webkit-overflow-scrolling:touch;
}

.time-stamp{
  text-align:center;
  font-size:12px;
  color:#b2b2b2;
  margin:12px 0 16px;
}

.msg-row{
  display:flex;
  margin-bottom:16px;
  align-items:flex-start;
}
.msg-row.mine{flex-direction:row-reverse;}

.avatar{
  width:42px;height:42px;
  border-radius:5px;
  flex-shrink:0;
  background:linear-gradient(160deg,#8aa8c8,#5a7898);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:17px;font-weight:400;
  overflow:hidden;
}
.avatar.mine-avatar{
  background:linear-gradient(135deg,#b98ccf,#9a6cb0);
}

.bubble-wrap{
  max-width:65%;
  margin:0 8px;
}

.bubble{
  background:#fff;
  border-radius:6px;
  padding:10px 12px;
  font-size:16px;
  line-height:1.5;
  color:#181818;
  position:relative;
  word-break:break-word;
}
/* 左侧气泡小三角 */
.msg-row:not(.mine) .bubble::before{
  content:'';
  position:absolute;
  left:-5px;top:14px;
  width:0;height:0;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-right:5px solid #fff;
}
/* 右侧绿色气泡 */
.msg-row.mine .bubble{
  background:#95ec69;
}
.msg-row.mine .bubble::before{
  content:'';
  position:absolute;
  right:-5px;top:14px;
  width:0;height:0;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-left:5px solid #95ec69;
}

/* 输入区 */
.input-bar{
  background:#f7f7f7;
  border-top:0.5px solid #d5d5d5;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom, 20px));
  display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.voice-btn,.emoji-btn,.plus-btn{
  width:30px;height:30px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.voice-btn svg,.emoji-btn svg,.plus-btn svg{
  width:28px;height:28px;
  stroke:#181818;
}
.input-wrap{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
}
.text-input{
  width:100%;
  background:#fff;
  border:none;
  border-radius:6px;
  height:38px;
  padding:0 36px 0 12px;
  font-size:16px;
  outline:none;
  font-family:inherit;
}
.input-mic{
  position:absolute;
  right:8px;
  width:22px;height:22px;
}
.send-btn{
  background:#07c160;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:7px 14px;
  font-size:15px;
  display:none;
}
.send-btn.visible{display:block;}

/* 打字中动画 */
.typing .bubble{
  padding:14px 16px;
}
.typing-dots{
  display:flex;gap:4px;
}
.typing-dots span{
  width:7px;height:7px;
  background:#c0c0c0;
  border-radius:50%;
  animation:typing 1.2s infinite;
}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-4px);opacity:1;}}
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="nav">
  <div class="nav-inner">
    <div class="nav-back" onclick="location.href='wechat-list.html'" style="cursor:pointer;">
      <span class="unread-badge" id="unreadBadge">5</span>
    </div>
    <div class="nav-title" id="contactName">阿哲</div>
    <div class="nav-more" id="navMoreBtn" style="cursor:pointer;">
      <svg viewBox="0 0 24 24" fill="#000">
        <circle cx="5" cy="12" r="2"/>
        <circle cx="12" cy="12" r="2"/>
        <circle cx="19" cy="12" r="2"/>
      </svg>
    </div>
  </div>
</div>

<!-- 聊天区 -->
<div class="chat-area" id="chatArea">
  <div class="time-stamp">下午 10:17</div>
</div>

<!-- 输入栏 -->
<div class="input-bar">
  <div class="voice-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
      <circle cx="12" cy="12" r="10" stroke="#181818"/>
      <path d="M9.5 9.5v5M12 8v8M14.5 10v4" stroke="#181818" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="input-wrap">
    <input type="text" class="text-input" id="msgInput" placeholder="">
    <svg class="input-mic" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="1.5">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11c0 3.87 3.13 7 7 7s7-3.13 7-7M12 18v3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="emoji-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
      <circle cx="12" cy="12" r="10" stroke="#181818"/>
      <circle cx="8.5" cy="10" r="1" fill="#181818"/>
      <circle cx="15.5" cy="10" r="1" fill="#181818"/>
      <path d="M8 14.5c1 1.2 2.4 2 4 2s3-0.8 4-2" stroke="#181818" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="plus-btn" id="plusBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
      <circle cx="12" cy="12" r="10" stroke="#181818"/>
      <path d="M12 8v8M8 12h8" stroke="#181818" stroke-linecap="round"/>
    </svg>
  </div>
  <button class="send-btn" id="sendBtn">发送</button>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const plusBtn = document.getElementById('plusBtn');

// 从URL读取联系人id —— 现在是Supabase characters表里的真实UUID
const urlParams = new URLSearchParams(window.location.search);
const characterId = urlParams.get('id') || '';

let contactName = '';
let contactInfo = { avatarImg: null, role: '', character: '', background: '', attitude: '' };
let heroName = '';
let heroAvatar = '';
let sendInFlight = false;

// ---- 头像生成：与wechat-list.html保持一致的逻辑（同一角色在列表和聊天页头像一致） ----
function hashStr(s){
  let h = 0;
  for(let i=0; i<s.length; i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function pickAvatarType(name, roleText, characterText){
  const text = (roleText||'') + (characterText||'');
  if(/艺术|设计|插画|音乐|诗|作家|摄影师|策展/.test(text)) return 'abstract';
  if(/自然|户外|旅行|登山|徒步|田园|海边|骑行|露营/.test(text)) return 'landscape';
  if(/学生|年轻|活泼|网红|游戏|二次元|博主/.test(text)) return 'cartoon';
  const types = ['portrait','portrait','cartoon','landscape','abstract'];
  return types[hashStr(name) % types.length];
}
function avatarUrlFor(type, seed){
  const h = hashStr(seed);
  switch(type){
    case 'portrait': {
      const gender = h % 2 === 0 ? 'women' : 'men';
      const idx = (h % 80) + 1;
      return `https://randomuser.me/api/portraits/${gender}/${idx}.jpg`;
    }
    case 'landscape': {
      const ids = [1018,1015,1043,1036,1039,1050,1044,1024];
      const id = ids[h % ids.length];
      return `https://picsum.photos/id/${id}/200/200`;
    }
    case 'cartoon':
      return `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(seed)}`;
    case 'abstract':
      return `https://api.dicebear.com/7.x/shapes/svg?seed=${encodeURIComponent(seed)}`;
  }
}
function autoAvatarImg(name, roleText, characterText){
  const type = pickAvatarType(name, roleText, characterText);
  return avatarUrlFor(type, name);
}

// 已读状态：进来就把这个联系人标记为已读（数据库没有已读字段，纯本地UI状态）
function markRead(){
  if(!characterId) return;
  try{
    const state = JSON.parse(localStorage.getItem('wechatReadState')||'{}');
    state[characterId] = new Date().toISOString();
    localStorage.setItem('wechatReadState', JSON.stringify(state));
  }catch(e){}
}

function addMessage(text, mine = false) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (mine ? ' mine' : '');

  const avatar = document.createElement('div');
  avatar.className = 'avatar' + (mine ? ' mine-avatar' : '');
  if(mine && heroAvatar){
    avatar.innerHTML = `<img src="${heroAvatar}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
  } else if(!mine && contactInfo.avatarImg){
    avatar.innerHTML = `<img src="${contactInfo.avatarImg}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
  } else {
    avatar.textContent = mine ? '我' : (contactName[0]||'?');
  }

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);

  row.appendChild(avatar);
  row.appendChild(wrap);
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row typing';
  row.id = 'typingRow';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  if(contactInfo.avatarImg){
    avatar.innerHTML = `<img src="${contactInfo.avatarImg}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
  } else {
    avatar.textContent = contactName[0]||'?';
  }
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  wrap.appendChild(bubble);
  row.appendChild(avatar);
  row.appendChild(wrap);
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typingRow');
  if (t) t.remove();
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// 根据文字长度估算像真人一样的打字时长
function estimateTypingMs(text){
  const len = (text||'').length;
  const perChar = 90 + Math.random()*50;
  const base = len * perChar;
  return Math.min(4200, Math.max(700, base));
}

function readDelay(){
  return 500 + Math.random()*1300;
}

msgInput.addEventListener('input', () => {
  if (msgInput.value.trim()) {
    sendBtn.classList.add('visible');
    plusBtn.style.display = 'none';
  } else {
    sendBtn.classList.remove('visible');
    plusBtn.style.display = 'flex';
  }
});

// 发送一条消息：调用 chat-character Edge Function，AI的回复由后端生成并写入数据库
async function sendAndGetReply(text){
  if(sendInFlight) return;
  sendInFlight = true;
  await sleep(readDelay());
  showTyping();
  const typingStart = Date.now();
  try{
    const { sendMessage } = await import('./js/services/chatService.js');
    const result = await sendMessage(characterId, null, text);
    if(!result.success){
      hideTyping();
      const msg = (result.error && (result.error.message || (result.error.detail && result.error.detail.error))) || '未知错误';
      addMessage('（消息发送失败：' + msg + '）');
      sendInFlight = false;
      return;
    }
    const reply = (result.data && result.data.reply) || '……';
    let remaining = estimateTypingMs(reply) - (Date.now() - typingStart);
    if(remaining > 1800 && Math.random() < 0.5){
      const pause = remaining * 0.4;
      await sleep(pause);
      hideTyping();
      await sleep(300 + Math.random()*450);
      showTyping();
      remaining -= pause;
    }
    if(remaining > 0) await sleep(remaining);
    hideTyping();
    addMessage(reply);
  }catch(err){
    hideTyping();
    addMessage('……（网络好像有点问题）');
  }
  sendInFlight = false;
}

sendBtn.addEventListener('click', () => {
  const text = msgInput.value.trim();
  if (!text || sendInFlight) return;
  addMessage(text, true);
  msgInput.value = '';
  sendBtn.classList.remove('visible');
  plusBtn.style.display = 'flex';
  sendAndGetReply(text);
});

msgInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});

// 右上角"更多"按钮：删除聊天记录功能暂未接入数据库层，先提示，不做假动作
document.getElementById('navMoreBtn').addEventListener('click', () => {
  alert('删除聊天记录功能还没接入，暂时无法在这里删除。');
});

// ============================================================
// 初始化：从Supabase读取联系人信息 + 历史消息
// ============================================================
async function init(){
  if(!characterId){
    contactName = '未知联系人';
    document.getElementById('contactName').textContent = contactName;
    return;
  }

  const { requireUser } = await import('./js/services/authService.js');
  const { supabase } = await import('./js/supabaseClient.js');

  const user = await requireUser();
  if(!user) return;

  const [{ data: character, error: charError }, { data: mainCharacter }] = await Promise.all([
    supabase.from('characters')
      .select('id, name, display_name, personality, job_title, organization_name, background_story, initial_relationship, avatar_url')
      .eq('id', characterId)
      .eq('user_id', user.id)
      .maybeSingle(),
    supabase.from('main_characters').select('name').eq('user_id', user.id).maybeSingle(),
  ]);

  if(charError || !character){
    contactName = '联系人不存在';
    document.getElementById('contactName').textContent = contactName;
    chatArea.innerHTML = '<div class="time-stamp">这个联系人不存在，或者不属于你</div>';
    return;
  }

  heroName = (mainCharacter && mainCharacter.name) || '';
  contactName = character.display_name || character.name || '未知联系人';
  contactInfo = {
    avatarImg: character.avatar_url || autoAvatarImg(contactName, character.job_title||'', character.personality||''),
    role: character.job_title || character.initial_relationship || '朋友',
    character: character.personality || '友善自然',
    background: character.background_story || '',
    values: '',
    attitude: character.initial_relationship || '友善、主动',
  };
  document.getElementById('contactName').textContent = contactName;
  markRead();

  const { data: msgs, error: msgError } = await supabase
    .from('messages')
    .select('id, content, direction, sent_at')
    .eq('user_id', user.id)
    .eq('character_id', characterId)
    .eq('channel', 'wechat')
    .order('sent_at', { ascending: true });

  if(msgError){
    console.error(msgError);
    chatArea.innerHTML = '<div class="time-stamp">加载聊天记录失败</div>';
    return;
  }

  chatArea.innerHTML = '';
  (msgs||[]).forEach(m => {
    addMessage(m.content, m.direction === 'outgoing');
  });

  if(!msgs || msgs.length === 0){
    chatArea.innerHTML = '<div class="time-stamp">还没有消息</div>';
  }
}

init();
</script>
</body>
</html>
