<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>微信</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  background:#ededed;
  height:100dvh;
  display:flex;flex-direction:column;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
}

/* 顶部导航栏 */
.nav{
  background:#ededed;
  padding-top:env(safe-area-inset-top, 44px);
  border-bottom:0.5px solid #d5d5d5;
  flex-shrink:0;
}
.nav-inner{
  height:44px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;
}
.nav-back{
  display:flex;align-items:center;
  color:#000;font-size:17px;
  min-width:80px;
}
.nav-back svg{width:12px;height:22px;margin-right:4px;}
.unread-badge{
  background:#d8d8d8;
  color:#333;
  font-size:14px;
  border-radius:12px;
  padding:2px 9px;
  font-weight:400;
}
.nav-title{
  font-size:17px;font-weight:500;color:#000;
  position:absolute;left:50%;transform:translateX(-50%);
}
.nav-more{
  min-width:80px;display:flex;justify-content:flex-end;
  padding-right:8px;
}
.nav-more svg{width:24px;height:24px;}

/* 聊天区域 */
.chat-area{
  flex:1;
  overflow-y:auto;
  padding:10px 12px;
  -webkit-overflow-scrolling:touch;
}

.time-stamp{
  text-align:center;
  font-size:12px;
  color:#b2b2b2;
  margin:12px 0 16px;
}

.msg-row{
  display:flex;
  margin-bottom:16px;
  align-items:flex-start;
}
.msg-row.mine{flex-direction:row-reverse;}

.avatar{
  width:42px;height:42px;
  border-radius:5px;
  flex-shrink:0;
  background:linear-gradient(160deg,#8aa8c8,#5a7898);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:17px;font-weight:400;
  overflow:hidden;
}
.avatar.mine-avatar{
  background:linear-gradient(135deg,#b98ccf,#9a6cb0);
}

.bubble-wrap{
  max-width:65%;
  margin:0 8px;
}

.bubble{
  background:#fff;
  border-radius:6px;
  padding:10px 12px;
  font-size:16px;
  line-height:1.5;
  color:#181818;
  position:relative;
  word-break:break-word;
}
/* 左侧气泡小三角 */
.msg-row:not(.mine) .bubble::before{
  content:'';
  position:absolute;
  left:-5px;top:14px;
  width:0;height:0;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-right:5px solid #fff;
}
/* 右侧绿色气泡 */
.msg-row.mine .bubble{
  background:#95ec69;
}
.msg-row.mine .bubble::before{
  content:'';
  position:absolute;
  right:-5px;top:14px;
  width:0;height:0;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-left:5px solid #95ec69;
}

/* 输入区 */
.input-bar{
  background:#f7f7f7;
  border-top:0.5px solid #d5d5d5;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom, 20px));
  display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.voice-btn,.emoji-btn,.plus-btn{
  width:30px;height:30px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.voice-btn svg,.emoji-btn svg,.plus-btn svg{
  width:28px;height:28px;
  stroke:#181818;
}
.input-wrap{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
}
.text-input{
  width:100%;
  background:#fff;
  border:none;
  border-radius:6px;
  height:38px;
  padding:0 36px 0 12px;
  font-size:16px;
  outline:none;
  font-family:inherit;
}
.input-mic{
  position:absolute;
  right:8px;
  width:22px;height:22px;
}
.send-btn{
  background:#07c160;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:7px 14px;
  font-size:15px;
  display:none;
}
.send-btn.visible{display:block;}

/* 打字中动画 */
.typing .bubble{
  padding:14px 16px;
}
.typing-dots{
  display:flex;gap:4px;
}
.typing-dots span{
  width:7px;height:7px;
  background:#c0c0c0;
  border-radius:50%;
  animation:typing 1.2s infinite;
}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-4px);opacity:1;}}
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="nav">
  <div class="nav-inner">
    <div class="nav-back" onclick="location.href='wechat-list.html'" style="cursor:pointer;">
      <svg viewBox="0 0 12 22" fill="none">
        <path d="M10.5 1L1.5 11L10.5 21" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="unread-badge" id="unreadBadge">5</span>
    </div>
    <div class="nav-title" id="contactName">阿哲</div>
    <div class="nav-more">
      <svg viewBox="0 0 24 24" fill="#000">
        <circle cx="5" cy="12" r="2"/>
        <circle cx="12" cy="12" r="2"/>
        <circle cx="19" cy="12" r="2"/>
      </svg>
    </div>
  </div>
</div>

<!-- 聊天区 -->
<div class="chat-area" id="chatArea">
  <div class="time-stamp">下午 10:17</div>
</div>

<!-- 输入栏 -->
<div class="input-bar">
  <div class="voice-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
      <circle cx="12" cy="12" r="10" stroke="#181818"/>
      <path d="M9.5 9.5v5M12 8v8M14.5 10v4" stroke="#181818" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="input-wrap">
    <input type="text" class="text-input" id="msgInput" placeholder="">
    <svg class="input-mic" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="1.5">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11c0 3.87 3.13 7 7 7s7-3.13 7-7M12 18v3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="emoji-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
      <circle cx="12" cy="12" r="10" stroke="#181818"/>
      <circle cx="8.5" cy="10" r="1" fill="#181818"/>
      <circle cx="15.5" cy="10" r="1" fill="#181818"/>
      <path d="M8 14.5c1 1.2 2.4 2 4 2s3-0.8 4-2" stroke="#181818" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="plus-btn" id="plusBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
      <circle cx="12" cy="12" r="10" stroke="#181818"/>
      <path d="M12 8v8M8 12h8" stroke="#181818" stroke-linecap="round"/>
    </svg>
  </div>
  <button class="send-btn" id="sendBtn">发送</button>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const plusBtn = document.getElementById('plusBtn');

// 从URL读取联系人id，从localStorage缓存中找到对应联系人档案
const urlParams = new URLSearchParams(window.location.search);
const contactId = urlParams.get('id') || '';

let contactName = '阿哲';
let contactInfo = null;
let heroName = '';
let heroAvatar = '';

try{
  const cache = JSON.parse(localStorage.getItem('wechatContactsCache')||'null');
  if(cache && cache.contacts){
    contactInfo = cache.contacts.find(c=>c.id===contactId);
  }
}catch(e){}

try{
  const script = JSON.parse(localStorage.getItem('lifeScript')||'null');
  if(script && script.hero) { heroName = script.hero.name || ''; heroAvatar = script.hero.avatar || ''; }
}catch(e){}

if(contactInfo){
  contactName = contactInfo.name;
} else {
  // 兜底人设：没有联系人档案时，用原本的"男友求和好"剧本
  contactInfo = { role:'男朋友', character:'深爱用户，充满悔意', background:'和用户最近吵架分开', attitude:'真诚、卑微、恳切，主动求和好，充满悔意和思念' };
}
document.getElementById('contactName').textContent = contactName;

// 这次进来时，这个联系人本来是否有未读消息（用于决定是"直接看到等待中的消息"还是"AI现场开口"）
const hadUnreadOnEntry = !!(contactInfo.unread > 0 && contactInfo.firstMessage);

// 进来就算已读：把这个联系人的未读数清零，写回缓存
if(contactId){
  try{
    const cache = JSON.parse(localStorage.getItem('wechatContactsCache')||'null');
    if(cache && cache.contacts){
      const idx = cache.contacts.findIndex(c=>c.id===contactId);
      if(idx>=0 && cache.contacts[idx].unread>0){
        cache.contacts[idx].unread = 0;
        localStorage.setItem('wechatContactsCache', JSON.stringify(cache));
      }
    }
  }catch(e){}
}

// ── 对话记录持久化：每个联系人的聊天记录都存在本地，重新打开时原样还在，不会消失/重生 ──
const historyKey = 'wechatHistory_' + (contactId || 'default');
function loadHistory(){
  try{
    const raw = localStorage.getItem(historyKey);
    if(raw){ const arr = JSON.parse(raw); if(Array.isArray(arr)) return arr; }
  }catch(e){}
  return null;
}
function saveHistory(){
  try{ localStorage.setItem(historyKey, JSON.stringify(conversationHistory)); }catch(e){}
}

function addMessage(text, mine = false, persist = true) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (mine ? ' mine' : '');
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar' + (mine ? ' mine-avatar' : '');
  if(mine && heroAvatar){
    avatar.innerHTML = `<img src="${heroAvatar}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
  } else if(!mine && contactInfo.avatarImg){
    avatar.innerHTML = `<img src="${contactInfo.avatarImg}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
  } else {
    avatar.textContent = mine ? '我' : contactName[0];
  }
  
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  
  row.appendChild(avatar);
  row.appendChild(wrap);
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;

  if(persist){
    conversationHistory.push({ role: mine ? 'user' : 'assistant', content: text });
    saveHistory();
  }
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row typing';
  row.id = 'typingRow';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  if(contactInfo.avatarImg){
    avatar.innerHTML = `<img src="${contactInfo.avatarImg}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
  } else {
    avatar.textContent = contactName[0];
  }
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  wrap.appendChild(bubble);
  row.appendChild(avatar);
  row.appendChild(wrap);
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typingRow');
  if (t) t.remove();
}

// ── 拟真打字节奏 ──
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// 根据文字长度估算像真人一样的打字时长（不是网络请求要多久就显示多久）
function estimateTypingMs(text){
  const len = (text||'').length;
  const perChar = 90 + Math.random()*50; // 每字约90-140ms，模拟手机打字速度
  const base = len * perChar;
  return Math.min(4200, Math.max(700, base));
}

// 看到消息后，不会立刻开始打字：模拟"看到→愣一下/思考"的停顿
function readDelay(){
  return 500 + Math.random()*1300;
}

// 用户输入
msgInput.addEventListener('input', () => {
  if (msgInput.value.trim()) {
    sendBtn.classList.add('visible');
    plusBtn.style.display = 'none';
  } else {
    sendBtn.classList.remove('visible');
    plusBtn.style.display = 'flex';
  }
});

// 对话历史（用于AI记忆上下文）
let conversationHistory = [];

// 人设：根据联系人档案动态生成
const heroAddr = heroName ? `（用户名叫${heroName}）` : '';
const persona = `你正在扮演「${contactName}」，与用户（${heroAddr}）在微信上聊天。
你的身份/关系：${contactInfo.role||'朋友'}
你的性格：${contactInfo.character||'友善自然'}
背景：${contactInfo.background||''}
价值观：${contactInfo.values||''}
你对待用户的态度：${contactInfo.attitude||'友善、主动'}
请像真实的微信聊天一样回复，简短、口语化、符合你的身份、性格和背景（比如涉及到你的职业、国籍、生活方式的细节，要体现出真实感和专业性——如果背景信息比较简略，你要主动运用自己对这个职业/身份/文化的通用了解去合理补充细节，不要显得单薄空洞），一次只说一两句话，不要长篇大论。不要出现任何旁白、括号说明或AI自称，直接说话。`;

// 进入聊天：优先看这个联系人之前有没有留下的完整对话记录
// 有 —— 原样显示出来，不重新生成、不用打字动画，对方发过的消息不会凭空消失
// 没有 —— 才是真的第一次见面：有未读就直接显示等待中的消息；没有就走"AI主动开口"的开场动画
const savedHistory = loadHistory();
if(savedHistory && savedHistory.length > 0){
  conversationHistory = savedHistory;
  savedHistory.forEach(m => { addMessage(m.content, m.role === 'user', false); });
} else if(hadUnreadOnEntry){
  addMessage(contactInfo.firstMessage);
} else {
  setTimeout(playOpening, 700);
}

async function getAIReply() {
  await sleep(readDelay());
  showTyping();
  const typingStart = Date.now();
  try {
    const res = await fetch('https://api.freedreleasing.com/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'deepseek-chat',
        max_tokens: 500,
        messages: [
          { role: 'system', content: persona },
          ...conversationHistory,
        ],
      }),
    });
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content?.trim() || '……';

    // 让"正在输入"的显示时长贴合消息长度，而不是网络请求耗时
    let remaining = estimateTypingMs(reply) - (Date.now() - typingStart);

    // 较长的消息，中途停顿一下再继续（像真人打字打到一半又想了想）
    if(remaining > 1800 && Math.random() < 0.5){
      const pause = remaining * 0.4;
      await sleep(pause);
      hideTyping();
      await sleep(300 + Math.random()*450);
      showTyping();
      remaining -= pause;
    }
    if(remaining > 0) await sleep(remaining);

    hideTyping();
    addMessage(reply);
  } catch (err) {
    hideTyping();
    addMessage('……（网络好像有点问题）', false, false);
  }
}

// 开场：让AI主动生成1-3条开场消息（符合人设与处境）
async function playOpening() {
  await sleep(readDelay());
  showTyping();
  const typingStart = Date.now();
  try {
    const res = await fetch('https://api.freedreleasing.com/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'deepseek-chat',
        max_tokens: 300,
        messages: [
          { role: 'system', content: persona },
          { role: 'user', content: '（这是对话的开始，请你主动发起对话，符合你的身份和处境，发送1-3条简短的开场消息。每条消息独占一行，不要编号，不要有其他说明文字。）' },
        ],
      }),
    });
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content?.trim() || `${heroName||'你'}，最近好吗？`;
    let lines = reply.split('\n').map(l=>l.trim()).filter(l=>l);
    if(lines.length===0) lines = [`${heroName||'你'}，最近好吗？`];

    let i = 0;
    async function showNext(){
      const line = lines[i];
      let wait = estimateTypingMs(line);
      if(i===0){
        // 第一条：扣掉已经花在网络请求上的时间，避免叠加等待
        wait = Math.max(300, wait - (Date.now() - typingStart));
      }
      await sleep(wait);
      hideTyping();
      addMessage(line);
      i++;
      if(i<lines.length){
        await sleep(350 + Math.random()*450);
        showTyping();
        await showNext();
      }
    }
    await showNext();
  } catch(err) {
    hideTyping();
    addMessage('……（网络好像有点问题，下拉刷新试试）', false, false);
  }
}

sendBtn.addEventListener('click', () => {
  const text = msgInput.value.trim();
  if (!text) return;
  addMessage(text, true);
  msgInput.value = '';
  sendBtn.classList.remove('visible');
  plusBtn.style.display = 'flex';

  // AI回复（读消息的停顿+按内容长度打字的节奏，都在getAIReply里处理）
  getAIReply();
});

msgInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});
</script>
</body>
</html>
