<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>微信</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;
  background:#ededed;
  height:100dvh;
  display:flex;flex-direction:column;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
}

/* 顶部导航栏 */
.nav{
  background:#ededed;
  padding-top:env(safe-area-inset-top, 44px);
  border-bottom:0.5px solid #d5d5d5;
  flex-shrink:0;
}
.nav-inner{
  height:44px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;
}
.nav-back{
  display:flex;align-items:center;
  color:#000;font-size:17px;
  min-width:80px;min-height:44px;padding-left:12px;
}
.nav-back svg{width:12px;height:22px;margin-right:4px;}
.unread-badge{
  background:#d8d8d8;
  color:#333;
  font-size:14px;
  border-radius:12px;
  padding:2px 9px;
  font-weight:400;
}
.nav-title{
  font-size:17px;font-weight:500;color:#000;
  position:absolute;left:50%;transform:translateX(-50%);
}
.nav-more{
  min-width:80px;display:flex;justify-content:flex-end;
  padding-right:8px;
}
.nav-more svg{width:24px;height:24px;}

/* 聊天区域 */
.chat-area{
  flex:1;
  overflow-y:auto;
  padding:10px 12px;
  -webkit-overflow-scrolling:touch;
}

.time-stamp{
  text-align:center;
  font-size:12px;
  color:#b2b2b2;
  margin:12px 0 16px;
}

.msg-row{
  display:flex;
  margin-bottom:16px;
  align-items:flex-start;
}
.msg-row.mine{flex-direction:row-reverse;}

.avatar{
  width:42px;height:42px;
  border-radius:5px;
  flex-shrink:0;
  background:linear-gradient(160deg,#8aa8c8,#5a7898);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:17px;font-weight:400;
  overflow:hidden;
}
.avatar.mine-avatar{
  background:linear-gradient(135deg,#b98ccf,#9a6cb0);
}

.bubble-wrap{
  max-width:65%;
  margin:0 8px;
}

.bubble{
  background:#fff;
  border-radius:6px;
  padding:10px 12px;
  font-size:16px;
  line-height:1.5;
  color:#181818;
  position:relative;
  word-break:break-word;
}
/* 左侧气泡小三角 */
.msg-row:not(.mine) .bubble::before{
  content:'';
  position:absolute;
  left:-5px;top:14px;
  width:0;height:0;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-right:5px solid #fff;
}
/* 右侧绿色气泡 */
.msg-row.mine .bubble{
  background:#95ec69;
}
.msg-row.mine .bubble::before{
  content:'';
  position:absolute;
  right:-5px;top:14px;
  width:0;height:0;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-left:5px solid #95ec69;
}

/* 输入区 */
.input-bar{
  background:#f7f7f7;
  border-top:0.5px solid #d5d5d5;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom, 20px));
  display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.voice-btn,.emoji-btn,.plus-btn{
  width:30px;height:30px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.voice-btn svg,.emoji-btn svg,.plus-btn svg{
  width:28px;height:28px;
  stroke:#181818;
}
.input-wrap{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
}
.text-input{
  width:100%;
  background:#fff;
  border:none;
  border-radius:6px;
  height:38px;
  padding:0 36px 0 12px;
  font-size:16px;
  outline:none;
  font-family:inherit;
}
.input-mic{
  position:absolute;
  right:8px;
  width:22px;height:22px;
}
.send-btn{
  background:#07c160;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:7px 14px;
  font-size:15px;
  display:none;
}
.send-btn.visible{display:block;}

/* 打字中动画 */
.typing .bubble{
  padding:14px 16px;
}
.typing-dots{
  display:flex;gap:4px;
}
.typing-dots span{
  width:7px;height:7px;
  background:#c0c0c0;
  border-radius:50%;
  animation:typing 1.2s infinite;
}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-4px);opacity:1;}}
/* 语音消息 */
.voice-bubble{display:flex;align-items:center;gap:6px;min-width:80px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.voice-bubble svg{width:18px;height:18px;flex-shrink:0;}
.voice-bubble .vw2,.voice-bubble .vw3{transition:opacity .15s;}
.voice-bubble.playing .vw2{animation:vwave 1s infinite steps(1);}
.voice-bubble.playing .vw3{animation:vwave 1s infinite steps(1) .33s;}
.voice-bubble.loading{opacity:.6;}
@keyframes vwave{0%{opacity:0;}50%{opacity:1;}}
.voice-dur{font-size:15px;color:#181818;}
.voice-line{display:flex;align-items:center;}
.voice-dot{width:8px;height:8px;border-radius:50%;background:#fa5151;margin-left:8px;flex-shrink:0;}
.voice-to-text{font-size:12px;color:#576b95;margin-top:4px;cursor:pointer;}
.hold-btn{flex:1;height:40px;border-radius:6px;background:#fff;display:none;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#181818;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;}
.hold-btn.pressing{background:#c9c9c9;}
.rec-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9000;pointer-events:none;}
.rec-overlay.show{display:flex;}
.rec-box{width:160px;padding:22px 12px 16px;border-radius:12px;background:rgba(0,0,0,0.72);color:#fff;text-align:center;}
.rec-box.cancel{background:rgba(250,81,81,0.88);}
.rec-wave{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:34px;margin-bottom:10px;}
.rec-wave span{width:4px;background:#fff;border-radius:2px;animation:recw 0.9s ease-in-out infinite;}
.rec-wave span:nth-child(2){animation-delay:.15s}.rec-wave span:nth-child(3){animation-delay:.3s}.rec-wave span:nth-child(4){animation-delay:.45s}.rec-wave span:nth-child(5){animation-delay:.6s}
@keyframes recw{0%,100%{height:8px}50%{height:30px}}
.rec-time{font-size:13px;opacity:.85;margin-bottom:6px;}
.rec-tip{font-size:13px;}
.msg-row.mine .voice-line{justify-content:flex-end;}
.msg-row.mine .voice-bubble{flex-direction:row-reverse;}
.msg-row.mine .voice-bubble svg{transform:scaleX(-1);}
.msg-row.mine .voice-to-text{text-align:right;}
.voice-err{color:#fa5151;font-size:16px;margin-right:6px;font-weight:bold;}
.voice-text{background:#fff;border-radius:6px;padding:8px 12px;margin-top:6px;font-size:15px;line-height:1.5;color:#181818;word-break:break-word;}
.img-msg{max-width:160px;max-height:220px;border-radius:6px;display:block;cursor:pointer;background:#eee;}
.img-viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:9999;}
.img-viewer img{max-width:100%;max-height:100%;object-fit:contain;}
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="nav">
  <div class="nav-inner">
    <div class="nav-back" onclick="leaveChat()" style="cursor:pointer;">
      <svg viewBox="0 0 12 22" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 1.5L1.5 11l9 9.5"/></svg>
      <span class="unread-badge" id="unreadBadge" style="display:none"></span>
    </div>
    <div class="nav-title" id="contactName">阿哲</div>
    <div class="nav-more" id="navMoreBtn" style="cursor:pointer;">
      <svg viewBox="0 0 24 24" fill="#000">
        <circle cx="5" cy="12" r="2"/>
        <circle cx="12" cy="12" r="2"/>
        <circle cx="19" cy="12" r="2"/>
      </svg>
    </div>
  </div>
</div>

<div class="rec-overlay" id="recOverlay"><div class="rec-box" id="recBox"><div class="rec-wave"><span></span><span></span><span></span><span></span><span></span></div><div class="rec-time" id="recTime">0"</div><div class="rec-tip" id="recTip">手指上滑，取消发送</div></div></div>

<!-- 聊天区 -->
<div class="chat-area" id="chatArea">
  <div class="time-stamp">下午 10:17</div>
</div>

<!-- 输入栏 -->
<div class="input-bar">
  <div class="voice-btn" id="voiceModeBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
      <circle cx="12" cy="12" r="10" stroke="#181818"/>
      <path d="M9.5 9.5v5M12 8v8M14.5 10v4" stroke="#181818" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="input-wrap">
    <input type="text" class="text-input" id="msgInput" placeholder="">
    <svg class="input-mic" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="1.5">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11c0 3.87 3.13 7 7 7s7-3.13 7-7M12 18v3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="hold-btn" id="holdBtn">按住 说话</div>
  <div class="emoji-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
      <circle cx="12" cy="12" r="10" stroke="#181818"/>
      <circle cx="8.5" cy="10" r="1" fill="#181818"/>
      <circle cx="15.5" cy="10" r="1" fill="#181818"/>
      <path d="M8 14.5c1 1.2 2.4 2 4 2s3-0.8 4-2" stroke="#181818" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="plus-btn" id="plusBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
      <circle cx="12" cy="12" r="10" stroke="#181818"/>
      <path d="M12 8v8M8 12h8" stroke="#181818" stroke-linecap="round"/>
    </svg>
  </div>
  <button class="send-btn" id="sendBtn">发送</button>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const plusBtn = document.getElementById('plusBtn');
const photoInput = document.createElement('input');
photoInput.type = 'file'; photoInput.accept = 'image/*'; photoInput.style.display = 'none';
document.body.appendChild(photoInput);
plusBtn.addEventListener('click', () => { photoInput.value = ''; photoInput.click(); });
photoInput.addEventListener('change', () => { const f = photoInput.files && photoInput.files[0]; if(f) handleMyPhoto(f); });

// 从URL读取联系人id —— 现在是Supabase characters表里的真实UUID
const urlParams = new URLSearchParams(window.location.search);
const characterId = urlParams.get('id') || '';

let contactName = '';
let contactInfo = { avatarImg: null, role: '', character: '', background: '', attitude: '' };
let heroName = '';
let heroAvatar = '';
let sendInFlight = false;

// ---- 头像生成：与wechat-list.html保持一致的逻辑（同一角色在列表和聊天页头像一致） ----
function hashStr(s){
  let h = 0;
  for(let i=0; i<s.length; i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function pickAvatarType(name, roleText, characterText){
  const text = (roleText||'') + (characterText||'');
  if(/艺术|设计|插画|音乐|诗|作家|摄影师|策展/.test(text)) return 'abstract';
  if(/自然|户外|旅行|登山|徒步|田园|海边|骑行|露营/.test(text)) return 'landscape';
  if(/学生|年轻|活泼|网红|游戏|二次元|博主/.test(text)) return 'cartoon';
  const types = ['portrait','portrait','cartoon','landscape','abstract'];
  return types[hashStr(name) % types.length];
}
function avatarUrlFor(type, seed){
  const h = hashStr(seed);
  switch(type){
    case 'portrait': {
      const gender = h % 2 === 0 ? 'women' : 'men';
      const idx = (h % 80) + 1;
      return `https://randomuser.me/api/portraits/${gender}/${idx}.jpg`;
    }
    case 'landscape': {
      const ids = [1018,1015,1043,1036,1039,1050,1044,1024];
      const id = ids[h % ids.length];
      return `https://picsum.photos/id/${id}/200/200`;
    }
    case 'cartoon':
      return `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(seed)}`;
    case 'abstract':
      return `https://api.dicebear.com/7.x/shapes/svg?seed=${encodeURIComponent(seed)}`;
  }
}
function autoAvatarImg(name, roleText, characterText){
  const type = pickAvatarType(name, roleText, characterText);
  return avatarUrlFor(type, name);
}

// 已读状态（数据库没有已读字段，纯本地UI状态）。
// 进来、收到回复、点返回、切出App时都标记，按"现在"和"最后一条消息时间"取较晚的，
// 避免手机时间和服务器时间有细微差异时留下红点。
let lastMsgTime = 0;
function noteMsgTime(t){
  const ms = t ? new Date(t).getTime() : Date.now();
  if(!isNaN(ms) && ms > lastMsgTime) lastMsgTime = ms;
  armIdleDetect();
}

// 一段对话结束后，让后台记录大事、更新备忘：点左上角返回时，或在聊天页 10 分钟没动静时
const IDLE_DETECT_MS = 10 * 60 * 1000;
let idleDetectTimer = null;
function armIdleDetect(){
  clearTimeout(idleDetectTimer);
  idleDetectTimer = setTimeout(() => {
    if(document.visibilityState === 'visible') requestDetect();
  }, IDLE_DETECT_MS);
}
function requestDetect(){
  if(!characterId || !_supabase) return Promise.resolve();
  return _supabase.functions.invoke('chat-character', { body: { action: 'detect', character_id: characterId } })
    .catch(() => {});
}
async function leaveChat(){
  markRead();
  clearTimeout(idleDetectTimer);
  try{ await Promise.race([requestDetect(), new Promise(r => setTimeout(r, 1500))]); }catch(e){}
  location.href = 'wechat-list.html';
}
function markRead(){
  if(!characterId) return;
  try{
    const state = JSON.parse(localStorage.getItem('wechatReadState')||'{}');
    const ms = Math.max(Date.now(), lastMsgTime) + 1000;
    state[characterId] = new Date(ms).toISOString();
    localStorage.setItem('wechatReadState', JSON.stringify(state));
    const counts = JSON.parse(localStorage.getItem('wechatUnreadCounts')||'{}');
    counts[characterId] = 0;
    localStorage.setItem('wechatUnreadCounts', JSON.stringify(counts));
  }catch(e){}
}
function renderOtherUnread(){
  try{
    const counts = JSON.parse(localStorage.getItem('wechatUnreadCounts')||'{}');
    let total = 0;
    Object.keys(counts).forEach(k => { if(k !== characterId) total += (counts[k]||0); });
    const el = document.getElementById('unreadBadge');
    if(!el) return;
    el.textContent = total > 99 ? '99+' : String(total);
    el.style.display = total > 0 ? '' : 'none';
  }catch(e){}
}
// 实时从数据库算"其他人的未读数"，不再只依赖列表页上次存的数字
async function refreshOtherUnread(){
  try{
    if(!_supabase || !_userId) return;
    const now = new Date();
    const since = new Date(now.getTime() - 30*24*3600*1000).toISOString();
    const { data, error } = await _supabase
      .from('messages')
      .select('character_id, sent_at')
      .eq('user_id', _userId)
      .eq('channel', 'wechat')
      .eq('direction', 'incoming')
      .gte('sent_at', since)
      .lte('sent_at', now.toISOString())
      .order('sent_at', { ascending: false })
      .limit(1000);
    if(error) return;
    const state = JSON.parse(localStorage.getItem('wechatReadState')||'{}');
    const counts = {};
    (data||[]).forEach(m => {
      const lastRead = state[m.character_id] ? new Date(state[m.character_id]).getTime() : 0;
      if(new Date(m.sent_at).getTime() > lastRead) counts[m.character_id] = (counts[m.character_id]||0) + 1;
    });
    if(characterId) counts[characterId] = 0;
    localStorage.setItem('wechatUnreadCounts', JSON.stringify(counts));
    renderOtherUnread();
  }catch(e){}
}
setInterval(refreshOtherUnread, 20000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') refreshOtherUnread(); });
window.addEventListener('pagehide', markRead);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') markRead(); });

// 插入一行消息：默认追加到底部；加载更早记录时插到顶部指定位置
let prependAnchor = null;
function insertRow(row){
  if(prependAnchor){
    chatArea.insertBefore(row, prependAnchor);
  } else {
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }
}

function addMessage(text, mine = false) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (mine ? ' mine' : '');

  const avatar = document.createElement('div');
  avatar.className = 'avatar' + (mine ? ' mine-avatar' : '');
  if(mine && heroAvatar){
    avatar.innerHTML = `<img src="${heroAvatar}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
  } else if(!mine && contactInfo.avatarImg){
    avatar.innerHTML = `<img src="${contactInfo.avatarImg}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
  } else {
    avatar.textContent = mine ? '我' : (contactName[0]||'?');
  }

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);

  row.appendChild(avatar);
  row.appendChild(wrap);
  insertRow(row);
}

// 图片消息（角色发来的愿景版图片：metadata.image_url）
function openImageViewer(url){
  const v = document.createElement('div');
  v.className = 'img-viewer';
  const img = document.createElement('img');
  img.src = url;
  v.appendChild(img);
  v.addEventListener('click', () => v.remove());
  document.body.appendChild(v);
}
function addImageMessage(url, mine = false){
  const row = document.createElement('div');
  row.className = 'msg-row' + (mine ? ' mine' : '');
  const avatar = document.createElement('div');
  avatar.className = 'avatar' + (mine ? ' mine-avatar' : '');
  if(mine && heroAvatar){
    avatar.innerHTML = `<img src="${heroAvatar}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
  } else if(!mine && contactInfo.avatarImg){
    avatar.innerHTML = `<img src="${contactInfo.avatarImg}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
  } else {
    avatar.textContent = mine ? '我' : (contactName[0]||'?');
  }
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const img = document.createElement('img');
  img.className = 'img-msg';
  img.src = url;
  img.loading = 'lazy';
  img.addEventListener('load', () => { if(!prependAnchor) chatArea.scrollTop = chatArea.scrollHeight; });
  img.addEventListener('click', () => openImageViewer(url));
  wrap.appendChild(img);
  row.appendChild(avatar);
  row.appendChild(wrap);
  insertRow(row);
  return img;
}

// 我发的照片：私有存储，打开时临时签名链接
async function addMyPhotoFromPath(path){
  const img = addImageMessage('data:image/gif;base64,R0lGODlhAQABAAAAACw=', true);
  if(!path || !_supabase) return;
  try{
    const { data } = await _supabase.storage.from('user-photos').createSignedUrl(path, 3600);
    if(data && data.signedUrl){
      img.src = data.signedUrl;
      img.onclick = () => openImageViewer(data.signedUrl);
    }
  }catch(e){}
}

// 把相册里的照片压缩成 jpeg（最长边 1600），省流量也让看图更快
function compressImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const max = 1600;
      let w = im.naturalWidth, h = im.naturalHeight;
      if(Math.max(w,h) > max){ const k = max / Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('compress failed')), 'image/jpeg', 0.85);
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('无法读取这张图片')); };
    im.src = url;
  });
}

async function handleMyPhoto(file){
  if(!file || !_supabase || !_userId) return;
  let blob;
  try{ blob = await compressImage(file); }catch(e){ flashTip('这张图片打不开，换一张试试'); return; }
  const localUrl = URL.createObjectURL(blob);
  const img = addImageMessage(localUrl, true);
  img.style.opacity = '0.6';
  noteMsgTime();
  try{
    const path = `${_userId}/${characterId}/${Date.now()}.jpg`;
    const up = await _supabase.storage.from('user-photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if(up.error) throw up.error;
    let description = '';
    try{

let voiceService = null;
let currentAudio = null;
let currentBubble = null;
let currentUrl = null;

function getPlayedState(){
  try{ return JSON.parse(localStorage.getItem('voicePlayedState')||'{}'); }catch(e){ return {}; }
}
function markPlayed(id){
  try{
    const s = getPlayedState();
    s[id] = 1;
    localStorage.setItem('voicePlayedState', JSON.stringify(s));
  }catch(e){}
}

function stopCurrentAudio(){
  if(currentAudio){ try{ currentAudio.pause(); }catch(e){} }
  if(currentBubble) currentBubble.classList.remove('playing');
  if(currentUrl){ try{ URL.revokeObjectURL(currentUrl); }catch(e){} }
  currentAudio = null; currentBubble = null; currentUrl = null;
}

function setVoiceWidth(bubble, durEl, seconds){
  const s = Math.max(1, Math.min(60, Math.round(seconds)));
  durEl.textContent = s + '"';
  bubble.style.width = Math.min(220, 80 + s * 5) + 'px';
}

function readBlobDuration(blob){
  return new Promise((resolve) => {
    try{
      const url = URL.createObjectURL(blob);
      const a = new Audio();
      a.preload = 'metadata';
      a.onloadedmetadata = () => { const d = a.duration; URL.revokeObjectURL(url); resolve(isFinite(d) ? d : null); };
      a.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      a.src = url;
    }catch(e){ resolve(null); }
  });
}

function addVoiceMessage(m){
  const row = document.createElement('div');
  row.className = 'msg-row';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  if(contactInfo.avatarImg){

  } else {
    avatar.textContent = contactName[0]||'?';
  }

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';

  const line = document.createElement('div');
  line.className = 'voice-line';

  const bubble = document.createElement('div');
  bubble.className = 'bubble voice-bubble';
  bubble.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="#181818" stroke-width="2" stroke-linecap="round">' +
      '<circle cx="5" cy="12" r="1.6" fill="#181818" stroke="none"/>' +
      '<path class="vw2" d="M9 8.5a5 5 0 0 1 0 7"/>' +
      '<path class="vw3" d="M13 5.5a9 9 0 0 1 0 13"/>' +
    '</svg><span class="voice-dur"></span>';
  const durEl = bubble.querySelector('.voice-dur');
  setVoiceWidth(bubble, durEl, (m.content||'').length / 4);

  line.appendChild(bubble);
  let dot = null;
  if(!getPlayedState()[m.id]){
    dot = document.createElement('span');
    dot.className = 'voice-dot';
    line.appendChild(dot);
  }

  const toText = document.createElement('div');
  toText.className = 'voice-to-text';
  toText.textContent = '转文字';
  const textBox = document.createElement('div');
  textBox.className = 'voice-text';
  textBox.textContent = m.content || '';
  textBox.style.display = 'none';
  toText.addEventListener('click', () => {
    const show = textBox.style.display === 'none';
    textBox.style.display = show ? 'block' : 'none';
    toText.textContent = show ? '收起' : '转文字';
  });

  bubble.addEventListener('click', async () => {
    if(currentBubble === bubble){ stopCurrentAudio(); return; }
    stopCurrentAudio();
    if(!voiceService) return;
    bubble.classList.add('loading');
    const blob = await voiceService.getVoiceBlob(m.id);
    bubble.classList.remove('loading');
    if(!blob){
      textBox.style.display = 'block';
      toText.textContent = '收起';
      return;
    }
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio; currentBubble = bubble; currentUrl = url;
    bubble.classList.add('playing');
    audio.onended = () => { if(currentBubble === bubble) stopCurrentAudio(); };
    audio.onloadedmetadata = () => { if(isFinite(audio.duration)) setVoiceWidth(bubble, durEl, audio.duration); };
    try{ await audio.play(); }catch(e){ console.warn('播放失败', e); stopCurrentAudio(); return; }
    markPlayed(m.id);
    if(dot){ dot.remove(); dot = null; }
  });

  wrap.appendChild(line);
  wrap.appendChild(toText);
  wrap.appendChild(textBox);
  row.appendChild(avatar);
  row.appendChild(wrap);
  insertRow(row);

  // 后台预热：本地没有就生成一次并缓存，同时拿到真实时长
  if(voiceService){
    voiceService.getVoiceBlob(m.id).then(async (blob) => {
      if(!blob) return;
      const d = await readBlobDuration(blob);
      if(d) setVoiceWidth(bubble, durEl, d);
    }).catch(()=>{});
  }
}

function addMyVoiceMessage(opts){
  const row = document.createElement('div');
  row.className = 'msg-row mine';

  avatar.className = 'avatar mine-avatar';
  if(heroAvatar) avatar.innerHTML = `<img src="${heroAvatar}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
  else avatar.textContent = '我';
  const wrap = document.createElement('div');

  const line = document.createElement('div');
  line.className = 'voice-line';
  const bubble = document.createElement('div');
  bubble.className = 'bubble voice-bubble' + (opts.pending ? ' loading' : '');
  bubble.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="#181818" stroke-width="2" stroke-linecap="round">' +
      '<circle cx="5" cy="12" r="1.6" fill="#181818" stroke="none"/>' +
      '<path class="vw2" d="M9 8.5a5 5 0 0 1 0 7"/>' +
      '<path class="vw3" d="M13 5.5a9 9 0 0 1 0 13"/>' +
    '</svg><span class="voice-dur"></span>';
  const durEl = bubble.querySelector('.voice-dur');
  setVoiceWidth(bubble, durEl, opts.duration || 1);
  let errEl = null;
  line.appendChild(bubble);
  const toText = document.createElement('div');
  toText.className = 'voice-to-text';
  toText.textContent = '转文字';
  const textBox = document.createElement('div');
  textBox.className = 'voice-text';
  textBox.style.display = 'none';
  let transcript = opts.transcript || '';
  textBox.textContent = transcript;
  toText.style.display = transcript ? '' : 'none';
  toText.addEventListener('click', () => {
    const show = textBox.style.display === 'none';
    textBox.style.display = show ? 'block' : 'none';
    toText.textContent = show ? '收起' : '转文字';
  });
  let path = opts.path || null;
  bubble.addEventListener('click', async () => {
    if(currentBubble === bubble){ stopCurrentAudio(); return; }
    stopCurrentAudio();
    let blob = (path && myVoiceBlobs[path]) || opts.blob || null;
    if(!blob && path && _supabase){
      bubble.classList.add('loading');
      try{ const { data } = await _supabase.storage.from('user-voice').download(path); blob = data || null; }catch(e){}
      bubble.classList.remove('loading');
      if(blob) myVoiceBlobs[path] = blob;
    }
    if(!blob) return;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio; currentBubble = bubble; currentUrl = url;
    bubble.classList.add('playing');
    audio.onended = () => { if(currentBubble === bubble) stopCurrentAudio(); };
    try{ await audio.play(); }catch(e){ stopCurrentAudio(); }
  });
  wrap.appendChild(line);
  wrap.appendChild(toText);
  wrap.appendChild(textBox);
  row.appendChild(avatar);
  row.appendChild(wrap);
  insertRow(row);
  return {
    done(p, text){
      path = p; transcript = text; bubble.classList.remove('loading');
      textBox.textContent = text; toText.style.display = '';
    },
    fail(msg){
      bubble.classList.remove('loading');
      if(!errEl){ errEl = document.createElement('span'); errEl.className = 'voice-err'; errEl.textContent = '!'; line.insertBefore(errEl, bubble); }
      textBox.textContent = msg; textBox.style.display = 'block'; toText.style.display = 'none';
    }
  };
}

const recOverlay = document.getElementById('recOverlay');
const recBox = document.getElementById('recBox');
const recTip = document.getElementById('recTip');
const recTime = document.getElementById('recTime');
let rec = null, recStream = null, recChunks = [], recStart = 0, recStartY = 0, recCancel = false, recTimer = null, recPressed = false;
const MAX_REC_MS = 60000, MIN_REC_MS = 1000;

function pickMime(){
  if(typeof MediaRecorder === 'undefined') return null;
  for(const m of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']){
    try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){}
  }
  return '';
}
function showRecUI(){
  recOverlay.classList.add('show'); recBox.classList.remove('cancel');
  recTip.textContent = '手指上滑，取消发送'; recTime.textContent = '0"';
  holdBtn.classList.add('pressing'); holdBtn.textContent = '松开 发送';
}
function hideRecUI(){
  recOverlay.classList.remove('show'); holdBtn.classList.remove('pressing'); holdBtn.textContent = '按住 说话';
  clearInterval(recTimer); recTimer = null;
}
function releaseStream(){ if(recStream){ recStream.getTracks().forEach(t => t.stop()); recStream = null; } }
function flashTip(text){
  recOverlay.classList.add('show'); recBox.classList.remove('cancel'); recTip.textContent = text; recTime.textContent = '';
  setTimeout(() => recOverlay.classList.remove('show'), 1000);
}

async function startRec(y){
  recPressed = true; recCancel = false; recStartY = y; recChunks = [];
  const mime = pickMime();
  if(mime === null || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ flashTip('这台设备暂不支持录音'); recPressed = false; return; }
  try{
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){ flashTip('没有麦克风权限'); recPressed = false; return; }
  if(!recPressed){ releaseStream(); return; } // 授权弹窗期间已经松手
  try{ rec = mime ? new MediaRecorder(recStream, { mimeType: mime }) : new MediaRecorder(recStream); }
  catch(e){ releaseStream(); flashTip('录音启动失败'); recPressed = false; return; }
  rec.ondataavailable = (e) => { if(e.data && e.data.size) recChunks.push(e.data); };
  rec.start();
  recStart = Date.now();
  showRecUI();
  recTimer = setInterval(() => {
    const ms = Date.now() - recStart;
    recTime.textContent = Math.floor(ms/1000) + '"';
    if(ms >= MAX_REC_MS) endRec();
  }, 200);
}
function moveRec(y){
  if(!rec) return;
  const cancel = recStartY - y > 70;
  if(cancel !== recCancel){
    recCancel = cancel;
    recBox.classList.toggle('cancel', cancel);
    recTip.textContent = cancel ? '松开手指，取消发送' : '手指上滑，取消发送';
  }
}
function endRec(){
  recPressed = false;
  if(!rec){ hideRecUI(); return; }
  const r = rec; rec = null;
  const ms = Date.now() - recStart;
  const cancel = recCancel;
  hideRecUI();
  r.onstop = () => {
    releaseStream();
    if(cancel) return;
    if(ms < MIN_REC_MS){ flashTip('说话时间太短'); return; }
    const type = r.mimeType || (recChunks[0] && recChunks[0].type) || 'audio/mp4';
    const blob = new Blob(recChunks, { type });
    handleMyVoice(blob, ms / 1000, type);
  };
  try{ r.stop(); }catch(e){ releaseStream(); }
}

async function handleMyVoice(blob, seconds, type){
  const ext = /webm/.test(type) ? 'webm' : 'm4a';
  const ctl = addMyVoiceMessage({ duration: seconds, blob, pending: true });
  noteMsgTime();
  try{
    const path = `${_userId}/${characterId}/${Date.now()}.${ext}`;
    const up = await _supabase.storage.from('user-voice').upload(path, blob, { contentType: type.split(';')[0], upsert: false });
    if(up.error) throw up.error;
    myVoiceBlobs[path] = blob;
    const { data, error } = await _supabase.functions.invoke('voice-transcribe', { body: { path } });
    if(error || !data || !data.text) throw (error || new Error('empty'));
    ctl.done(path, data.text);
    pendingTexts.push({ text: data.text, voice: { path, duration: Math.round(seconds) } });
    scheduleFlush();
  }catch(e){
    console.error('voice send failed', e);
    ctl.fail('没听清，再说一遍试试');
  }
}

// 根据文字长度估算像真人一样的打字时长
function estimateTypingMs(text){
  const len = (text||'').length;
  const perChar = 90 + Math.random()*50;
  const base = len * perChar;
  return Math.min(9000, Math.max(700, base));
}

}

// ============================================================
// 发送：像真微信一样可以连发。
// 你发出的每句先显示在屏幕上、放进待发队列；停止输入约 2.5 秒后，
// 把这几句一起交给对方，对方看完一起回。对方回复过程中你继续发的，
// 等这轮回完再接着处理。对方的回复按换行拆成几条气泡依次出现。
// ============================================================
const BATCH_IDLE_MS = 2500;
let pendingTexts = [];
let batchTimer = null;

function scheduleFlush(){
  clearTimeout(batchTimer);
  batchTimer = setTimeout(flushPending, BATCH_IDLE_MS);
}

async function flushPending(){
  if(sendInFlight || pendingTexts.length === 0) return;
  const batch = pendingTexts.splice(0, pendingTexts.length);
  await sendAndGetReply(batch);
  if(pendingTexts.length > 0) scheduleFlush();
}

async function sendAndGetReply(items){
  const texts = items.map(x => typeof x === 'string' ? x : x.text);
  const voiceMeta = items.map(x => (x && typeof x === 'object') ? (x.voice || x.photo || null) : null);
  sendInFlight = true;
  await sleep(readDelay());
  showTyping();
  const typingStart = Date.now();
  try{
    const { sendMessage } = await import('./js/services/chatService.js');
    const result = await sendMessage(characterId, null, texts, voiceMeta);
    if(!result.success){
      hideTyping();
      const msg = (result.error && (result.error.message || (result.error.detail && result.error.detail.error))) || '未知错误';
      addMessage('（消息发送失败：' + msg + '）');
      sendInFlight = false;
      return;
    }
    // 发消息后服务器会撤掉 TA 未到点的主动消息，这里立刻同步一次，取消对应的本地推送
    import('./js/services/notificationSync.js').then(m => m.syncNotifications()).catch(() => {});
    let replies = (result.data && Array.isArray(result.data.replies) && result.data.replies.length)
      ? result.data.replies
      : String((result.data && result.data.reply) || '……').split(/\n+/).filter(t => t.trim());
    if(replies.length === 0) replies = ['……'];
    for(let i = 0; i < replies.length; i++){
      let reply = replies[i];
      if (contactName) reply = reply.replace(new RegExp('^' + contactName + '[：:]\\s*'), '');
      let remaining = estimateTypingMs(reply) - (i === 0 ? (Date.now() - typingStart) : 0);
      if(i === 0 && remaining > 1800 && Math.random() < 0.5){
        const pause = remaining * 0.4;
        await sleep(pause);
        hideTyping();
        await sleep(300 + Math.random()*450);
        showTyping();
        remaining -= pause;
      }
      if(remaining > 0) await sleep(remaining);
      hideTyping();
      addMessage(reply);
      noteMsgTime();
      if(i < replies.length - 1){
        await sleep(250 + Math.random()*400);
        showTyping();
      }
    }
    markRead();
  }catch(err){
    hideTyping();
    addMessage('……（网络好像有点问题）');
  }
  sendInFlight = false;
}

  _loadUntil = new Date().toISOString();

  const { data: msgs, error: msgError } = await fetchPage(null);
  if(msgError){
    console.error(msgError);
    chatArea.innerHTML = '<div class="time-stamp">加载聊天记录失败</div>';
    return;
  }

  chatArea.innerHTML = '';
  try{ voiceService = await import('./js/services/voiceService.js'); }catch(e){ voiceService = null; }
  renderMessages(msgs);
  updateLoadMore(msgs.length === PAGE_SIZE);
  chatArea.scrollTop = chatArea.scrollHeight;

  if(msgs.length === 0){
    chatArea.innerHTML = '<div class="time-stamp">还没有消息</div>';
  }
  markRead();
  import('./js/services/notificationSync.js').then(m => m.syncNotifications()).catch(() => {});
}

// ============================================================
// 分页加载：先显示最近 PAGE_SIZE 条，顶部"查看更早的消息"再往前加载
// （数据库一次最多返回 1000 条，消息多了以后不分页会看不到新消息）
// ============================================================
const PAGE_SIZE = 200;
let _supabase = null, _userId = null, _loadUntil = null, _oldestSentAt = null, _loadingMore = false;

async function fetchPage(beforeIso){
  let q = _supabase
    .from('messages')
    .select('id, content, direction, sent_at, metadata')
    .eq('user_id', _userId)
    .eq('character_id', characterId)
    .eq('channel', 'wechat')
    .lte('sent_at', _loadUntil);
  if(beforeIso) q = q.lt('sent_at', beforeIso);
  const { data, error } = await q.order('sent_at', { ascending: false }).limit(PAGE_SIZE);
  if(error) return { data: [], error };
  const rows = (data || []).slice().reverse();
  if(rows.length) _oldestSentAt = rows[0].sent_at;
  return { data: rows, error: null };
}

function renderMessages(msgs){
  (msgs||[]).forEach(m => {
    if(m.direction === 'outgoing' && m.metadata && m.metadata.user_photo){
      addMyPhotoFromPath(m.metadata.photo_path);
    }
    else if(m.direction === 'outgoing' && m.metadata && m.metadata.user_voice){
      addMyVoiceMessage({ duration: m.metadata.duration, path: m.metadata.audio_path, transcript: m.content });
    }
    else if(voiceService && voiceService.isVoiceMessage(m)) addVoiceMessage(m);
    else if(m.content) addMessage(m.content, m.direction === 'outgoing');
    if(m.metadata && m.metadata.image_url) addImageMessage(m.metadata.image_url, m.direction === 'outgoing');
    noteMsgTime(m.sent_at);
  });
}

function updateLoadMore(hasMore){
  let btn = document.getElementById('loadMoreBtn');
  if(!hasMore){ if(btn) btn.remove(); return; }
  if(!btn){
    btn = document.createElement('div');
    btn.id = 'loadMoreBtn';
    btn.className = 'time-stamp';
    btn.style.cursor = 'pointer';
    btn.textContent = '查看更早的消息';
    btn.onclick = loadOlder;
  }
  chatArea.insertBefore(btn, chatArea.firstChild);
}

async function loadOlder(){
  if(_loadingMore || !_oldestSentAt) return;
  _loadingMore = true;
  const btn = document.getElementById('loadMoreBtn');
  if(btn) btn.textContent = '加载中…';
  const { data: older, error } = await fetchPage(_oldestSentAt);
  if(error){
    if(btn) btn.textContent = '加载失败，点击重试';
    _loadingMore = false;
    return;
  }
  const prevHeight = chatArea.scrollHeight;
  const prevTop = chatArea.scrollTop;
  prependAnchor = btn ? btn.nextSibling : chatArea.firstChild;
  renderMessages(older);
  prependAnchor = null;
  if(btn) btn.textContent = '查看更早的消息';
  updateLoadMore(older.length === PAGE_SIZE);
  chatArea.scrollTop = chatArea.scrollHeight - prevHeight + prevTop;
  _loadingMore = false;
}

init();
</script>
